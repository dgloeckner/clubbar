        card_uid:
          type: string
        reason:
          type: string
          nullable: true
        blocked_at:
          type: string
          format: date-time
        blocked_by_admin_id:
          type: string
          format: uuid

    # --------------------------------------------------------------------------
    # GDPR Export
    # --------------------------------------------------------------------------
    GdprExport:
      type: object
      description: GDPR data export (Art. 15 / Art. 20)
      properties:
        export_info:
          type: object
          properties:
            export_date:
              type: string
              format: date-time
            export_type:
              type: string
              enum: [gdpr_access, gdpr_portability]
            format_version:
              type: string
        personal_data:
          type: object
          properties:
            first_name:
              type: string
            last_name:
              type: string
            email:
              type: string
              nullable: true
            card_uid:
              type: string
              nullable: true
            preferred_language:
              type: string
            iban_last4:
              type: string
              nullable: true
              description: |
                Last four characters only. GDPR Art. 15 asks for the personal
                data the controller holds, and what is held is a sealed
                ciphertext the server cannot open
                ([ADR-0036](../../adr/0036-iban-encryption-sealed-box.md));
                `mandate_reference` identifies the mandate the account belongs to.
            iban_masked:
              type: string
              nullable: true
            mandate_reference:
              type: string
            member_since:
              type: string
              format: date
            is_active:
              type: boolean
        transactions:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date-time
              type:
                type: string
              product_name:
                type: string
                nullable: true
              amount_cents:
                type: integer
              notes:
                type: string
                nullable: true
        settlements:
          type: array
          items:
            type: object
            properties:
              period_start:
                type: string
                format: date
              period_end:
                type: string
                format: date
              amount_cents:
                type: integer
              execution_date:
                type: string
                format: date
        current_balance:
          type: object
          properties:
            outstanding_cents:
              type: integer
            pending_transaction_count:
              type: integer

    SecurityFinding:
      type: object
      description: |
        One measured row of the security self-check. `observed` is what the
        system answered, in its own words; `remedy` says what to do about it
        and is present on every row that is not `pass` — including the rows
        whose remedy is "your host does not allow this", which ADR-0031
        accepts as an outcome rather than a permanent failure.
      required: [id, category, label, status, observed]
      properties:
        id:
          type: string
          description: Stable identifier for this check, e.g. `session_strict_mode`
          example: session_strict_mode
        category:
          type: string
          enum: [runtime, session, data, exposure, transport, delivery, backup]
        label:
          type: string
          description: What the check asserts, in English
          example: PHP refuses session IDs it did not issue
        status:
          type: string
          enum: [pass, warn, fail, unknown]
          description: |
            `pass` — the effective state was observed to be the intended one.
            `warn` — weaker than intended; the installation still works.
            `fail` — credentials or member data are exposed.
            `unknown` — not measurable from here, which is never a pass.
        observed:
          type: string
          description: The measured value
          example: session.use_strict_mode=On
        remedy:
          type: string
          nullable: true
          description: What to do about it; null on a passing row

    SecurityReport:
      type: object
      required: [generated_at, status, summary, findings]
      properties:
        generated_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [pass, warn, fail]
          description: The worst row in the report; an `unknown` row counts as a warning
        summary:
          type: object
          description: Row counts by status
          properties:
            pass:
              type: integer
            warn:
              type: integer
            fail:
              type: integer
            unknown:
              type: integer
        findings:
          type: array
          items:
            $ref: '#/components/schemas/SecurityFinding'

    EncryptionKey:
      type: object
      description: |
        One IBAN encryption keypair as the server knows it
        ([ADR-0036](../../adr/0036-iban-encryption-sealed-box.md)) — metadata
        and the **public** half only. The database never contains a private
        key: it lives in the club's offline archive and is supplied per
        privileged request.
      required: [id, key_identifier, algorithm, public_key, fingerprint_sha256, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        key_identifier:
          type: string
          description: Human-facing name given when the key was registered
          example: club-key-2027
        algorithm:
          type: string
          example: SODIUM_CRYPTO_BOX_SEAL
        public_key:
          type: string
          description: The 32-byte Curve25519 public key, base64-encoded
        fingerprint_sha256:
          type: string
          description: SHA-256 of the raw public key — how a key is identified to humans
        status:
          type: string
          enum: [pending, active, retiring, retired, revoked, compromised]
          description: |
            `pending` — registered, not yet in use.
            `active` — every new IBAN is sealed under it; exactly one key is active.
            `retiring` — superseded; its rows are being re-encrypted.
            `retired` — rotation finished, nothing sealed under it any more.
            `revoked` / `compromised` — withdrawn immediately, regardless of remaining lifetime.
        created_at:
          type: string
          format: date-time
        activated_at:
          type: string
          format: date-time
          nullable: true
          description: When the 365-day cryptoperiod started
        expires_at:
          type: string
          format: date-time
          nullable: true
        retired_at:
          type: string
          format: date-time
          nullable: true
        days_until_expiry:
          type: integer
          nullable: true
          description: |
            Whole days left, negative once expired; null for a key that is not
            operational (pending, retired, revoked, compromised). Computed at
            request time — shared hosting has no cron (ADR-0031).
        lifecycle_state:
          type: string
          enum: [ok, info, warning, critical, expired]
          description: Warning tier — `info` ≤ 90 days, `warning` ≤ 30, `critical` ≤ 7
        sealed_record_count:
          type: integer
          nullable: true
          description: |
            Mandate rows still sealed under this key. On a retiring key this is
            the rotation backlog; it must reach 0 before the key can be retired.

    KeyRotationBatch:
      type: object
      description: What one re-encryption batch moved from the old key to the active one.
      required: [source_key_id, target_key_id, processed, skipped, remaining, drained]
      properties:
        source_key_id:
          type: string
          format: uuid
        target_key_id:
          type: string
          format: uuid
          description: The ACTIVE key the rows were re-sealed under
        processed:
          type: integer
          description: Rows re-sealed by this batch
        skipped:
          type: integer
          description: |
            Rows a concurrent member edit had already moved to the active key.
            Not a failure — the edit wins by design, and the row has left the
            backlog either way.
        remaining:
          type: integer
          description: Rows still sealed under the source key after this batch
        drained:
          type: boolean
          description: True when `remaining` is 0 and the rotation can be completed

    DashboardResponse:
      type: object
      description: Complete dashboard response with aggregated metrics and system data
      properties:
        metrics:
          type: object
          description: Business metrics aggregated from all modules
          properties:
            active_members:
              type: integer
              description: Count of active members
            inactive_members:
              type: integer
              description: Count of inactive members
            outstanding_balance_cents:
              type: integer
              description: Total unsettled transaction balance in cents
            todays_revenue_cents:
              type: integer
              description: >-
                Sum of purchases that occurred today, in cents. Stornos and payouts are
                excluded, matching the revenue reports; the outstanding balance is the
                figure that nets them off.
            wtd_revenue_cents:
              type: integer
              description: Sum of purchases since Monday this week (week-to-date) in cents
            mtd_revenue_cents:
              type: integer
              description: Sum of purchases since the 1st of the month (month-to-date) in cents
            terminal_count:
              type: integer
              description: Total number of terminals (active and inactive)
            active_terminals:
              type: integer
              description: >-
                Count of terminals currently online (enabled and synced within the last
                5 minutes) — matches the `online` count in `terminal_status`, not merely
                enabled terminals
            settled_members:
              type: integer
              description: Number of unique members with settled transactions
            sepa_issue_count:
              type: integer
              description: Count of members with incomplete SEPA data
        recent_transactions:
          type: array
          description: Last 10 transactions ordered by creation time
          items:
            type: object
            required: [id, member_id, member_name, type, amount_cents, timestamp]
            properties:
              id:
                type: string
                format: uuid
              member_id:
                type: string
                format: uuid
              member_name:
                type: string
                description: Display name (first + last name or card_uid)
              terminal_name:
                type: string
                nullable: true
                description: Name of the terminal the transaction was created on
              type:
                type: string
                enum: [purchase, storno, payout]
              amount_cents:
                type: integer
              product_name:
                type: string
                description: Product name or manual entry description
              timestamp:
                type: string
                format: date-time
                description: ISO 8601 transaction creation time
        terminal_status:
          type: array
          description: Status of all terminals with connectivity information
          items:
            type: object
            required: [id, name, is_active, status]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              is_active:
                type: boolean
              last_sync_at:
                type: string
                format: date-time
                nullable: true
              status:
                type: string
                enum: [online, offline, disabled]
                description: |
                  - online: synced within 5 minutes
                  - offline: no sync or synced > 5 minutes ago
                  - disabled: terminal is inactive
        system_status:
          type: object
          description: High-level system status indicators
          properties:
            last_settlement_date:
              type: string
              format: date-time
              nullable: true
              description: Last settlement creation timestamp
            pending_settlement_count:
              type: integer
              description: Count of non-cancelled settlements
            total_members:
              type: integer
              description: Total member count (active + inactive)
            total_transactions:
              type: integer
              description: Total transaction count
            database_health:
              type: string
              enum: [ok]
              description: Database connectivity status
        alerts:
          type: object
          description: Admin alerts requiring attention
          properties:
            sepa_issues:
              type: object
              properties:
                count:
                  type: integer
                  description: Number of members with incomplete SEPA data
                severity:
                  type: string
                  enum: [none, warning, error]
                  description: |
                    - none: 0 members with issues
                    - warning: 1-5 members with issues
                    - error: 6+ members with issues
                message:
                  type: string
                  description: Human-readable alert message
            encryption_key:
              type: object
              description: |
                Remaining lifetime of the ACTIVE IBAN encryption key
                ([ADR-0036](../../adr/0036-iban-encryption-sealed-box.md)).

                Computed on every dashboard load rather than by a scheduler:
                shared hosting guarantees no cron (ADR-0031), and this is the
                warning an admin cannot miss. `missing` is the loudest state —
                until a key is activated, no member's bank details can be
                stored at all.
              properties:
                state:
                  type: string
                  enum: [missing, ok, info, warning, critical, expired]
                  description: Warning tier — `info` ≤ 90 days, `warning` ≤ 30, `critical` ≤ 7
                severity:
                  type: string
                  enum: [none, warning, error]
                  description: |
                    - none: `ok`
                    - warning: `info` or `warning`
                    - error: `critical`, `expired` or `missing`
                key_identifier:
                  type: string
                  nullable: true
                days_until_expiry:
                  type: integer
                  nullable: true
                message:
                  type: string
                  description: |
                    Human-readable alert message. Always English — the admin
                    frontend builds its own wording from `state`,
                    `key_identifier` and `days_until_expiry`.
            sepa_config:
              type: object
              description: |
                Whether SEPA is actually ready to collect: the creditor
                identity the bank needs, and the externally hosted mandate
                template URL a new member is sent to sign (#360/#456).
                `SepaExportService` refuses to export a settlement while
                either is missing — this is the same completeness check,
                surfaced before an admin hits that block.
              properties:
                state:
                  type: string
                  enum: [ok, creditor_missing, mandate_template_missing]
                  description: |
                    Which half is missing, as a fact rather than a sentence, so
                    a client that renders in its own language does not have to
                    parse `message`:

                    - `creditor_missing`: no `sepa_config` row, or one without
                      creditor id, name or IBAN
                    - `mandate_template_missing`: creditor details are set but
                      no mandate template URL is
                    - `ok`: both are set
                severity:
                  type: string
                  enum: [none, error]
                  description: |
                    - none: creditor details and mandate_template_url are all set
                    - error: something required for SEPA export is missing
                message:
                  type: string
                  description: |
                    Human-readable alert message. Always English — the admin
                    frontend builds its own wording from `state`.
            jugendschutz_violation:
              type: object
              description: |
                Underage sales that nobody has acknowledged yet (#622,
                ADR-0045 §3). Raised at sync when a terminal working from a
                stale cache sold an age-restricted drink to a member who had not
                reached its `min_age` at the time.

                Counts **unacknowledged** violations rather than all of them.
                The record is permanent — invariant 4 — but an alert that can
                never be dismissed is one people learn to stop seeing, which
                would leave the next violation as invisible as the first. The
                two do not conflict because they are different objects: the
                audit entry is the record, this is the asking.

                Carries no member and no age. It renders on a screen that may be
                open in the clubroom, and ADR-0045 rule 6 does not stop at the
                till.
              properties:
                count:
                  type: integer
                  description: Recorded violations with no acknowledgement
                severity:
                  type: string
                  enum: [none, error]
                  description: |
                    - none: nothing unacknowledged
                    - error: one or more. There is no `warning` tier — every
                      other alert here grades by volume because it is about
                      money or infrastructure drifting; this one is about a
                      minor having been served alcohol, which is an incident at
                      n=1
                message:
                  type: string
                  description: Human-readable alert message, naming no member
                latest_occurred_at:
                  type: string
                  nullable: true
                  description: When the most recent unacknowledged one was recorded
            terminal_anomaly:
              type: object
              description: |
                Terminals whose credential looks like it is in use on more than
                one device (ADR-0041). Raised by the cron tick from two signals
                recorded on ordinary terminal traffic: two source addresses
                active at the same time for a sustained period, or a delta sync
                cursor that does not continue the history this token has been
                building.

                Alert only. Nothing here has blocked, revoked or rate-limited
                anything — every kind has an innocent explanation, and the cost
                of acting on a false positive is a bar that cannot sell.
              properties:
                count:
                  type: integer
                  description: Open, unacknowledged anomaly rows
                severity:
                  type: string
                  enum: [none, warning, error]
                  description: |
                    - none: nothing open
                    - warning: only cursor anomalies, which a restore from
                      backup or a re-provisioning also produces
                    - error: concurrent use, the one kind with no routine
                      innocent cause
                kinds:
                  type: array
                  description: Distinct anomaly kinds currently open
                  items:
                    type: string
                    enum: [concurrent_ip, cursor_regression, cursor_reset]
                message:
                  type: string
                  description: |
                    Human-readable (English) alert message. Names the
                    terminal when exactly one is affected; counts distinct
                    terminals beyond that. The admin frontend does not render
                    this directly — it builds a localized string from
                    `terminal_count`/`terminal_name` instead — but it is kept
                    for API consumers that have no locale of their own.
                terminal_count:
                  type: integer
                  description: >
                    Distinct terminals with an open anomaly. Not the same as
                    `count`: one till can carry both a concurrent-use row and
                    a cursor row for the same incident.
                terminal_name:
                  type: string
                  nullable: true
                  description: >
                    The affected terminal's name, set only when
                    `terminal_count` is exactly 1 — the one case an admin can
                    act on without opening anything.
        members_near_limit:
          type: object
          description: |
            Active members whose Deckel has reached the warning band of **their
            own** ceiling — who the bar is about to have to turn away.

            The band and the ceiling are the terminal's own (UC-T11 E3, UC-T12):
            a member appears here exactly when the terminal has started warning
            them, and carries `status: exceeded` once it refuses their next
            checkout. Members who are deactivated or deleted are left out — the
            terminal serves neither, so there is nothing to warn about.

            **Ordered by share of ceiling, not by amount**
            ([ADR-0047](../../adr/0047-configurable-credit-limits.md)). Once
            ceilings differ per member, the raw amount stops ranking urgency: a
            member €10 past a €50 ceiling is already being refused, while one at
            €170 of €200 is merely being warned.

            A member whose effective ceiling is `0` is unlimited and never
            appears, however large their tab.
          required: [limit_cents, warn_at_cents, total, members]
          properties:
            limit_cents:
              type: integer
              description: >-
                The **club default** ceiling in cents. Zero means the club
                enforces no ceiling — members with a ceiling of their own can
                still appear in `members`.
            warn_at_cents:
              type: integer
              description: >-
                The club default's warning threshold in cents. A member with an
                override is measured against their own, reported per row.
            total:
              type: integer
              description: >-
                How many members are inside their own warning band in total.
                `members` is capped, so this can be larger than its length.
            members:
              type: array
              description: The most pressing tabs, by share of their own ceiling, capped
              items:
                type: object
                required: [id, name, balance_cents, limit_cents, percent_of_limit, status]
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                    description: Display name (first + last name)
                  balance_cents:
                    type: integer
                    description: The member's unsettled balance in cents — the same figure their own page shows
                  limit_cents:
                    type: integer
                    description: >-
                      The ceiling **this member** was measured against: their own
                      override where they have one, the club default where they
                      do not. Always greater than zero — an unlimited member is
                      not listed.
                  percent_of_limit:
                    type: integer
                    description: >-
                      Share of this row's `limit_cents` the tab uses, as a whole
                      percentage. Not clamped: a tab past the ceiling reports
                      more than 100.
                  status:
                    type: string
                    enum: [approaching, exceeded]
                    description: |
                      - approaching: inside the warning band, still served
                      - exceeded: past the ceiling, the terminal refuses the next checkout
