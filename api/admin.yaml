            enum: [create, update, delete, anonymize, login, logout, login_failed, export, settlement_create, settlement_cancel, settlement_export]
        - name: entity_type
          in: query
          schema:
            type: string
            enum: [member, product, category, admin_user, terminal, settlement, sepa_config]
        - name: entity_id
          in: query
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          description: Search in entity ID, admin email, or IP address
          schema:
            type: string
      responses:
        '200':
          description: Audit log entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLogEntry'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # /audit-log/{entryId} — REMOVED (2026-03-07 audit)
  # Detail data is included inline in list response. See use-case-implementation-audit.md.

  # ============================================================================
  # RFID CARDS (DEFERRED — 2026-03-07 audit)
  # UC-A70 (unknown cards) and UC-A71 (blocked cards) are deferred.
  # Endpoints kept in spec for future implementation.
  # ============================================================================
  /admin/unknown-cards:
    get:
      tags: [RFID Cards]
      summary: List unknown cards
      description: |
        Retrieve cards scanned at terminals that are not assigned to any member.

        **Use Case**: UC-A70
      operationId: listUnknownCards
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Unknown cards
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UnknownCard'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/blocked-cards:
    get:
      tags: [RFID Cards]
      summary: List blocked cards
      description: |
        Retrieve blocked RFID cards.

        **Use Case**: UC-A71
      operationId: listBlockedCards
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Blocked cards
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BlockedCard'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [RFID Cards]
      summary: Block a card
      description: |
        Add a card to the blocklist.

        **Use Case**: UC-A71

        If the card is assigned to a member, the assignment is removed.
      operationId: blockCard
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [card_uid]
              properties:
                card_uid:
                  type: string
                  pattern: '^[0-9A-F]{8,20}$'
                reason:
                  type: string
                  maxLength: 255
      responses:
        '201':
          description: Card blocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockedCard'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/blocked-cards/{cardUid}:
    parameters:
      - name: cardUid
        in: path
        required: true
        schema:
          type: string
    delete:
      tags: [RFID Cards]
      summary: Unblock a card
      description: |
        Remove a card from the blocklist.

        **Use Case**: UC-A71
      operationId: unblockCard
      security:
        - sessionAuth: []
      responses:
        '204':
          description: Card unblocked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================================
  # TERMINALS
  # ============================================================================
  /admin/terminals:
    get:
      tags: [Terminals]
      summary: List terminals
      operationId: listTerminals
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
        - name: is_active
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Terminals list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Terminal'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Terminals]
      summary: Create terminal
      operationId: createTerminal
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTerminalRequest'
      responses:
        '201':
          description: Terminal created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalWithToken'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/terminals/{terminalId}:
    parameters:
      - name: terminalId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Terminals]
      summary: Get terminal
      operationId: getTerminal
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Terminal details
          content:
            application/json:
              schema:
                type: object
                properties:
                  terminal:
                    $ref: '#/components/schemas/Terminal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Terminals]
      summary: Update terminal
      operationId: updateTerminal
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTerminalRequest'
      responses:
        '200':
          description: Terminal updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  terminal:
                    $ref: '#/components/schemas/Terminal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Terminals]
      summary: Delete (soft-deactivate) terminal
      operationId: deleteTerminal
      security:
        - sessionAuth: []
      responses:
        '204':
          description: Terminal deactivated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/terminals/{terminalId}/rotate-token:
    post:
      tags: [Terminals]
      summary: Rotate terminal API token
      operationId: rotateTerminalToken
      security:
        - sessionAuth: []
      parameters:
        - name: terminalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Token rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalWithToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/terminals/{terminalId}/revoke:
    post:
      tags: [Terminals]
      summary: Revoke terminal access
      operationId: revokeTerminalAccess
      security:
        - sessionAuth: []
      parameters:
        - name: terminalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Access revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================================
  # TRANSACTIONS (global journal)
  # ============================================================================
  /admin/transactions:
    get:
      tags: [Transactions]
      summary: List all transactions (global journal)
      operationId: listTransactions
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
        - name: type
          in: query
          schema:
            type: string
            enum: [purchase, correction]
        - name: member_id
          in: query
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [created_at, amount, type, member]
            default: created_at
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: settlement_status
          in: query
          schema:
            type: string
            enum: [open, settled]
      responses:
        '200':
          description: Transactions list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/GlobalTransaction'
                  total:
                    type: integer
                  page:
                    type: integer
                  per_page:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================================================
  # SETTLEMENT FILTER ENDPOINTS
  # ============================================================================
  /admin/settlements/filter-preview:
    get:
      tags: [Settlements]
      summary: Preview settlement by date filter
      description: Preview which transactions would be included in a settlement based on date filters
      operationId: previewSettlementByFilters
      security:
        - sessionAuth: []
      parameters:
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
        - name: search
          in: query
          schema:
            type: string
        - name: member_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Filter preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementFilterPreview'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/settlements/settle-filter:
    post:
      tags: [Settlements]
      summary: Create settlement by date filter
      description: Create a settlement for all unsettled transactions matching date filters
      operationId: createSettlementByFilters
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                settlement_date:
                  type: string
                  format: date
                execution_date:
                  type: string
                  format: date
                date_from:
                  type: string
                  format: date
                date_to:
                  type: string
                  format: date
                search:
                  type: string
                member_id:
                  type: string
                  format: uuid
                notes:
                  type: string
      responses:
        '201':
          description: Settlement created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/dashboard:
    get:
      summary: Get Dashboard Metrics
      operationId: getDashboardMetrics
      description: |
        Retrieve aggregated dashboard metrics and system overview.
        Combines metrics from members, transactions, terminals, and settlements modules.

        Implements UC-A80: Dashboard

        **Response Data**:
        - metrics: Business metrics (member counts, balance, revenue, terminals)
        - recent_transactions: Last 10 transactions with member and product details
        - terminal_status: All terminals with connectivity information
        - system_status: High-level system indicators
        - alerts: SEPA compliance alerts

        **Performance Notes**:
        - Point-in-time snapshot (not real-time streaming)
        - Optimized with database aggregations
        - Typical response time: < 500ms
      tags:
        - Dashboard
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Dashboard metrics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Database error while aggregating metrics

# ==============================================================================
# COMPONENTS
# ==============================================================================
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: PHPSESSID
      description: PHP session cookie (HttpOnly, Secure, SameSite=Lax)

  parameters:
    memberId:
      name: memberId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    page:
      name: page
      in: query
      description: Page number (1-indexed)
      schema:
        type: integer
        minimum: 1
        default: 1
    perPage:
      name: per_page
      in: query
      description: Items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

  responses:
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unauthorized
            message: Authentication required
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: Resource not found
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'

  schemas:
    # --------------------------------------------------------------------------
    # Common
    # --------------------------------------------------------------------------
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Error code
        message:
          type: string
          description: Human-readable error message
        details:
          type: object
          additionalProperties: true
          description: Additional error details

    ValidationErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: validation_error
        message:
          type: string
          example: Validation failed
        details:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            iban: ["Invalid IBAN checksum"]
            first_name: ["Required field"]

    Pagination:
      type: object
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer

    MultilingualText:
      type: object
      description: Multilingual text (ISO 639-1 keys)
      additionalProperties:
        type: string
      example:
        de: "Bier 0,5L"
        en: "Beer 0.5L"

    # --------------------------------------------------------------------------
    # Authentication
    # --------------------------------------------------------------------------
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      required: [admin_id, email, display_name, locale, csrf_token]
      properties:
        admin_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        locale:
          type: string
        csrf_token:
          type: string
          description: CSRF token for subsequent state-changing requests

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password, confirm_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 8
          description: "Min 8 chars, 1 uppercase, 1 lowercase, 1 digit"
        confirm_password:
          type: string
          format: password

    AdminProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        locale:
          type: string
        last_login_at:
          type: string
          format: date-time
          nullable: true

    UpdateProfileRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        display_name:
          type: string
        locale:
          type: string
          enum: [de, en]

    # --------------------------------------------------------------------------
    # Members
    # --------------------------------------------------------------------------
    MemberListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        balance_cents:
          type: integer
          description: Current outstanding balance in cents
        card_uid:
          type: string
          nullable: true
        iban_masked:
          type: string
          nullable: true
          description: Masked IBAN (e.g., DE89****3000)
        is_active:
          type: boolean
        is_sepa_valid:
          type: boolean
          description: Whether member has valid IBAN and mandate_reference
        created_at:
          type: string
          format: date-time

    ExtractionField:
      type: object
      nullable: true
      properties:
        value:
          type: string
          nullable: true
          description: Extracted value, null if not found or illegible
        confidence:
          type: string
          nullable: true
          enum: [high, medium, low, null]
          description: Model confidence in the extracted value

    ExtractionResult:
      type: object
      properties:
        fields:
          type: object
          properties:
            first_name:
              $ref: '#/components/schemas/ExtractionField'
            last_name:
              $ref: '#/components/schemas/ExtractionField'
            email:
              $ref: '#/components/schemas/ExtractionField'
            iban:
              $ref: '#/components/schemas/ExtractionField'
            account_holder_name:
              $ref: '#/components/schemas/ExtractionField'
            mandate_signed_at:
              $ref: '#/components/schemas/ExtractionField'
            card_uid:
              $ref: '#/components/schemas/ExtractionField'

    MandateDocument:
      type: object
      required:
        - uploaded_at
        - file_size_bytes
        - original_filename
      properties:
        uploaded_at:
          type: string
          format: date-time
          description: When the document was last uploaded or replaced
        file_size_bytes:
          type: integer
          description: Size of the stored PDF in bytes
        original_filename:
          type: string
          description: Original filename as provided by the client
        extraction_status:
          type: string
          nullable: true
          enum: [completed, failed]
          description: LLM extraction status; null if extraction has never been attempted
        extraction:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ExtractionResult'
          description: Extraction results; null if extraction was not attempted or not configured

    Member:
      type: object
      properties:
        id:
          type: string
          format: uuid
        first_name:
          type: string
          nullable: true
          maxLength: 100
        last_name:
          type: string
          nullable: true
          maxLength: 100
        email:
          type: string
          format: email
          nullable: true
        card_uid:
          type: string
          nullable: true
        preferred_language:
          type: string
          description: ISO 639-1 language code
        iban:
          type: string
          nullable: true
          description: Full IBAN (unmasked in detail view)
        account_holder_name:
          type: string
          nullable: true
          maxLength: 70
          description: Account holder name if different from member. Used in SEPA XML.
        mandate_reference:
          type: string
          nullable: true
          maxLength: 35
        mandate_signed_at:
          type: string
          format: date
          nullable: true
        is_active:
          type: boolean
        is_sepa_valid:
          type: boolean
        balance_cents:
          type: integer
        deleted_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        mandate_document:
          nullable: true
          description: Stored mandate document info, or null if none uploaded
          allOf:
            - $ref: '#/components/schemas/MandateDocument'

    MemberCreateRequest:
      type: object
      required: [first_name, last_name, iban, mandate_signed_at, preferred_language]
      properties:
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
        preferred_language:
          type: string
          description: ISO 639-1 language code
          example: de
        iban:
          type: string
          description: ISO 13616 IBAN
          minLength: 15
          maxLength: 34
        account_holder_name:
          type: string
          maxLength: 70
          description: Account holder name if different from member (for divergent payer)
        mandate_signed_at:
          type: string
          format: date
          description: Mandate signature date (not in future)
        mandate_reference:
          type: string
          maxLength: 35
          description: Optional; defaults to UUID without hyphens
        card_uid:
          type: string
          pattern: '^[0-9A-F]{8,20}$'
          description: Optional RFID card UID

    MemberUpdateRequest:
      type: object
      properties:
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          nullable: true
        preferred_language:
          type: string
        iban:
          type: string
          minLength: 15
          maxLength: 34
        account_holder_name:
          type: string
          maxLength: 70
          nullable: true
        mandate_reference:
          type: string
          maxLength: 35
        mandate_signed_at:
          type: string
          format: date
        is_active:
          type: boolean
        card_uid:
          type: string
          pattern: '^[0-9A-F]{8,20}$'
          nullable: true
          description: RFID card UID (null to remove)

    MemberImportPreview:
      type: object
      properties:
        import_id:
          type: string
          description: ID to use for confirmation
        preview:
          type: array
          items:
            type: object
            properties:
              row:
                type: integer
              status:
                type: string
                enum: [valid, error]
              data:
                type: object
              errors:
                type: array
                items:
                  type: string
        summary:
          type: object
          properties:
            total_rows:
              type: integer
            valid:
              type: integer
            invalid:
              type: integer

    # --------------------------------------------------------------------------
    # Transactions
    # --------------------------------------------------------------------------
    Transaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        member_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
          nullable: true
        amount_cents:
          type: integer
        transaction_type:
          type: string
          enum: [purchase, correction]
        notes:
          type: string
          nullable: true
        related_transaction_id:
          type: string
          format: uuid
          nullable: true
        settlement_id:
          type: string
          format: uuid
          nullable: true
        created_by_terminal_id:
          type: string
          format: uuid
          nullable: true
        created_by_admin_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time

    MemberTransactionHistory:
      type: object
      properties:
        member_id:
          type: string
          format: uuid
        current_balance_cents:
          type: integer
        transactions:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              date:
                type: string
                format: date-time
              type:
                type: string
                enum: [purchase, correction]
              description:
                type: string
              amount_cents:
                type: integer
              running_total_cents:
                type: integer
              settlement_id:
                type: string
                format: uuid
                nullable: true
        settlements:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              date:
                type: string
                format: date
              amount_cents:
                type: integer
              type:
                type: string
                enum: [sepa, manual]

    ManualTransactionRequest:
      type: object
      required: [amount_cents, notes]
      properties:
        amount_cents:
          type: integer
          description: Positive for charge, negative for credit/reversal (non-zero)
        notes:
          type: string
          maxLength: 500
          description: Reason for the correction (required)
        related_transaction_id:
          type: string
          format: uuid
          description: Optional reference to original transaction

    # --------------------------------------------------------------------------
    # Products & Categories
    # --------------------------------------------------------------------------
    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        names:
          $ref: '#/components/schemas/MultilingualText'
        descriptions:
          $ref: '#/components/schemas/MultilingualText'
        price_cents:
          type: integer
          minimum: 1
        is_active:
          type: boolean
        icon_name:
          type: string
          nullable: true
          maxLength: 50
          description: Name of the icon component to display
          example: "PilsIcon"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProductCreateRequest:
      type: object
      required: [names, price_cents, category_id]
      properties:
        names:
          $ref: '#/components/schemas/MultilingualText'
        descriptions:
          $ref: '#/components/schemas/MultilingualText'
        price_cents:
          type: integer
          minimum: 1
          maximum: 999999
        category_id:
          type: string
          format: uuid
        icon_name:
          type: string
          nullable: true
          maxLength: 50
          description: Name of the icon component to display
          example: "PilsIcon"

    ProductUpdateRequest:
      type: object
      properties:
        names:
          $ref: '#/components/schemas/MultilingualText'
        descriptions:
          $ref: '#/components/schemas/MultilingualText'
        price_cents:
          type: integer
          minimum: 1
          maximum: 999999
        category_id:
          type: string
          format: uuid
        is_active:
          type: boolean
        icon_name:
          type: string
          nullable: true
          maxLength: 50
          description: Name of the icon component to display
          example: "PilsIcon"

    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        names:
          $ref: '#/components/schemas/MultilingualText'
        is_active:
          type: boolean
        icon_name:
          type: string
          nullable: true
          maxLength: 50
          description: Name of the icon component to display
          example: "CategoryIcon"
        product_count:
          type: integer
          description: Number of products in this category
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CategoryCreateRequest:
      type: object
      required: [names]
      properties:
        names:
          $ref: '#/components/schemas/MultilingualText'
        is_active:
          type: boolean
          default: true
        icon_name:
          type: string
          nullable: true
          maxLength: 50
          description: Name of the icon component to display
          example: "CategoryIcon"

    CategoryUpdateRequest:
      type: object
      properties:
        names:
          $ref: '#/components/schemas/MultilingualText'
        is_active:
          type: boolean
        icon_name:
          type: string
          nullable: true
          maxLength: 50
          description: Name of the icon component to display
          example: "CategoryIcon"

    # --------------------------------------------------------------------------
    # Settlements
    # --------------------------------------------------------------------------
    SettlementListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        settlement_type:
          type: string
          enum: [sepa, manual]
        settlement_date:
          type: string
          format: date
        execution_date:
          type: string
          format: date
          nullable: true
        member_count:
          type: integer
        total_amount_cents:
          type: integer
        is_cancelled:
          type: boolean
        exported_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    Settlement:
      type: object
      properties:
        id:
          type: string
          format: uuid
        settlement_type:
          type: string
          enum: [sepa, manual]
        settlement_date:
          type: string
          format: date
        execution_date:
          type: string
          format: date
          nullable: true
        period_start:
          type: string
          format: date
          nullable: true
        period_end:
          type: string
          format: date
          nullable: true
        sepa_message_id:
          type: string
          nullable: true
        manual_reason:
          type: string
          enum: [cash_payment, bank_transfer, other_payment, write_off, goodwill, correction, other]
          nullable: true
        total_amount_cents:
          type: integer
        member_count:
          type: integer
        is_cancelled:
          type: boolean
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        exported_at:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
          nullable: true
        created_by_admin_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        members:
          type: array
          items:
            type: object
            properties:
              member_id:
                type: string
                format: uuid
              member_name:
                type: string
              amount_cents:
                type: integer
              iban_masked:
                type: string
                nullable: true
              mandate_reference:
                type: string
                nullable: true
              is_sepa_eligible:
                type: boolean

    SettlementPreview:
      type: object
      properties:
        total_amount_cents:
          type: integer
        member_count:
          type: integer
        transaction_count:
          type: integer
        sepa_eligible_count:
          type: integer
        sepa_ineligible_count:
          type: integer
        members:
          type: array
          items:
            type: object
            properties:
              member_id:
                type: string
                format: uuid
              member_name:
                type: string
              transaction_count:
                type: integer
              amount_cents:
                type: integer
              iban_status:
                type: string
                enum: [valid, missing, invalid]
              mandate_status:
                type: string
                enum: [present, missing]
              warnings:
                type: array
                items:
                  type: string
        warnings:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              member_id:
                type: string
                format: uuid
              member_name:
                type: string

    SettlementCreateRequest:
      type: object
      required: [settlement_type]
      properties:
        settlement_type:
          type: string
          enum: [sepa, manual]
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        execution_date:
          type: string
          format: date
          description: Required for SEPA (>= TODAY + 7 days)
        manual_reason:
          type: string
          enum: [cash_payment, bank_transfer, other_payment, write_off, goodwill, correction, other]
          description: Required for manual settlements
        notes:
          type: string
          maxLength: 500
          description: Required for manual settlements (min 10 chars)
        member_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Optional filter to specific members

    SettlementFilterPreview:
      type: object
      properties:
        transaction_count:
          type: integer
        member_count:
          type: integer
        total_amount_cents:
          type: integer

    # --------------------------------------------------------------------------
    # Terminals
    # --------------------------------------------------------------------------
    Terminal:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        device_id:
          type: string
        is_active:
          type: boolean
        last_sync_at:
          type: string
          format: date-time
          nullable: true
        last_transaction_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateTerminalRequest:
      type: object
      required: [name, device_id]
      properties:
        name:
          type: string
        device_id:
          type: string

    UpdateTerminalRequest:
      type: object
      properties:
        name:
          type: string
        is_active:
          type: boolean

    TerminalWithToken:
      allOf:
        - $ref: '#/components/schemas/Terminal'
        - type: object
          properties:
            api_token:
              type: string
              description: API token for terminal authentication

    # --------------------------------------------------------------------------
    # Global Transactions
    # --------------------------------------------------------------------------
    GlobalTransaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        member_id:
          type: string
          format: uuid
        member_name:
          type: string
        type:
          type: string
          enum: [purchase, correction]
        amount_cents:
          type: integer
        description:
          type: string
        product_id:
          type: string
          format: uuid
          nullable: true
        product_name:
          type: string
          nullable: true
        product_names:
          type: string
          nullable: true
          description: JSON string with multilingual product names
        created_at:
          type: string
          format: date-time
        created_by_admin_id:
          type: string
          format: uuid
          nullable: true
        created_by_terminal_id:
          type: string
          format: uuid
          nullable: true
        is_settled:
          type: boolean
        settlement_date:
          type: string
          format: date
          nullable: true

    # --------------------------------------------------------------------------
    # SEPA Configuration
    # --------------------------------------------------------------------------
    SepaConfig:
      type: object
      properties:
        creditor_id:
          type: string
          description: Gläubiger-ID (masked)
        creditor_name:
          type: string
          maxLength: 70
        creditor_iban:
          type: string
          description: Masked IBAN
        creditor_address_street:
          type: string
          maxLength: 70
        creditor_address_city:
          type: string
          maxLength: 70
        creditor_address_country:
          type: string
          minLength: 2
          maxLength: 2
        updated_at:
          type: string
          format: date-time

    SepaConfigRequest:
      type: object
      required: [creditor_id, creditor_name, creditor_iban, creditor_address_street, creditor_address_city]
      properties:
        creditor_id:
          type: string
          maxLength: 35
          description: Gläubiger-ID (immutable after set)
        creditor_name:
          type: string
          maxLength: 70
        creditor_iban:
          type: string
          minLength: 15
          maxLength: 34
        creditor_address_street:
          type: string
          maxLength: 70
        creditor_address_city:
          type: string
          maxLength: 70
        creditor_address_country:
          type: string
          minLength: 2
          maxLength: 2
          default: DE

    SepaConfigUpdateRequest:
      type: object
      properties:
        creditor_name:
          type: string
          maxLength: 70
        creditor_iban:
          type: string
          minLength: 15
          maxLength: 34
        creditor_address_street:
          type: string
          maxLength: 70
        creditor_address_city:
          type: string
          maxLength: 70
        creditor_address_country:
          type: string
          minLength: 2
          maxLength: 2

    # --------------------------------------------------------------------------
    # Admin Users
    # --------------------------------------------------------------------------
    AdminUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        locale:
          type: string
        is_active:
          type: boolean
        last_login_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    AdminUserWithPassword:
      allOf:
        - $ref: '#/components/schemas/AdminUser'
        - type: object
          properties:
            password:
              type: string
              description: Generated password (shown once)

    AdminUserCreateRequest:
      type: object
      required: [email, display_name]
      properties:
        email:
          type: string
          format: email
        display_name:
          type: string
          maxLength: 100
        locale:
          type: string
          default: de

    # --------------------------------------------------------------------------
    # Reports & Dashboard
    # --------------------------------------------------------------------------
    Dashboard:
      type: object
      properties:
        metrics:
          type: object
          properties:
            active_members:
              type: integer
            outstanding_balance_cents:
              type: integer
            today_revenue_cents:
              type: integer
            terminal_status:
              type: string
              enum: [online, offline, unknown]
            last_sync_at:
              type: string
              format: date-time
              nullable: true
        alerts:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              severity:
                type: string
                enum: [info, warning, error]
              count:
                type: integer
              message:
                type: string
        recent_transactions:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              timestamp:
                type: string
                format: date-time
              member_name:
                type: string
              product_name:
                type: string
              amount_cents:
                type: integer
        system_status:
          type: object
          properties:
            pending_syncs:
              type: integer
            last_settlement_date:
              type: string
              format: date
              nullable: true

    Report:
      type: object
      properties:
        metadata:
          type: object
          properties:
            report_type:
              type: string
            generated_at:
              type: string
              format: date-time
            filters:
              type: object
        summary:
          type: object
          properties:
            total_revenue_cents:
              type: integer
            total_quantity:
              type: integer
            transaction_count:
              type: integer
            avg_transaction_cents:
              type: integer
        data:
          type: array
          items:
            type: object
            properties:
              dimension:
                type: string
              revenue_cents:
                type: integer
              quantity:
                type: integer
              count:
                type: integer
              percent_of_total:
                type: number
        pagination:
          $ref: '#/components/schemas/Pagination'

    TerminalActivityReport:
      type: object
      properties:
        sessions:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              start_time:
                type: string
              end_time:
                type: string
              transaction_count:
                type: integer
              revenue_cents:
                type: integer
        hourly_distribution:
          type: array
          items:
            type: object
            properties:
              hour:
                type: integer
                minimum: 0
                maximum: 23
              transaction_count:
                type: integer
        terminals:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              transaction_count:
                type: integer
              last_sync_at:
                type: string
                format: date-time

    # --------------------------------------------------------------------------
    # Audit Log
    # --------------------------------------------------------------------------
    AuditLogEntry:
      type: object
      properties:
        id:
          type: integer
        admin_user_id:
          type: string
          format: uuid
          nullable: true
        admin_user_email:
          type: string
          nullable: true
        action:
          type: string
          enum: [create, update, delete, anonymize, login, logout, login_failed, export, settlement_create, settlement_cancel, settlement_export]
        entity_type:
          type: string
        entity_id:
          type: string
          nullable: true
        old_values:
          type: object
          nullable: true
          description: Values before change (sensitive data masked)
        new_values:
          type: object
          nullable: true
          description: Values after change (sensitive data masked)
        ip_address:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    # --------------------------------------------------------------------------
    # RFID Cards
    # --------------------------------------------------------------------------
    UnknownCard:
      type: object
      properties:
        card_uid:
          type: string
        terminal_name:
          type: string
          nullable: true
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        scan_count:
          type: integer

    BlockedCard:
      type: object
      properties:
        card_uid:
          type: string
        reason:
          type: string
          nullable: true
        blocked_at:
          type: string
          format: date-time
        blocked_by_admin_id:
          type: string
          format: uuid

    # --------------------------------------------------------------------------
    # GDPR Export
    # --------------------------------------------------------------------------
    GdprExport:
      type: object
      description: GDPR data export (Art. 15 / Art. 20)
      properties:
        export_info:
          type: object
          properties:
            export_date:
              type: string
              format: date-time
            export_type:
              type: string
              enum: [gdpr_access, gdpr_portability]
            format_version:
              type: string
        personal_data:
          type: object
          properties:
            first_name:
              type: string
            last_name:
              type: string
            email:
              type: string
              nullable: true
            card_uid:
              type: string
              nullable: true
            preferred_language:
              type: string
            iban:
              type: string
              description: Full IBAN (unmasked)
            mandate_reference:
              type: string
            member_since:
              type: string
              format: date
            is_active:
              type: boolean
        transactions:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date-time
              type:
                type: string
              product_name:
                type: string
                nullable: true
              amount_cents:
                type: integer
              notes:
                type: string
                nullable: true
        settlements:
          type: array
          items:
            type: object
            properties:
              period_start:
                type: string
                format: date
              period_end:
                type: string
                format: date
              amount_cents:
                type: integer
              execution_date:
                type: string
                format: date
        current_balance:
          type: object
          properties:
            outstanding_cents:
              type: integer
            pending_transaction_count:
              type: integer

    DashboardResponse:
      type: object
      description: Complete dashboard response with aggregated metrics and system data
      properties:
        metrics:
          type: object
          description: Business metrics aggregated from all modules
          properties:
            active_members:
              type: integer
              description: Count of active members
            inactive_members:
              type: integer
              description: Count of inactive members
            outstanding_balance_cents:
              type: integer
              description: Total unsettled transaction balance in cents
            todays_revenue_cents:
              type: integer
              description: Sum of transactions created today in cents
            terminal_count:
              type: integer
              description: Total number of terminals (active and inactive)
            active_terminals:
              type: integer
              description: Count of active terminals
            settled_members:
              type: integer
              description: Number of unique members with settled transactions
            sepa_issue_count:
              type: integer
              description: Count of members with incomplete SEPA data
        recent_transactions:
          type: array
          description: Last 10 transactions ordered by creation time
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              member_id:
                type: string
                format: uuid
              member_name:
                type: string
                description: Display name (first + last name or card_uid)
              type:
                type: string
                enum: [purchase, correction]
              amount_cents:
                type: integer
              product_name:
                type: string
                description: Product name or manual entry description
              timestamp:
                type: string
                format: date-time
                description: ISO 8601 transaction creation time
        terminal_status:
          type: array
          description: Status of all terminals with connectivity information
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              is_active:
                type: boolean
              last_sync_at:
                type: string
                format: date-time
                nullable: true
              status:
                type: string
                enum: [online, offline, disabled]
                description: |
                  - online: synced within 24 hours
                  - offline: no sync or synced > 24 hours ago
                  - disabled: terminal is inactive
        system_status:
          type: object
          description: High-level system status indicators
          properties:
            last_settlement_date:
              type: string
              format: date-time
              nullable: true
              description: Last settlement creation timestamp
            pending_settlement_count:
              type: integer
              description: Count of non-cancelled settlements
            total_members:
              type: integer
              description: Total member count (active + inactive)
            total_transactions:
              type: integer
              description: Total transaction count
            database_health:
              type: string
              enum: [ok]
              description: Database connectivity status
        alerts:
          type: object
          description: Admin alerts requiring attention
          properties:
            sepa_issues:
              type: object
              properties:
                count:
                  type: integer
                  description: Number of members with incomplete SEPA data
                severity:
                  type: string
                  enum: [none, warning, error]
                  description: |
                    - none: 0 members with issues
                    - warning: 1-5 members with issues
                    - error: 6+ members with issues
                message:
                  type: string
                  description: Human-readable alert message
