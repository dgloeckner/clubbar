          description: >-
            Optional. Omit or send `null` for an unrestricted product
            ([ADR-0045](../../adr/0045-age-restricted-products.md)). On update,
            an explicit `null` removes an existing restriction.
          example: 18

    ProductUpdateRequest:
      type: object
      properties:
        names:
          $ref: '#/components/schemas/MultilingualText'
        descriptions:
          $ref: '#/components/schemas/MultilingualText'
        price_cents:
          type: integer
          minimum: 1
          maximum: 999999
        category_id:
          type: string
          format: uuid
        is_active:
          type: boolean
        icon_name:
          type: string
          nullable: true
          maxLength: 50
          description: Name of the icon component to display
