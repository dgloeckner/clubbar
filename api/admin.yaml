    # --------------------------------------------------------------------------
    # Settlements
    # --------------------------------------------------------------------------
    SettlementListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
          description: |
            The canonical, human-quotable name of this settlement: its id with
            the hyphens removed, 32 lowercase hex digits. The same string is the
            pain.008 `MsgId` and `PmtInfId`, appears in the Verwendungszweck the
            member reads on their bank statement, and is shown in the
            Vorabankündigung — so a member can quote it and the Kassenwart can
            look it up. Derived server-side from `id`; never stored, never
            recomputed by a client.
          example: 3f9c2d1e7b4a4c8d9e2f1a5b6c7d8e9f
        method:
          type: string
          enum: [direct_debit, bank_transfer, write_off]
          description: |
            How this settlement's balance is collected. Replaces the old
            `settlement_type`/`manual_reason` pair (ruling #163). Only
            `direct_debit` settlements can be exported to SEPA.
        settlement_date:
          type: string
          format: date
          description: |
            The day the server created this settlement. Recorded, never
            supplied — it is not a request field (issue #113).
        execution_date:
          type: string
          format: date
          nullable: true
        member_count:
          type: integer
        total_amount_cents:
          type: integer
        is_cancelled:
          type: boolean
        exported_at:
          type: string
          format: date-time
          nullable: true
        submitted_at:
          type: string
          format: date-time
          nullable: true
        submitted_by_admin_id:
          type: string
          format: uuid
          nullable: true
        is_cancellable:
          type: boolean
          description: Whether a cancel request would currently be accepted.
        cancellation_blocked_reason:
          type: string
          nullable: true
          description: |
            Human-readable reason cancellation is unavailable. Null when
            `is_cancellable` is true.
        cancellation_blocked_code:
          type: string
          nullable: true
          description: |
            The same refusal as a stable code the client translates — the
            admin panel renders `errors.reasons.<code>` in the admin's own
            language rather than showing the English sentence above.
        cancellation_blocked_params:
          type: object
          nullable: true
          additionalProperties: true
          description: |
            Values the translated sentence interpolates (an amount in cents, a
            date, a count). Never prose: the wording lives in the client's
            locale files.
        status:
          type: string
          enum: [cancelled, fully_reversed, partly_reversed, submitted, exported, draft]
          description: |
            Where the settlement stands, derived on every read from
            `is_cancelled`, the reversal rows, `submitted_at` and
            `exported_at` (ruling #148 §6). There is no status column, so
            nothing can drift out of step with it.
        status_label:
          type: string
          description: Human-readable form of `status`.
        is_reversible:
          type: boolean
          description: |
            Whether a reverse request would currently be accepted — the exact
            mirror of `is_cancellable`. A settlement is one or the other,
            never both; a cancelled one is neither.
        reversal_blocked_reason:
          type: string
          nullable: true
          description: |
            Human-readable reason reversal is unavailable. Null when
            `is_reversible` is true.
        reversal_blocked_code:
          type: string
          nullable: true
          description: |
            The same refusal as a stable code the client translates — the
            admin panel renders `errors.reasons.<code>` in the admin's own
            language rather than showing the English sentence above.
        reversal_blocked_params:
          type: object
          nullable: true
          additionalProperties: true
          description: |
            Values the translated sentence interpolates (an amount in cents, a
            date, a count). Never prose: the wording lives in the client's
            locale files.
        reversed_member_count:
          type: integer
          description: How many of this settlement's members carry a reversal.
        reversals:
          type: array
          description: |
            The reversal events, present on the single-settlement read. The
            list endpoint does not join them and returns an empty array.
          items:
            $ref: '#/components/schemas/SettlementReversal'
        notifications:
          type: array
          description: |
            What was queued to announce this settlement, per member (ADR-0038
            rule 6). Present on the single-settlement read; the list endpoint
            does not join them and returns an empty array.

            Rides along on the same read as `reversals` for the same reason: the
            breakdown that answers "what happened to this member" has to be able
            to say *"the announcement bounced"* without a second round trip.
          items:
            $ref: '#/components/schemas/QueuedMail'
        announcements:
          type: array
          description: |
            The announcements that actually went out, per member — the record
            that outlives the queue (ADR-0029).

            Not a duplicate of `notifications`, and the difference is a
            lifetime. A queue row carries the recipient address, which is
            operational-tier data: erased with the member and pruned 90 days
            after delivery. This carries only *that* a member was announced to
            and when, names no address, and is kept for the retention period —
            so the breakdown still answers "was this member told?" about a
            collection whose queue rows are long gone. While both exist they
            agree: the timestamp here is copied from the queue row at delivery.

            Present on the single-settlement read; the list endpoint returns an
            empty array.
          items:
            $ref: '#/components/schemas/SettlementAnnouncement'
        created_at:
          type: string
          format: date-time

