        '404':
          $ref: '#/components/responses/NotFound'

  /admin/jugendschutz-violations:
    get:
      tags: [Transactions]
      summary: Recorded underage sales still waiting to be acknowledged
      description: |
        The violations the dashboard alert is counting (#622, ADR-0045 §3),
        newest first.

        **Deliberately narrow, and member-free.** Each row carries the
        acknowledgement key, the sale it names, the age that was breached and
        when it was recorded — no member and no age-at-sale. This feeds a screen
        that may be open in the clubroom, and ADR-0045 rule 6 does not stop at
        the till. The transaction id is the handle into the journal, which a
        Kassenwart's role already permits.

        `min_age` is read out of the recorded payload rather than from the
        product, so it keeps saying what the limit was **at the sale** after
        somebody clears it (invariant 4).
      operationId: getJugendschutzViolations
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Unacknowledged violations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: int64
                          description: The `audit_log.id`, and the acknowledgement key
                        transaction_id:
                          type: string
                          description: The sale this violation names
                        min_age:
                          type: integer
                          description: The age the drink required at the time
                        recorded_at:
                          type: string
                          description: When the violation was recorded
        '403':
          description: Insufficient role

  /admin/jugendschutz-violations/{id}/acknowledge:
    post:
      tags: [Transactions]
      summary: Acknowledge a recorded Jugendschutz violation
      description: |
        Marks a recorded underage sale as dealt with (#622, ADR-0045 §3). It
        clears the alert from the dashboard and changes **nothing** about the
        violation itself.

        That distinction is the design. The violation is a `jugendschutz_violation`
        audit entry, which is append-only and stays true no matter what happens
        afterwards (ADR-0045 invariant 4). Acknowledging writes a separate row
        beside it saying a human has looked. The incident stays on file forever;
        only the dashboard stops asking about it.

        **`id` is the audit entry's id**, not a transaction id — there is no
        separate violations table, deliberately, because a second copy of the
        incident would be free to drift from the first.

        Available to the **Kassenwart** as well as `admin`. The audit log that
        holds the record is admin-only, which is exactly the gap this closes:
        an alert the Kassenwart can see but not clear would leave the dashboard
        permanently red for the person most likely to be looking at it.

        No step-up gate: this hands out nothing, and an alert that is awkward to
        dismiss is an alert that gets ignored.
      operationId: acknowledgeJugendschutzViolation
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The `audit_log.id` of the violation entry
          schema:
            type: integer
            format: int64
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 500
                  nullable: true
                  description: |
                    Optional free text — what was done about it. Never required:
                    a mandatory field on a dismissal becomes "." and teaches
                    people to write nothing true.
      responses:
        '200':
          description: |
            Acknowledged. Answers 200 even when somebody had already
            acknowledged it — two admins looking at the same dashboard alert is
            the expected case, not an error, and the first acknowledgement (with
            its actor and note) is the one that stands.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  newly_acknowledged:
                    type: boolean
                    description: False when it had already been acknowledged
        '403':
          description: Insufficient role
        '404':
          description: |
            No violation with that id. The key is `audit_log.id`, shared by
            every audited action, so an id naming a login or an export is
            refused here rather than silently accepted.

  /admin/terminals/{terminalId}/anomalies/{anomalyId}/acknowledge:
    post:
      tags: [Terminals]
      summary: Acknowledge a terminal credential anomaly
      description: |
        Marks a detected anomaly as seen (ADR-0041 §4). It clears the alert from
        the dashboard and the terminals list and changes **nothing** about the
        credential — an admin who concludes a till really was cloned revokes it
        through `/revoke`, which is a separate, deliberate act.

        No step-up gate: this hands out nothing, and an alert that is awkward to
        dismiss is an alert that gets ignored.

        The anomaly must belong to the terminal in the path, so a mistyped URL
        cannot silently clear an alert about a different till. Acknowledging an
        anomaly another admin already cleared answers 404.
      operationId: acknowledgeTerminalAnomaly
      security:
        - sessionAuth: []
      parameters:
        - name: terminalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: anomalyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Anomaly acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

