  # ============================================================================
  # TRANSACTIONS
  # ============================================================================
  /admin/registrations:
    get:
      tags: [Registration review]
      summary: List pending self-registrations
      description: |
        The review inbox (UC-A17). Newest first.

        Every row carries `iban_masked` and never the sealed material: the
        ciphertext is the IBAN itself, and `iban_fingerprint` is a stable
        identifier for a bank account that would let anyone holding a candidate
        number confirm it. The duplicate check that uses the fingerprint runs
        server-side; only its boolean answer travels.

        **Roles**: `admin`, `kassenwart` (ADR-0044).
      operationId: listRegistrations
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
        - name: search
          in: query
          description: Matches first name, last name or email.
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [submitted_at, expires_at, last_name, first_name, email]
            default: submitted_at
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: One page of pending registrations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PendingRegistration'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'

  /admin/registrations/{registrationId}:
    parameters:
      - $ref: '#/components/parameters/registrationId'

    get:
      tags: [Registration review]
      summary: Get one pending registration
      operationId: getRegistration
      security:
        - sessionAuth: []
      responses:
        '200':
          description: The submission, with its IBAN masked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingRegistration'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Registration review]
      summary: Correct a submission before approving it
      description: |
        Edit-before-approve, for typos an applicant made on their phone.

        An `iban` here is not a field write: the value re-runs the whole write
        path — validated, sealed under today's active key, with a new last four,
        a new fingerprint and a re-resolved bank name — because once sealed
        there is nothing left to derive any of those from (ADR-0036).

        Fields not listed in the request schema are ignored rather than refused,
        so a form that echoes the whole row back does not fail for sending a
        field it never edited. `mandate_reference` is one of them, deliberately:
        it is printed on the paper the member signs (ADR-0006).

        **Roles**: `admin`, `kassenwart`.
      operationId: updateRegistration
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationUpdateRequest'
      responses:
        '200':
          description: The corrected submission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingRegistration'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/registrations/{registrationId}/approve:
    parameters:
      - $ref: '#/components/parameters/registrationId'

    post:
      tags: [Registration review]
      summary: Approve a registration — the attestation
      description: |
        Creates the member and their mandate, atomically, and deletes the
        pending row. This is the **only** path from a pending registration to a
        `members` row.

        `signed_mandate_confirmed` is the point of the endpoint, not a
        formality: it records an admin stating that the signed SEPA mandate is
        in hand and — where the club printed the form with the IBAN comb left
        blank for a hand-written number — that the number on it matches
        `iban_masked`. Omitting it is a `422`; sending `false` is a `409`
        carrying `registration_attestation_required`, because a stated refusal
        to attest is a different conversation from a request that said nothing.

        The sealed IBAN moves to the mandate **verbatim**, key id included: the
        ciphertext can only be opened by the key that sealed it, so re-labelling
        it would produce a mandate nobody could collect on.

        No welcome mail is sent. That belongs to the card assignment (ADR-0021,
        UC-A67), which is a separate, deliberate step.

        **Roles**: `admin`, `kassenwart`.
      operationId: approveRegistration
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationApprovalRequest'
      responses:
        '201':
          description: The member that was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The attestation was explicitly refused
            (`registration_attestation_required`), or the club already has a
            member at this email address (`registration_member_email_exists`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/registrations/{registrationId}/document:
    parameters:
      - $ref: '#/components/parameters/registrationId'

    get:
      tags: [Registration review]
      summary: The club's Anmeldung, filled, for the Kassenwart to print
      description: |
        Returns the club's own multi-page document with this applicant's data
        drawn onto page 1 and every other page carried across unchanged — the
        Datenschutzhinweise and the Nutzungsordnung ride behind the form page
        and are part of what the member signs (ADR-0052 decision 5).

        **The IBAN line comes back blank.** The debtor IBAN is mandatory
        *mandate content* under the EPC SDD Core Rulebook, but not mandatory
        *machine-printed* content — the member writes it into the template's
        IBAN comb by hand at signature, and the sheet prints `endet auf
        ****3000` as the hint the admin checks it against. That is what keeps
        ADR-0036 exception-free: this path never needs a plaintext IBAN,
        because nobody on the server has one.

        It is therefore also the variant that **always works**, weeks after the
        submission, when the member's own copy is long gone.

        The output carries no live form fields: page 1 is imported without its
        annotations and the values are drawn on top, so the result is flattened
        by construction rather than by a step that could be skipped.

        Audited (`registration_printed`) with the masked IBAN only — a member's
        name, birth date, email and account hint are leaving the building on
        paper, and this is the one review action that leaves the submission
        itself untouched, so the audit entry is the only trace it happened.

        **Roles**: `admin`, `kassenwart`.
      operationId: getRegistrationDocument
      security:
        - sessionAuth: []
      responses:
        '200':
          description: 'The filled document, with `Cache-Control: no-store`'
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The club's document could not be turned into a mandate sheet.
            Every one of these names an actionable fix rather than saying the
            template is invalid: `document_template_unreachable` (the URL could
            not be fetched), `document_template_not_a_pdf` (usually a web server
            answering a moved file with an HTML page and a 200),
            `document_template_unreadable` (built without `--pdf-forms
            --uncompressed-pdf`, so the fields are absent or unreadable) or
            `document_template_field_missing`, which names the fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/registrations/{registrationId}/reject:
    parameters:
      - $ref: '#/components/parameters/registrationId'

    post:
      tags: [Registration review]
      summary: Reject a registration
      description: |
        Deletes the submission immediately — not a status change. A rejected
        application is data about somebody who is not becoming a member, and
        there is no reason to keep it (ADR-0052 decision 10).

        The audit entry is what survives, and it carries the reason: it is the
        only record of why, since the row it describes is gone before the
        response is written.

        **Roles**: `admin`, `kassenwart`.
      operationId: rejectRegistration
      security:
        - sessionAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
                  description: Recorded in the audit entry; never shown to the applicant.
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/self-registration:
    get:
      tags: [Registration review]
      summary: The club's self-registration settings
      description: |
        What the settings screen needs to describe the club's own registration
        surface: whether it is on, the sentence shown when it is off, whether a
        poster secret exists and when it was last minted, the published
        Anmeldung the applicant is pointed at, and the retention window.

        **It carries no secret material** — not the hash, not the cipher, not
        the secret. An admin who needs the secret asks for the poster, which is
        a separate action that produces a printable sheet. A settings payload
        holding a live credential would put it in every page load, every browser
        cache and every screen share of this screen.

        **Roles**: `admin` (ADR-0044). The Kassenwart reviews submissions but
        does not mint the credential that produces them.
      operationId: getSelfRegistrationSettings
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Current settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfRegistrationSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'

    patch:
      tags: [Registration review]
      summary: Switch registration on or off, and point at the club's document
      description: |
        One endpoint for the switch and the document URL, because they are one
        decision: a club clearing its document URL is a club that can no longer
        be switched on, and doing that in two requests makes the inconsistent
        state reachable between them. The URL is applied first for the same
        reason — the ordinary "configure it and switch it on" arrives as a
        single request, and the switch has to see the new URL.

        A `document_url` is **fetched and checked before it is stored**: it must
        answer with a PDF the filler can actually use, and a template that fails
        is refused with the reason naming what is wrong (missing fields are
        listed by name). A club that stored a broken URL would discover it at
        the moment a Kassenwart tried to print, weeks later.

        Switching **off** requires `disabled_reason`. A blank paused screen
        reads as a broken feature to somebody standing in the clubhouse holding
        the club's own poster (ADR-0052 decision 1). Switching **on** requires a
        poster secret and a usable document; the refusal names which of the two
        does not hold rather than greying the control out.

        Only fields present in the body are touched, so a screen that saves one
        control does not have to echo the others back.

        **Roles**: `admin`.
      operationId: updateSelfRegistrationSettings
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelfRegistrationUpdateRequest'
      responses:
        '200':
          description: The settings as they now stand
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfRegistrationSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'
        '409':
          description: |
            A precondition does not hold. `reason` is one of
            `registration_no_secret`, `registration_reason_required`,
            `document_template_unreachable`, `document_template_not_a_pdf`,
            `document_template_unreadable` or
            `document_template_field_missing` — the last carrying the missing
            field names.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/self-registration/secret:
    post:
      tags: [Registration review]
      summary: Mint a new poster secret
      description: |
        Rotation, and there is no history: the old secret stops working the
        moment this commits, which is exactly what "every poster in the building
        is now dead" has to mean. The panel confirms before calling it.

        The response is the **settings**, not the secret. The new poster is
        fetched by `POST /admin/self-registration/poster`, so the credential
        travels in a PDF an admin prints rather than in a JSON body a browser
        keeps.

        Audited as `registration_secret_rotated`, carrying no secret material —
        the same rule the key and terminal-token entries follow.

        **Roles**: `admin`.
      operationId: rotateSelfRegistrationSecret
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Rotated; the settings carry the new `secret_rotated_at`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfRegistrationSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'

  /admin/self-registration/poster:
    post:
      tags: [Registration review]
      summary: The printable QR poster
      description: |
        An A4 sheet carrying the club's name, a short instruction and a QR code
        for the registration URL with the poster secret in its fragment.

        A `POST` because it reads a credential back, which is not a thing a
        `GET` should do: a URL that returned the club's gate would be replayed
        by every prefetcher, history entry and shared link that ever touched it.
        The response is `no-store` for the same reason.

        It deliberately does **not** rotate. A club that had to rotate in order
        to reprint would invalidate every poster in the building every time
        somebody spilled a drink on one.

        Refused with `registration_no_secret` when there is nothing to print,
        and `registration_secret_unreadable` when the stored secret will not
        decrypt — rotating is the way out of the second.

        **Roles**: `admin`.
      operationId: downloadSelfRegistrationPoster
      security:
        - sessionAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                language:
                  type: string
                  enum: [de, en]
                  default: de
                  description: The words on the sheet. The URL is the same either way.
      responses:
        '200':
          description: The poster
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="anmeldung-poster.pdf"
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'
        '409':
          description: |
            No secret to print (`registration_no_secret`), or one that will not
            decrypt (`registration_secret_unreadable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/transactions/export:
    get:
      tags: [Transactions]
      summary: Export transactions as CSV
      description: |
        Export transactions to CSV file.

        **CSV format** (see "CSV exports" under Common Patterns):
        - Columns: `date`, `member_name`, `product`, `type`, `amount_eur`

        **Use Case**: UC-A22
      operationId: exportTransactions
      security:
        - sessionAuth: []
      parameters:
        - name: date_from
          in: query
          required: true
          description: Start date (inclusive)
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          required: true
          description: End date (inclusive)
          schema:
            type: string
            format: date
        - name: member_id
          in: query
          description: Filter by member
          schema:
            type: string
            format: uuid
        - name: product_id
          in: query
          description: Filter by product
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          description: Filter by transaction type
          schema:
            type: string
            enum: [all, purchase, storno, payout]
            default: all
      responses:
        '200':
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              description: Attachment filename
              schema:
                type: string
                example: 'attachment; filename="transactions-2025-01-01-to-2025-01-31.csv"'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================================================
  # PRODUCTS
  # ============================================================================
  /admin/products:
    get:
      tags: [Products]
      summary: List products
      description: |
        Retrieve a paginated list of products.

        **Use Case**: UC-A40
      operationId: listProducts
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
        - name: status
          in: query
          description: Filter by active status
          schema:
            type: string
            enum: [all, active, inactive]
            default: all
        - name: category_id
          in: query
          description: Filter by category
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          description: Search in product names
          schema:
            type: string
        - name: sort_by
          in: query
          description: Sort field
          schema:
            type: string
            enum: [name_asc, name_desc, price_asc, price_desc, category]
            default: name_asc
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Products]
      summary: Create product
      description: |
        Create a new product.

        **Use Case**: UC-A41

        Product names and descriptions are multilingual (JSON object with ISO 639-1 keys).
        At least one language is required for `names`.
      operationId: createProduct
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/products/{productId}:
    parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Products]
      summary: Get product details
      operationId: getProduct
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Products]
      summary: Update product
      description: |
        Update product information.

        **Use Cases**: UC-A42 (edit), UC-A43 (deactivate)
      operationId: updateProduct
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateRequest'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Products]
      summary: Delete product
      description: |
        Delete a product.

        This is a **soft delete**: `deleted_at` is stamped and the row is kept, so
        the transactions that reference it still resolve their product name, and so
        terminals learn about the deletion through the delta sync tombstone. A hard
        delete would be invisible to an offline terminal, which would keep selling
        the product indefinitely.

        **Use Case**: UC-A43
      operationId: deleteProduct
      security:
        - sessionAuth: []
      responses:
        '204':
          description: Product deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================================
  # CATEGORIES
  # ============================================================================
  /admin/categories:
    get:
      tags: [Products]
      summary: List categories
      description: |
        Retrieve all product categories.

        **Use Case**: UC-A44
      operationId: listCategories
      security:
        - sessionAuth: []
      responses:
        '200':
          description: List of categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Products]
      summary: Create category
      description: |
        Create a new product category.

        **Use Case**: UC-A44
      operationId: createCategory
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreateRequest'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/categories/{categoryId}:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    patch:
      tags: [Products]
      summary: Update category
      description: |
        Update category information.

        **Use Case**: UC-A44
      operationId: updateCategory
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdateRequest'
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Products]
      summary: Delete category
      description: |
        Delete a product category.

        **Use Case**: UC-A44

        Category can only be deleted if it has no products.

        This is a **soft delete**: `deleted_at` is stamped and the row is kept so
        terminals learn about the deletion through the delta sync tombstone.
      operationId: deleteCategory
      security:
        - sessionAuth: []
      responses:
        '204':
          description: Category deleted
        '400':
          description: Category has products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: category_has_products
                message: Cannot delete category with existing products
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================================
  # SETTLEMENTS
  # ============================================================================
  /admin/settlements:
    get:
      tags: [Settlements]
      summary: List settlements
      description: |
        Retrieve settlement history.

        **Use Case**: UC-A33
      operationId: listSettlements
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
        - name: status
          in: query
          description: |
            Filter by the settlement's derived `status` (issue #377).

            The filter walks the same ladder `status` itself is derived from,
            most-final first, so a pill can never return a settlement whose own
            badge says something else: `submitted` excludes a submitted run
            that carries a reversal, because that run reads as
            `partly_reversed`.

            Two values are not statuses:

            - `reversed` merges `partly_reversed` and `fully_reversed` — the
              "money came back" question, which does not yet care how much of
              it did.
            - `active` is the pre-#377 vocabulary, kept as a **deprecated**
              alias for "not cancelled" so existing links keep working. The
              admin panel no longer offers it.

            `draft`, `exported`, `submitted`, `reversed` and `cancelled`
            partition the unfiltered list exactly.
          schema:
            type: string
            enum:
              [
                all,
                draft,
                exported,
                submitted,
                reversed,
                partly_reversed,
                fully_reversed,
                cancelled,
                active,
              ]
            default: all
        - name: date_from
          in: query
          description: Filter to settlements created on or after this date
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          description: Filter to settlements created on or before this date
          schema:
            type: string
            format: date
        - name: sort
          in: query
          description: |
            Column to sort by. `created_by` orders on the display name of the
            admin who created the settlement — the two columns the settlements
            table offers as sortable headers. Any other value falls back to
            `created_at`.
          schema:
            type: string
            enum: [created_at, created_by]
            default: created_at
        - name: order
          in: query
          description: Sort direction
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: List of settlements
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SettlementListItem'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Settlements]
      summary: Create settlement
      description: |
        Create a new settlement.

        **Use Cases**: UC-A30 (SEPA), UC-A35 (manual), UC-SEPA-05

        **SEPA settlements**:
        - Require `execution_date`, at least TODAY + 7 calendar days out, where
          TODAY is the **server's** calendar day (issue #113). No request field
          moves that anchor; a `settlement_date` in the body is ignored.
        - `execution_date` must be a bank business day — Mon-Fri, excluding the
          six TARGET2 closing days. Use `GET /admin/settlements/execution-date-info`
          for the earliest valid date rather than computing it.
        - All members with valid SEPA data are included in XML export

        **Manual settlements** (`method: bank_transfer` or `write_off`):
        - Must cover exactly one member
        - No SEPA XML export available

        **The run must collect something** (issue #372). A settlement sweeps
        each named member's whole unsettled position, and if those positions
        add up to 0.00 EUR — the ordinary case being a storno that cancels each
        of a member's sales — the run is refused with `409`. A member who owes
        nothing still settles *alongside* one who owes money: their rows close
        out and they get no line in the SEPA file. It is the run's own total
        that may not be zero, because that total is what goes to the bank.
      operationId: createSettlement
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettlementCreateRequest'
      responses:
        '201':
          description: Settlement created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: |
            Validation failed — `execution_date` is less than 7 calendar days
            from the server's today, or is not a bank business day.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: validation_failed
                messages:
                  execution_date:
                    - execution_date must be a bank business day (Mon-Fri, excluding TARGET2 closing days)
        '409':
          description: |
            The run collects nothing: every named member's open transactions
            cancel each other out, so the settlement would total 0.00 EUR and
            its SEPA file would carry no direct debit (issue #372). Also
            returned when a named transaction is already settled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: business_rule_violation
                message: >-
                  A settlement has to collect something, and this one totals 0.00 EUR — the
                  selected members' open transactions cancel each other out. Nothing is owed,
                  so there is nothing to collect and no SEPA file to send.
        '412':
          description: SEPA configuration incomplete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: sepa_config_incomplete
                message: SEPA configuration is incomplete

  /admin/settlements/preview:
    post:
      tags: [Settlements]
      summary: Preview a settlement run
      description: |
        What a collection run would contain, and who it would leave out and
        why (ruling #141, issue #161).

        `from_date`/`to_date` select the run's **participants** — the members
        with unsettled activity in that window. They do not bound the amounts:
        each participant's whole unsettled position is what is tested and, on
        inclusion, what is swept. Members split into three buckets by that
        total: `> 0` and `= 0` are eligible (zero settles but produces no line
        in the pain.008), `< 0` is excluded into `credit_members`. A member on
        collection hold after a returned direct debit lands in `held_members`
        instead, whatever their balance (ruling #148 §4).

        **Use Cases**: UC-A30, UC-SEPA-06
      operationId: previewSettlement
      security:
        - sessionAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                from_date:
                  type: string
                  format: date
                to_date:
                  type: string
                  format: date
                member_id:
                  type: string
                  format: uuid
                member_ids:
                  type: array
                  description: |
                    Name the run's participants directly. This is what the New
                    Settlement screen sends, because the unit of selection is
                    the member (ADR-0030). Takes precedence over
                    `transaction_ids` and over the date window.
                  items:
                    type: string
                    format: uuid
                transaction_ids:
                  type: array
                  description: |
                    Name the run's participants indirectly. The members are
                    resolved from these transactions exactly as
                    `POST /admin/settlements` resolves them, so previewing the
                    ids you are about to post describes that post. The amounts
                    are still each member's whole unsettled position, not these
                    transactions' sum.
                  items:
                    type: string
                    format: uuid
                sepa_eligible_only:
                  type: boolean
                  default: false
                  description: |
                    Drop the `ineligible_members` bucket and its warnings.
                    `credit_members` is never suppressed — the club owes those
                    members money, so the exclusion must stay visible.
      responses:
        '200':
          description: Settlement preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementPreview'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/settlements/execution-date-info:
    get:
      tags: [Settlements]
      summary: Earliest valid SEPA execution date
      description: |
        Returns the earliest execution date a settlement may use: today plus the
        fixed lead time, rolled forward to the next bank business day.

        Clients must use `minimum_date` rather than computing it, so the TARGET2
        calendar stays defined in one place.

        **ADR**: ADR-0009 · **Use Case**: UC-SEPA-07
      operationId: getExecutionDateInfo
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Execution date rule and the earliest valid date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionDateInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/settlements/reversal-candidates:
    get:
      tags: [Settlements]
      summary: Look up the collections a bank reference points at
      description: |
        Resolve a reference read off a bank statement to the collections it
        could belong to (epic #433, ADR-0032 §8).

        A treasurer recording a returned direct debit knows the reference the
        bank quoted and *not* which run it came from, so the return-entry UI is
        a **lookup**, not a free-hand form. German banks echo the club's own
        `EndToEndId` back as `EREF+` and the mandate as `MREF+`, so this
        endpoint substring-matches `reference` against
        `settlement_items.end_to_end_id` and `mandates.reference` — and against
        nothing else. **A member name resolves nothing**; matching names would
        turn the lookup into the free-hand picker §8 forbids, and selecting the
        wrong member reverses the wrong person's debt irreversibly.

        Matching is forgiving about shape: surrounding whitespace, letter case
        and a leading `E2E-`, `EREF+` or `MREF+` label are all stripped, and a
        partial reference matches.

        One candidate per member per settlement, most recent execution date
        first. The amount is that member's total in that run — what a reversal
        would free.

        **Candidates the reverse endpoint would refuse are still returned**,
        with `is_actionable: false` and the reason: `already_reversed` (with
        who recorded it and when) or the settlement's own
        `reversal_blocked_reason`. Filtering them out would tell a treasurer
        holding a real reference that it matches nothing.
      operationId: lookupReversalCandidates
      security:
        - sessionAuth: []
      parameters:
        - name: reference
          in: query
          required: true
          description: |
            The reference quoted on the bank statement. At least 3 characters
            after normalisation.
          schema:
            type: string
            minLength: 3
      responses:
        '200':
          description: |
            The matching collections, possibly none. An empty list means the
            reference matched no collection — most often a run predating
            persisted EndToEndIds, or a *reject* (pain.002), which never books
            to a statement at all.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReversalCandidate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: The reference is too short to identify anything.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/settlements/{settlementId}:
    parameters:
      - name: settlementId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Settlements]
      summary: Get settlement details
      description: |
        Retrieve detailed information about a settlement.

        **Use Cases**: UC-A34, UC-SEPA-06
      operationId: getSettlement
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Settlement details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # /settlements/{settlementId}/finalize — REMOVED (2026-03-07 audit)
  # Settlements are created in final state (one-step with preview).
  # execution_date is validated at creation time. See use-case-implementation-audit.md.

  /admin/settlements/{settlementId}/cancel:
    parameters:
      - name: settlementId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Settlements]
      summary: Cancel settlement
      description: |
        Cancel a settlement, releasing its transactions for future settlements.

        Transactions linked to this settlement will have their settlement_id cleared
        and become available for new settlements.

        A settlement can only be cancelled while no money has actually moved:
        - `direct_debit` — cancellable until it is marked submitted
          (`POST .../submit`), and, as a backstop once `submitted_at` was
          never set, until its `execution_date` has passed. Generating the
          SEPA XML export (`exported_at`) does **not** lock the settlement —
          the file can be regenerated, and the settlement stays cancellable
          until submission is actually reported.
        - `bank_transfer` — never cancellable; the transfer is manual and
          immediate.
        - `write_off` — always cancellable; no money moves.

        **Note**: Uses DELETE method (updated 2026-03-07 audit to match implementation).
      operationId: cancelSettlement
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Settlement cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Settlement is not cancellable — already cancelled, already
            submitted to the bank, past its `execution_date`, or a
            `bank_transfer` settlement. Reverse it instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/settlements/{settlementId}/submit:
    parameters:
      - name: settlementId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Settlements]
      summary: Mark settlement submitted
      description: |
        Record that the exported SEPA file has been handed off to the bank.

        This is the point of no return: once a `direct_debit` settlement is
        marked submitted, it can no longer be cancelled — only reversed.
      operationId: submitSettlement
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Settlement marked submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Settlement cannot be marked submitted — already submitted, never
            exported, cancelled, or not a `direct_debit` settlement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/settlements/{settlementId}/reverse:
    parameters:
      - name: settlementId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Settlements]
      summary: Reverse a settlement, per member
      description: |
        Record that the bank clawed a collection back, or that the club
        collected in error (ruling #148, issue #196).

        The other end of `submit`: once money has moved, a settlement is
        reversed, never cancelled. Exactly one of `is_cancellable` and
        `is_reversible` is true for any live settlement.

        **One mechanism, per-member granularity.** `member_ids` names who came
        back; omitting it means every member the settlement covers — the
        whole-settlement undo, not a separate code path.

        For each named member the endpoint releases that member's claim on
        their transactions (their rows survive, so the settlement's CSV export
        still shows what it originally contained) and appends a
        `settlement_reversals` row. Both writes commit together or not at all.

        A `bank_return` additionally places each member on **collection hold**,
        so the next run does not re-debit exactly what just bounced. Held
        members appear in the settlement preview's `held_members` bucket and
        are cleared via
        `POST /admin/members/{memberId}/collection-hold/clear`.
      operationId: reverseSettlement
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [bank_return, club_error]
                member_ids:
                  type: array
                  description: |
                    The members to reverse. Omit (or send an empty array) to
                    reverse every member of the settlement.
                  items:
                    type: string
                    format: uuid
                bank_reference:
                  type: string
                  maxLength: 35
                  description: The reference quoted on the bank's return booking.
                notes:
                  type: string
                  maxLength: 1000
      responses:
        '201':
          description: |
            Reversal recorded. The body is the settlement itself, with its
            recomputed `status` and the reversal events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Nothing to reverse — the settlement has not moved any money (cancel
            it instead), was already cancelled, covers no members, or one of
            the named members has already been reversed on it. The
            `UNIQUE (settlement_id, member_id)` constraint is what guarantees
            the last case.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            Invalid request — an unknown `reason`, an over-long reference, or a
            member who is not part of this settlement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/settlements/{settlementId}/export/sepa-xml:
    parameters:
      - name: settlementId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Settlements]
      summary: Download SEPA XML
      description: |
        Build and download the settlement as a SEPA Direct Debit XML file
        (pain.008.001.08).

        **Use Cases**: UC-A31, UC-SEPA-08

        **This is a POST because it carries the club's private key.** Member
        IBANs are sealed at rest and the server holds no private key
        ([ADR-0036](../../adr/0036-iban-encryption-sealed-box.md)); building a
        pain.008 is the one legitimate bulk decryption. The key lives offline in
        the club's archive and is supplied for the length of this one request,
        validated against the registered public half, used through a per-member
        opener so no plaintext collection is ever assembled, and wiped before
        the response is written. It is sent as a JSON field rather than a
        multipart upload deliberately: PHP writes multipart parts to temporary
        files on disk.

        A fresh step-up credential (the caller's own password, plus their TOTP
        code when 2FA is enrolled) is required on top of the session, and the
        response is `Cache-Control: no-store` — the body is a list of plaintext
        IBANs. The decryption is recorded as a `sepa_export` audit entry
        carrying the settlement and how many IBANs were opened, never an
        account or the XML.

        **Requirements**:
        - Settlement method must be `direct_debit` (ruling #163)
        - Settlement must be neither cancelled nor reversed
        - The active encryption key's cryptoperiod must not have expired

        **XML format**: pain.008.001.08 (SEPA Core Direct Debit)
        - Sequence type: Always RCUR
        - Minimal debtor data (name, IBAN only)

        **Members the file leaves out.** Member data is read again at export
        time and can have changed since the settlement was created — an IBAN
        cleared, a mandate revoked, a member deleted. Such a member gets no
        collection line, and the omission is reported on response headers
        rather than being dropped silently (#114, ruling #141 §3):

        | Header | Meaning |
        |---|---|
        | `X-Uncollectable-Members` | Comma-separated ids the settlement counts on and the file cannot collect from. Present only when non-empty |
        | `X-Credit-Excluded-Members` | Comma-separated ids in credit. Not a shortfall — the club owes them |
        | `X-Settlement-Amount-Cents` | What the settlement records as owed |
        | `X-Collected-Amount-Cents` | What the file actually asks the bank for |
        | `X-Shortfall-Amount-Cents` | The difference, i.e. the part to chase |

        The three amount headers accompany `X-Uncollectable-Members` and are
        absent on a clean export. Every exclusion is also written to the
        settlement's audit entry, which outlives the download.

        See [ADR-0008](../../adr/0008-sepa-xml-export-format-selection.md) for details.
      operationId: downloadSepaXml
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [private_key, current_password]
              properties:
                private_key:
                  type: string
                  description: |
                    The club's archived private key: 32 raw bytes, base64-encoded,
                    as produced by `tools/keypair-generator.html`. Validated by
                    deriving its public half and comparing that against the
                    registered ACTIVE key — never by trial decryption.
                current_password:
                  type: string
                  format: password
                  description: The caller's own password, for the step-up check.
                totp_code:
                  type: string
                  description: The caller's current TOTP code. Required when they have 2FA enrolled.
      responses:
        '200':
          description: SEPA XML file
          content:
            application/xml:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              schema:
                type: string
                example: 'attachment; filename="sepa-2026-08-06-3f9c2d1e7b4a4c8d9e2f1a5b6c7d8e9f.xml"'
            X-Uncollectable-Members:
              description: |
                Members the settlement records as owing money that the file
                cannot collect from — no active mandate, or deleted since the
                settlement was created. Omitted when there are none.
              schema:
                type: string
                example: '3fa85f64-5717-4562-b3fc-2c963f66afa6'
            X-Credit-Excluded-Members:
              description: |
                Members in credit, excluded from collection under ruling #141.
                Not part of the shortfall. Omitted when there are none.
              schema:
                type: string
                example: '3fa85f64-5717-4562-b3fc-2c963f66afa6'
            X-Settlement-Amount-Cents:
              description: The settlement's recorded total. Sent with `X-Uncollectable-Members`.
              schema:
                type: integer
                example: 3000
            X-Collected-Amount-Cents:
              description: The sum of the file's collection lines. Sent with `X-Uncollectable-Members`.
              schema:
                type: integer
                example: 1500
            X-Shortfall-Amount-Cents:
              description: Recorded total minus collected. Sent with `X-Uncollectable-Members`.
              schema:
                type: integer
                example: 1500
        '400':
          description: No eligible members for SEPA export
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: |
            No session, or the step-up credential was missing or wrong. Nothing
            was decrypted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Settlement is cancelled, has reversed collections, or does not use
            the `direct_debit` method. Re-exporting a reversed settlement would
            hand the bank a file that debits every member on it a second time.

            Also returned when the file would carry no direct debit at all
            (issue #372) — every member in the settlement owes 0.00 EUR, or
            every one of them has since been excluded. `pain.008` has no
            representation for collecting nothing: a `PmtInf` must hold at
            least one `DrctDbtTxInf`, so the alternative is a file the bank
            rejects.

            Also returned as `encryption_key_expired` when the active key's
            365-day cryptoperiod is over: rotate the encryption key before
            creating another SEPA export. Key management itself stays reachable
            in that state, so rotating out of it is always possible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '412':
          description: Settlement not of SEPA type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            `private_key` missing, or `private_key_mismatch` — the supplied key
            does not belong to the registered active key, so it would decrypt
            nothing. No file is produced and the settlement is not marked
            exported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

