            type: string
            format: uuid
        - name: search
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [created_at, amount, type, member]
            default: created_at
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: settlement_status
          in: query
          schema:
            type: string
            enum: [open, settled]
      responses:
        '200':
          description: Transactions list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GlobalTransaction'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================================================
  # SETTLEMENT FILTER ENDPOINTS
  # ============================================================================
  /admin/settlements/filter-preview:
    get:
      tags: [Settlements]
      summary: Preview settlement by date filter
      description: Preview which transactions would be included in a settlement based on date filters
      operationId: previewSettlementByFilters
      security:
        - sessionAuth: []
      parameters:
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
        - name: search
          in: query
          schema:
            type: string
        - name: member_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Filter preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementFilterPreview'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/settlements/settle-filter:
    post:
      tags: [Settlements]
      summary: Create settlement by date filter
      description: |
        Create a settlement for all unsettled transactions matching date filters.

        `execution_date` follows the same rule as `POST /admin/settlements`: at
        least `settlement_date` + 7 calendar days, and a bank business day
        (Mon-Fri, excluding the six TARGET2 closing days).
      operationId: createSettlementByFilters
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                settlement_date:
                  type: string
                  format: date
                execution_date:
                  type: string
                  format: date
                date_from:
                  type: string
                  format: date
                date_to:
                  type: string
                  format: date
                search:
                  type: string
                member_id:
                  type: string
                  format: uuid
                notes:
                  type: string
      responses:
        '201':
          description: Settlement created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: |
            Validation failed — `execution_date` is earlier than
            `settlement_date` + 7 days, or is not a bank business day.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: validation_failed
                messages:
                  execution_date:
                    - execution_date must be a bank business day (Mon-Fri, excluding TARGET2 closing days)

  /admin/dashboard:
    get:
      summary: Get Dashboard Metrics
      operationId: getDashboardMetrics
      description: |
        Retrieve aggregated dashboard metrics and system overview.
        Combines metrics from members, transactions, terminals, and settlements modules.

        Implements UC-A80: Dashboard

        **Response Data**:
        - metrics: Business metrics (member counts, balance, revenue, terminals)
        - recent_transactions: Last 10 transactions with member and product details
        - terminal_status: All terminals with connectivity information
        - system_status: High-level system indicators
        - alerts: SEPA compliance alerts

        **Performance Notes**:
        - Point-in-time snapshot (not real-time streaming)
        - Optimized with database aggregations
        - Typical response time: < 500ms
      tags:
        - Dashboard
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Dashboard metrics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Database error while aggregating metrics

# ==============================================================================
# COMPONENTS
# ==============================================================================
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: PHPSESSID
      description: PHP session cookie (HttpOnly, Secure, SameSite=Lax)

  parameters:
    memberId:
      name: memberId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    page:
      name: page
      in: query
      description: Page number (1-indexed)
      schema:
        type: integer
        minimum: 1
        default: 1
    perPage:
      name: per_page
      in: query
      description: Items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

  responses:
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unauthorized
            message: Authentication required
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: Resource not found
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'

  schemas:
    # --------------------------------------------------------------------------
    # Common
    # --------------------------------------------------------------------------
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Error code
        message:
          type: string
          description: Human-readable error message
        details:
          type: object
          additionalProperties: true
          description: Additional error details

    ValidationErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: validation_error
        message:
          type: string
          example: Validation failed
        details:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            iban: ["Invalid IBAN checksum"]
            first_name: ["Required field"]

    Pagination:
      type: object
      description: |
        The pagination block every list endpoint returns beside its `data`
        array. All four fields are always present.
      required: [page, per_page, total, total_pages]
      properties:
        page:
          type: integer
          description: 1-indexed page the `data` array belongs to.
        per_page:
          type: integer
          description: Rows requested per page (maximum 100).
        total:
          type: integer
          description: Rows matching the filters, across all pages.
        total_pages:
          type: integer
          description: ceil(total / per_page); 0 when nothing matched.

    MultilingualText:
      type: object
      description: Multilingual text (ISO 639-1 keys)
      additionalProperties:
        type: string
      example:
        de: "Bier 0,5L"
        en: "Beer 0.5L"

    # --------------------------------------------------------------------------
    # Authentication
    # --------------------------------------------------------------------------
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      description: |
        The shape returned depends on the authentication branch:
        - TOTP-enrolled admin: only `requiresMfa` is set — call POST /auth/mfa next.
        - First-time admin (no TOTP yet): `requiresTotpSetup`, `admin`, and
          `csrf_token` are set — call POST /auth/2fa/setup next.
      properties:
        requiresMfa:
          type: boolean
          description: True when the admin has TOTP enabled. Call POST /auth/mfa with the code next.
        requiresTotpSetup:
          type: boolean
          description: True on an admin's first login. Call POST /auth/2fa/setup to begin enrollment.
        admin:
          $ref: '#/components/schemas/AdminProfile'
        csrf_token:
          type: string
          description: CSRF token for subsequent state-changing requests (present alongside requiresTotpSetup)

    MfaRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: 6-digit TOTP code
          pattern: '^\d{6}$'

    MfaResponse:
      type: object
      required: [message, admin, csrf_token]
      properties:
        message:
          type: string
        admin:
          $ref: '#/components/schemas/AdminProfile'
        csrf_token:
          type: string
          description: CSRF token for subsequent state-changing requests

    Setup2faResponse:
      type: object
      required: [qrCode, secret]
      properties:
        qrCode:
          type: string
          description: otpauth:// URI to render as a QR code
        secret:
          type: string
          description: Plain-text TOTP secret, shown as a manual-entry fallback

    Confirm2faRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: 6-digit TOTP code from the authenticator app
          pattern: '^\d{6}$'

    Reset2faRequest:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid
          description: ID of the admin user whose TOTP enrollment should be cleared

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password, confirm_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 8
          description: "Min 8 chars, 1 uppercase, 1 lowercase, 1 digit"
        confirm_password:
          type: string
          format: password

    AdminProfile:
      type: object
      required: [id, email, display_name, locale, totp_enabled]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        locale:
          type: string
        last_login_at:
          type: string
          format: date-time
          nullable: true
        totp_enabled:
          type: boolean
          description: Whether TOTP two-factor authentication is enrolled for this admin

    GetProfileResponse:
      type: object
      required: [admin]
      properties:
        admin:
          $ref: '#/components/schemas/AdminProfile'
        csrf_token:
          type: string
          nullable: true

    UpdateProfileResponse:
      type: object
      required: [message, admin]
      properties:
        message:
          type: string
        admin:
          $ref: '#/components/schemas/AdminProfile'

    UpdateProfileRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        display_name:
          type: string
        locale:
          type: string
          enum: [de, en]

    # --------------------------------------------------------------------------
    # Members
    # --------------------------------------------------------------------------
    MemberListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        balance_cents:
          type: integer
          description: Current outstanding balance in cents
        card_uid:
          type: string
          nullable: true
        iban_masked:
          type: string
          nullable: true
          description: Masked IBAN (e.g., DE89****3000)
        is_active:
          type: boolean
        is_sepa_valid:
          type: boolean
          description: Whether member has valid IBAN and mandate_reference
        created_at:
          type: string
          format: date-time

    CreditBalance:
      type: object
      properties:
        member_id:
          type: string
          format: uuid
        first_name:
          type: string
        last_name:
          type: string
        balance_cents:
          type: integer
          description: Total unsettled position, negative because the club owes this member money
          example: -1500

    ExtractionField:
      type: object
      nullable: true
      properties:
        value:
          type: string
          nullable: true
          description: Extracted value, null if not found or illegible
        confidence:
          type: string
          nullable: true
          enum: [high, medium, low, null]
          description: Model confidence in the extracted value

    ExtractionResult:
      type: object
      properties:
        fields:
          type: object
          properties:
            first_name:
              $ref: '#/components/schemas/ExtractionField'
            last_name:
              $ref: '#/components/schemas/ExtractionField'
            email:
              $ref: '#/components/schemas/ExtractionField'
            street:
              $ref: '#/components/schemas/ExtractionField'
            zip_code:
              $ref: '#/components/schemas/ExtractionField'
            city:
              $ref: '#/components/schemas/ExtractionField'
            iban:
              $ref: '#/components/schemas/ExtractionField'
            account_holder_name:
              $ref: '#/components/schemas/ExtractionField'
            mandate_signed_at:
              $ref: '#/components/schemas/ExtractionField'
            card_uid:
              $ref: '#/components/schemas/ExtractionField'
        needsReview:
          type: boolean
          description: >
            True when any field has confidence "low" or when ibanCandidates is
            non-empty (ambiguous IBAN repair — user must select the correct IBAN).
        ibanCandidates:
          type: array
          items:
            type: string
          description: >
            Two or more valid IBAN alternatives when MOD-97 repair is ambiguous.
            The first candidate is pre-selected in fields.iban.value. Empty or
            absent when the IBAN is unambiguous.

    BankLookupResponse:
      type: object
      properties:
        bank_code:
          type: string
          description: 8-digit Bankleitzahl (BLZ) extracted from IBAN
        bank_name:
          type: string
          nullable: true
          description: Full bank name from Bundesbank BLZ file
        short_name:
          type: string
          nullable: true
          description: Short bank designation
        bic:
          type: string
          nullable: true
          description: SWIFT/BIC code
        postal_code:
          type: string
          nullable: true
          description: Postal code of bank headquarters
        city:
          type: string
          nullable: true
          description: City of bank headquarters

    MandateDocument:
      type: object
      required:
        - uploaded_at
        - file_size_bytes
        - original_filename
      properties:
        uploaded_at:
          type: string
          format: date-time
          description: When the document was last uploaded or replaced
        file_size_bytes:
          type: integer
          description: Size of the stored PDF in bytes
        original_filename:
          type: string
          description: Original filename as provided by the client
        extraction_status:
          type: string
          nullable: true
          enum: [completed, failed]
          description: LLM extraction status; null if extraction has never been attempted
        extraction:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ExtractionResult'
          description: Extraction results; null if extraction was not attempted or not configured

    Member:
      type: object
      properties:
        id:
          type: string
          format: uuid
        first_name:
          type: string
          nullable: true
          maxLength: 100
        last_name:
          type: string
          nullable: true
          maxLength: 100
        email:
          type: string
          format: email
          nullable: true
        card_uid:
          type: string
          nullable: true
        preferred_language:
          type: string
          description: ISO 639-1 language code
        iban:
          type: string
          nullable: true
          description: Full IBAN (unmasked in detail view)
        account_holder_name:
          type: string
          nullable: true
          maxLength: 70
          description: Account holder name if different from member. Used in SEPA XML.
        mandate_reference:
          type: string
          nullable: true
          maxLength: 35
        mandate_signed_at:
          type: string
          format: date
          nullable: true
        bank_name:
          type: string
          nullable: true
          description: Bank name resolved from IBAN via Bundesbank BLZ lookup (German IBANs only)
        is_active:
          type: boolean
        is_sepa_valid:
          type: boolean
        balance_cents:
          type: integer
        deleted_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        mandate_document:
          nullable: true
          description: Stored mandate document info, or null if none uploaded
          allOf:
            - $ref: '#/components/schemas/MandateDocument'

    MemberCreateRequest:
      type: object
      required: [first_name, last_name, iban, mandate_signed_at, preferred_language]
      properties:
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
        preferred_language:
          type: string
          description: ISO 639-1 language code
          example: de
        iban:
          type: string
          description: ISO 13616 IBAN
          minLength: 15
          maxLength: 34
        account_holder_name:
          type: string
          maxLength: 70
          description: Account holder name if different from member (for divergent payer)
        mandate_signed_at:
          type: string
          format: date
          description: Mandate signature date (not in future)
        mandate_reference:
          type: string
          maxLength: 35
          description: Optional; defaults to UUID without hyphens
        card_uid:
          type: string
          pattern: '^[0-9A-F]{8,20}$'
          description: Optional RFID card UID

    MemberUpdateRequest:
      type: object
      properties:
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          nullable: true
        preferred_language:
          type: string
        iban:
          type: string
          minLength: 15
          maxLength: 34
        account_holder_name:
          type: string
          maxLength: 70
          nullable: true
        mandate_reference:
          type: string
          maxLength: 35
        mandate_signed_at:
          type: string
          format: date
        is_active:
          type: boolean
        card_uid:
          type: string
          pattern: '^[0-9A-F]{8,20}$'
          nullable: true
          description: RFID card UID (null to remove)

    MemberImportPreview:
      type: object
      properties:
        import_id:
          type: string
          description: ID to use for confirmation
        preview:
          type: array
          items:
            type: object
            properties:
              row:
                type: integer
              status:
                type: string
                enum: [valid, error]
              data:
                type: object
              errors:
                type: array
                items:
                  type: string
        summary:
          type: object
          properties:
            total_rows:
              type: integer
            valid:
              type: integer
            invalid:
              type: integer

    # --------------------------------------------------------------------------
    # Transactions
    # --------------------------------------------------------------------------
    Transaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        member_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
          nullable: true
        amount_cents:
          type: integer
        transaction_type:
          type: string
          enum: [purchase, storno, payout]
        notes:
          type: string
          nullable: true
        related_transaction_id:
          type: string
          format: uuid
          nullable: true
          description: |
            For a `storno`, the transaction it reverses — never null. Null for
            every other type (GoBD Rz. 64, ADR-0028 §4).
        stornoed_by_transaction_id:
          type: string
          format: uuid
          nullable: true
          description: |
            The storno that reverses this transaction, if it has one. The
            reverse of `related_transaction_id`, so the journal can show the
            linkage from either row and refuse a second storno before the
            request is made. Unique — a transaction is stornoable at most once.
        settlement_id:
          type: string
          format: uuid
          nullable: true
        created_by_terminal_id:
          type: string
          format: uuid
          nullable: true
        created_by_admin_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time

    MemberTransactionHistory:
      type: object
      properties:
        member_id:
          type: string
          format: uuid
        current_balance_cents:
          type: integer
          description: |
            The member's **unsettled** position — what they still owe (positive)
            or the credit the club owes them (negative), per ruling
            [#141](https://github.com/dgloeckner/ruderbar/issues/141).
            The `transactions` list below is the full history and still contains
            transactions this figure excludes because a settlement claimed them.
        transactions:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              date:
                type: string
                format: date-time
              type:
                type: string
                enum: [purchase, storno, payout]
              description:
                type: string
              amount_cents:
                type: integer
              running_total_cents:
                type: integer
              settlement_id:
                type: string
                format: uuid
                nullable: true
        settlements:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              date:
                type: string
                format: date
              amount_cents:
                type: integer
              type:
                type: string
                enum: [sepa, manual]

    # ManualTransactionRequest — REMOVED (#169, 2026-08-08).
    # It carried a caller-supplied `amount_cents`. Replaced by StornoRequest,
    # which carries a reason and nothing else.

    StornoRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: |
            Why the booking is being reversed. Required, and recorded both on
            the storno row and in the audit log.

            This is the **only** field. The amount is derived as the exact
            negation of the transaction named in the path; the member is read
            from it too. Neither is accepted from the caller.

    # --------------------------------------------------------------------------
    # Products & Categories
    # --------------------------------------------------------------------------
    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        names:
          $ref: '#/components/schemas/MultilingualText'
        descriptions:
          $ref: '#/components/schemas/MultilingualText'
        price_cents:
          type: integer
          minimum: 1
        is_active:
          type: boolean
        icon_name:
          type: string
          nullable: true
          maxLength: 50
          description: Name of the icon component to display
          example: "PilsIcon"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProductCreateRequest:
      type: object
      required: [names, price_cents, category_id]
      properties:
        names:
          $ref: '#/components/schemas/MultilingualText'
        descriptions:
          $ref: '#/components/schemas/MultilingualText'
        price_cents:
          type: integer
          minimum: 1
          maximum: 999999
        category_id:
          type: string
          format: uuid
        icon_name:
          type: string
          nullable: true
          maxLength: 50
          description: Name of the icon component to display
          example: "PilsIcon"

    ProductUpdateRequest:
      type: object
      properties:
        names:
          $ref: '#/components/schemas/MultilingualText'
        descriptions:
          $ref: '#/components/schemas/MultilingualText'
        price_cents:
          type: integer
          minimum: 1
          maximum: 999999
        category_id:
          type: string
          format: uuid
        is_active:
          type: boolean
        icon_name:
          type: string
          nullable: true
          maxLength: 50
          description: Name of the icon component to display
          example: "PilsIcon"

    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        names:
          $ref: '#/components/schemas/MultilingualText'
        is_active:
          type: boolean
        icon_name:
          type: string
          nullable: true
          maxLength: 50
          description: Name of the icon component to display
          example: "CategoryIcon"
        product_count:
          type: integer
          description: Number of products in this category
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CategoryCreateRequest:
      type: object
      required: [names]
      properties:
        names:
          $ref: '#/components/schemas/MultilingualText'
        is_active:
          type: boolean
          default: true
        icon_name:
          type: string
          nullable: true
          maxLength: 50
          description: Name of the icon component to display
          example: "CategoryIcon"

    CategoryUpdateRequest:
      type: object
      properties:
        names:
          $ref: '#/components/schemas/MultilingualText'
        is_active:
          type: boolean
        icon_name:
          type: string
          nullable: true
          maxLength: 50
          description: Name of the icon component to display
          example: "CategoryIcon"

    # --------------------------------------------------------------------------
    # Settlements
    # --------------------------------------------------------------------------
    SettlementListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        method:
          type: string
          enum: [direct_debit, bank_transfer, write_off]
          description: |
            How this settlement's balance is collected. Replaces the old
            `settlement_type`/`manual_reason` pair (ruling #163). Only
            `direct_debit` settlements can be exported to SEPA.
        settlement_date:
          type: string
          format: date
        execution_date:
          type: string
          format: date
          nullable: true
        member_count:
          type: integer
        total_amount_cents:
          type: integer
        is_cancelled:
          type: boolean
        exported_at:
          type: string
          format: date-time
          nullable: true
        submitted_at:
          type: string
          format: date-time
          nullable: true
        submitted_by_admin_id:
          type: string
          format: uuid
          nullable: true
        is_cancellable:
          type: boolean
          description: Whether a cancel request would currently be accepted.
        cancellation_blocked_reason:
          type: string
          nullable: true
          description: |
            Human-readable reason cancellation is unavailable. Null when
            `is_cancellable` is true.
        created_at:
          type: string
          format: date-time

    Settlement:
      type: object
      properties:
        id:
          type: string
          format: uuid
        method:
          type: string
          enum: [direct_debit, bank_transfer, write_off]
          description: |
            How this settlement's balance is collected. Replaces the old
            `settlement_type`/`manual_reason` pair (ruling #163). Only
            `direct_debit` settlements can be exported to SEPA.
        settlement_date:
          type: string
          format: date
        execution_date:
          type: string
          format: date
          nullable: true
        period_start:
          type: string
          format: date
          nullable: true
        period_end:
          type: string
          format: date
          nullable: true
        sepa_message_id:
          type: string
          nullable: true
        total_amount_cents:
          type: integer
        member_count:
          type: integer
        is_cancelled:
          type: boolean
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        exported_at:
          type: string
          format: date-time
          nullable: true
        submitted_at:
          type: string
          format: date-time
          nullable: true
        submitted_by_admin_id:
          type: string
          format: uuid
          nullable: true
        is_cancellable:
          type: boolean
          description: Whether a cancel request would currently be accepted.
        cancellation_blocked_reason:
          type: string
          nullable: true
          description: |
            Human-readable reason cancellation is unavailable. Null when
            `is_cancellable` is true.
        notes:
          type: string
          nullable: true
        created_by_admin_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        members:
          type: array
          items:
            type: object
            properties:
              member_id:
                type: string
                format: uuid
              member_name:
                type: string
              amount_cents:
                type: integer
              iban_masked:
                type: string
                nullable: true
              mandate_reference:
                type: string
                nullable: true
              is_sepa_eligible:
                type: boolean

    ExecutionDateInfo:
      type: object
      required: [minimum_date, lead_time_days, rule, today]
      properties:
        today:
          type: string
          format: date
          description: |
            The server's own calendar day, the one `minimum_date` was derived
            from. Clients must build `settlement_date` from this rather than
            from their local clock: a browser east of UTC is a calendar day
            ahead of a UTC server every evening, and pairing a locally-dated
            `settlement_date` with this `minimum_date` fails the lead-time
            check on a pair the server itself proposed.
          example: '2026-08-05'
        minimum_date:
          type: string
          format: date
          description: Earliest valid execution date; always a bank business day.
          example: '2026-08-12'
        lead_time_days:
          type: integer
          description: Fixed SEPA lead time in calendar days (ADR-0009).
          example: 7
        rule:
          type: string
          description: Human-readable statement of the rule, for display in the admin UI.
          example: >-
            execution_date >= today + 7 calendar days, rolled to the next bank
            business day (Mon-Fri, excluding TARGET2 closing days)

    SettlementPreview:
      type: object
      properties:
        eligible_members:
          type: array
          description: Members with an active SEPA mandate whose total unsettled position is >= 0
          items:
            $ref: '#/components/schemas/SettlementPreviewMember'
        ineligible_members:
          type: array
          description: Members who owe money but hold no active SEPA mandate — remedy is to chase the bank details
          items:
            $ref: '#/components/schemas/SettlementPreviewMember'
        credit_members:
          type: array
          description: |
            Members whose total unsettled position is negative. Excluded from
            the settlement and from the file; the remedy is the opposite of
            the ineligible bucket's — pay them back (ruling #141, § 812 BGB).
          items:
            $ref: '#/components/schemas/SettlementPreviewMember'
        eligible_total:
          type: integer
        ineligible_total:
          type: integer
        credit_total:
          type: integer
          description: Sum of the credit bucket; negative, or zero if nobody is in credit
          example: -1500
        member_count:
          type: integer
          description: Members placed in any bucket
        warnings:
          type: array
          items:
            type: string

    SettlementPreviewMember:
      type: object
      properties:
        member_id:
          type: string
          format: uuid
        first_name:
          type: string
        last_name:
          type: string
        balance_cents:
          type: integer
          description: The member's whole unsettled position, not the window's slice
        iban:
          type: string
          nullable: true
        mandate_reference:
          type: string
          nullable: true

    SettlementCreateRequest:
      type: object
      properties:
        method:
          type: string
          enum: [direct_debit, bank_transfer, write_off]
          default: direct_debit
          description: |
            How this settlement's balance will be collected. Replaces the old
            `settlement_type`/`manual_reason` pair (ruling #163).
            `bank_transfer` and `write_off` settlements must cover exactly one
            member and can never be exported to SEPA.
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        execution_date:
          type: string
          format: date
          description: Required for direct_debit (>= TODAY + 7 days)
        notes:
          type: string
          maxLength: 500
        member_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Optional filter to specific members

    SettlementFilterPreview:
      type: object
      properties:
        transaction_count:
          type: integer
        member_count:
          type: integer
        total_amount_cents:
          type: integer

    # --------------------------------------------------------------------------
    # Terminals
    # --------------------------------------------------------------------------
    Terminal:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        device_id:
          type: string
        is_active:
          type: boolean
        last_sync_at:
          type: string
          format: date-time
          nullable: true
        last_transaction_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateTerminalRequest:
      type: object
      required: [name, device_id]
      properties:
        name:
          type: string
        device_id:
          type: string

    UpdateTerminalRequest:
      type: object
      properties:
        name:
          type: string
        is_active:
          type: boolean

    TerminalWithToken:
      allOf:
        - $ref: '#/components/schemas/Terminal'
        - type: object
          properties:
            api_token:
              type: string
              description: API token for terminal authentication

    # --------------------------------------------------------------------------
    # Global Transactions
    # --------------------------------------------------------------------------
    GlobalTransaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        member_id:
          type: string
          format: uuid
        member_name:
          type: string
        type:
          type: string
          enum: [purchase, storno, payout]
        amount_cents:
          type: integer
        description:
          type: string
        product_id:
          type: string
          format: uuid
          nullable: true
        product_name:
          type: string
          nullable: true
        product_names:
          type: string
          nullable: true
          description: JSON string with multilingual product names
        created_at:
          type: string
          format: date-time
        created_by_admin_id:
          type: string
          format: uuid
          nullable: true
        created_by_terminal_id:
          type: string
          format: uuid
          nullable: true
        is_settled:
          type: boolean
        settlement_date:
          type: string
          format: date
          nullable: true
        related_transaction_id:
          type: string
          format: uuid
          nullable: true
          description: |
            For a `storno`, the transaction it reverses — never null. Null for
            every other type (GoBD Rz. 64, ADR-0028 §4).
        stornoed_by_transaction_id:
          type: string
          format: uuid
          nullable: true
          description: |
            The storno that reverses this transaction, if it has one — the
            reverse of `related_transaction_id`. Lets the journal show the
            linkage from either row and refuse a second storno before the
            request is made.

    # --------------------------------------------------------------------------
    # SEPA Configuration
    # --------------------------------------------------------------------------
    SepaConfig:
      type: object
      properties:
        creditor_id:
          type: string
          description: Gläubiger-ID (masked)
        creditor_name:
          type: string
          maxLength: 70
        creditor_iban:
          type: string
          description: Masked IBAN
        creditor_address_street:
          type: string
          maxLength: 70
        creditor_address_city:
          type: string
          maxLength: 70
        creditor_address_country:
          type: string
          minLength: 2
          maxLength: 2
        payment_reference_prefix:
          type: string
          maxLength: 100
          description: Prefix of the payment reference shown on member bank statements
        is_configured:
          type: boolean
          description: True once creditor_id, creditor_name and creditor_iban are all set
        updated_at:
          type: string
          format: date-time

    SepaConfigRequest:
      type: object
      required: [creditor_id, creditor_name, creditor_iban, creditor_address_street, creditor_address_city]
      properties:
        creditor_id:
          type: string
          maxLength: 35
          description: Gläubiger-ID (immutable after set)
        creditor_name:
          type: string
          maxLength: 70
        creditor_iban:
          type: string
          minLength: 15
          maxLength: 34
        creditor_address_street:
          type: string
          maxLength: 70
        creditor_address_city:
          type: string
          maxLength: 70
        creditor_address_country:
          type: string
          minLength: 2
          maxLength: 2
          default: DE
        payment_reference_prefix:
          type: string
          maxLength: 100
          description: Prefix of the payment reference shown on member bank statements

    SepaConfigUpdateRequest:
      type: object
      description: |
        `creditor_id` is deliberately absent: it is immutable after initial
        setup and is only accepted by `POST /admin/sepa-config`.
      properties:
        creditor_name:
          type: string
          maxLength: 70
        creditor_iban:
          type: string
          minLength: 15
          maxLength: 34
        creditor_address_street:
          type: string
          maxLength: 70
        creditor_address_city:
          type: string
          maxLength: 70
        creditor_address_country:
          type: string
          minLength: 2
          maxLength: 2
        payment_reference_prefix:
          type: string
          maxLength: 100
          description: Prefix of the payment reference shown on member bank statements

