      operationId: getCreditLimitConfig
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Credit limit configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditLimitConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'

    patch:
      tags: [Credit Limits]
      summary: Update the club's credit limit configuration
      description: |
        Set the club-wide ceiling and warning band.

        **Use Case**: UC-A65

        `admin` and `kassenwart`. Takes effect on a terminal at its next
        `/sync/config` poll, and on every member who carries no override of
        their own — which is what a club-level default is for.
      operationId: updateCreditLimitConfig
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditLimitConfigUpdateRequest'
      responses:
        '200':
          description: Credit limit configuration updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditLimitConfig'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'

  # ============================================================================
  # MAIL SETTINGS
  # ============================================================================
  /admin/mail-config:
    get:
      tags: [Mail Settings]
      summary: Get mail settings
      description: |
        The club-editable half of outgoing mail configuration (ADR-0038):
        sender, reply-to, header variant and the footer block.

        The SMTP DSN is deliberately **not** part of this resource. It carries
        a password and lives in `config.php` in the data directory alongside
        the database password (ADR-0031 decision 2), so changing the mail
        server is an installer or file operation. The read-only `transport`
        object reports whether one is configured and where mail goes, never
        the DSN itself.
      operationId: getMailConfig
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Mail configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Mail Settings]
      summary: Update mail settings
      operationId: updateMailConfig
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailConfigUpdateRequest'
      responses:
        '200':
          description: Mail configuration updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/mail-config/test-mail:
    post:
      tags: [Mail Settings]
      summary: Send yourself a test mail
      description: |
        The one place in this application that opens an SMTP connection from a
        web request rather than from the scheduler, and the boundaries that keep
        that from contradicting ADR-0038 rule 3 are enforced rather than
        documented:

        - **The recipient is the requesting admin's own address**, read from the
          session. There is no parameter, because an endpoint that mails an
          arbitrary address on request is an authenticated open relay on the
          club's own domain.
        - **The content is fixed** — no member, no settlement, nothing
          interpolated from a request. A test mail cannot be turned into a
          message to somebody about something.

        Rule 3 governs *queued* messages: a settlement's announcements must not
        leave from inside a request, because a gateway timeout mid-loop leaves
        announcement state that cannot be reconstructed. None of that applies to
        a message that is never queued, carries no member data, and whose entire
        value is the error text arriving while the admin is still looking at the
        screen.
      operationId: sendTestMail
      security:
        - sessionAuth: []
      responses:
        '200':
          description: What the transport answered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestMailResult'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================================================
  # SCHEDULER
  # ============================================================================
  /admin/scheduler:
    get:
      tags: [Scheduler]
      summary: Has the mail drain ever run, and what to schedule if not
      description: |
        The scheduler is a hard prerequisite, not a fallback layer (#405). The
        drain (`backend/bin/cron.php`, ADR-0038 rule 3) is the only thing that
        sends announcement emails, so an installation where no run has ever
        been observed cannot keep Nutzungsordnung § 7 Abs. 3's promise that
        every collection is announced seven days ahead — and finalizing a
        direct-debit settlement is refused there with
        `error: scheduler_not_verified`.

        `verified` keys on *ever*, not *recently*, and never returns to
        `false`. A scheduler that dies later is a monitoring alarm (#406), not
        a lockout: refusing a collection at the moment the treasurer needs it
        is the worse failure, and the member's eight-week no-questions refund
        stands regardless.

        `setup` carries the instructions for *this* installation, so the
        installer's prerequisite step, the admin banner and the refusal all
        print the same command. `drain_url` is `null` when `cron.secret` is
        unset — the route is not mounted then, and offering the URL would be
        instructions for something that is not there.

        ### The response depends on the caller's role (#677)

        `admin` and `kassenwart` may both call this. They do not get the same
        body, and a client must not assume the operator half is present:

        | Role | Body |
        |---|---|
        | `admin` | Every field below |
        | `kassenwart` | `verified` and `setup.recommended_interval_minutes`, nothing else |
        | `getraenkewart` | `403 insufficient_role` |

        The grant is wider than the payload on purpose. The gate this reports
        on refuses the *treasurer's* button — finalizing a direct debit is
        blocked until a run has been observed, and every settlement route
        belongs to the Kassenwart — so the warning has to reach that office.
        The operator half describes the deployment rather than the club:
        `setup.cli_command` names this installation's document root,
        `drain_url` names its trigger endpoint, and `php_version`,
        `missing_extensions` and the interval pair are the self-check's reading
        of a host no club office can reach. That stays behind `admin`
        (ADR-0031), and so does the whole `backup` section (#693) — its command
        names the same document root, and a missing backup cron is fixed in a
        hosting panel a club office cannot open.

        A `getraenkewart` is out of the grant deliberately rather than by
        omission: nothing they can do is blocked by the gate. The panel does
        not call this for them either, so the `403` is what a bookmark gets,
        not something a session fires on every page.
      operationId: getSchedulerStatus
      security:
        - sessionAuth: []
      responses:
        '200':
          description: |
            Scheduler status — every field for `admin`, and `verified` plus
            `setup.recommended_interval_minutes` alone for `kassenwart`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'

  /admin/notifications:
    get:
      tags: [Notifications]
      summary: The mail queue
      description: |
        Every queued message, newest first — what was queued, for whom, whether
        it left, and the reason from the receiving server when it did not.
        ADR-0038 rule 6 makes delivery best effort *and never invisible*; this
        is the surface that keeps the second half of that promise.

        A queue view rather than a per-settlement one on purpose: the periodic
        Deckelauszug ([ADR-0039](../../adr/0039-periodic-deckel-statement.md))
        has no settlement, so a page keyed on settlements would make an entire
        message kind invisible by construction. `subject_id` narrows it to one
        settlement where that is what the caller wants.

        There is deliberately **no body** in the response and nowhere to fetch
        one: nothing stores a rendered message (ADR-0038 rule 5), so the queue
        can say what was queued and never "here is what was sent".

        An unknown `kind` or `status` is rejected with `422` rather than
        ignored — silently dropping the filter would answer a question nobody
        asked, and the caller could not tell that from an empty result.
      operationId: listNotifications
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
        - name: kind
          in: query
          schema:
            $ref: '#/components/schemas/MailKind'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/MailStatus'
        - name: subject_id
          in: query
          description: Narrow to one settlement, key or terminal.
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          description: Matches the snapshot recipient address, or the member's name.
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [queued_at, sent_at, status, kind, recipient]
            default: queued_at
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: A page of the queue
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/QueuedMail'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  filters:
                    type: object
                    description: |
                      The vocabulary the filters accept, from the server that
                      enforces it — so a client's dropdown cannot drift from the
                      values on the day a kind is added.
                    properties:
                      kinds:
                        type: array
                        items:
                          $ref: '#/components/schemas/MailKind'
                      statuses:
                        type: array
                        items:
                          $ref: '#/components/schemas/MailStatus'
                      sortable:
                        type: array
                        items:
                          type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/notifications/{id}/retry:
    post:
      tags: [Notifications]
      summary: Put a failed message back in the queue
      description: |
        The **only** state change this API offers on the queue, and deliberately
        the only one (ADR-0038 rule 4: the UI may change state, it may never
        orchestrate time). The row returns to `pending` with its attempt count
        reset, and the scheduler sends it whenever it next runs.

        Nothing here reports *when* that will be, because the honest answer is
        "at the next tick". There is no endpoint that drains, and none that
        reports progress for a client to poll — a browser tab must not be able
        to become a second sending path.

        Only a `failed` message is eligible. A `sent` one has reached somebody
        and resending it is not a retry; a `pending` one is already going to be
        tried; a `superseded` one belongs to a collection that was called off,
        and reviving it would announce a debit that is not happening. Those are
        `409`, not `422`: nothing about the request is malformed.
      operationId: retryNotification
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The message as it now stands
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueuedMail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such queued message
        '409':
          description: |
            The message exists but is not retryable. The body names which status
            it carries and why that status cannot go back in the queue.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: not_retryable
                  message:
                    type: string

  /cron/drain:
    get:
      tags: [Scheduler]
      summary: Drain the mail outbox (URL trigger)
      description: |
        The fallback trigger for the announcement drain, for hosting with no
        CLI cron (ADR-0038 rule 3). `backend/bin/cron.php` is the preferred
        one — no gateway timeout, no secret in a URL — and both call the same
        service; this is not a second sending path.

        **Authorisation** is a dedicated secret in `config.php` (`cron.secret`),
        never an admin session and never the install key. Absent, the route is
        not mounted and answers `404`: an installation on a CLI cron carries no
        extra unauthenticated entrance.

        Present it in the `X-Cron-Secret` header. The `secret` query parameter
        is supported for panels that cannot send a header and is **degraded**:
        the request line, secret and all, is written verbatim to the
        webserver's access log. The application scrubs it from its own records
        and from the request environment, which does not reach a log the
        webserver has already written.

        `GET` and `POST` both, because panels differ on what they can schedule.

        The response carries **no body** by design. The caller is a scheduler
        and cannot act on counts; what the run did goes to `cron_heartbeat` and
        the application log, where an authenticated admin reads it.
      operationId: drainMailOutbox
      security: []
      parameters:
        - name: secret
          in: query
          required: false
          description: |
            Degraded alternative to the `X-Cron-Secret` header — see above.
          schema:
            type: string
      responses:
        '204':
          description: |
            The run completed. Says nothing about how many messages were sent,
            including when the run did nothing because no transport is
            configured.
        '401':
          description: Missing or wrong secret
        '404':
          description: No `cron.secret` configured — the URL trigger is off on this installation
    post:
      tags: [Scheduler]
      summary: Drain the mail outbox (URL trigger)
      description: |
        Identical to `GET /cron/drain`. Both verbs exist because panels differ
        on which they can schedule.
      operationId: drainMailOutboxPost
      security: []
      responses:
        '204':
          description: The run completed
        '401':
          description: Missing or wrong secret
        '404':
          description: No `cron.secret` configured — the URL trigger is off on this installation

  /cron/backup:
    get:
      tags: [Scheduler]
      summary: Write an encrypted database backup (URL trigger)
      description: |
        The fallback trigger for the nightly backup, for hosting with no CLI
        cron (ADR-0049 decision 5). `backend/bin/backup.php` is the preferred
        one and both call the same service; this is not a second backup path.

        **A second scheduled job is permitted here because it is separately
        observed.** ADR-0038's "one scheduled command" is narrowed by ADR-0049
        to its actual principle: no scheduled path may exist that nothing
        watches.

        **Authorisation** is the drain's secret — one credential, one rotation,
        one thing to paste. Two would mean an installation that rotated one and
        not the other, with the failure showing up as a job that silently
        stopped.

        **Two ways to be unmounted, both `404`:** no `cron.secret`, and no
        `backup.recipient_public_keys`. The second is the on-switch (decision
        2) — configuring a recipient key is what turns backups on — so a club
        that has not configured one has no backup endpoint either. Answering
        `204` while writing nothing would report success to the scheduler every
        night for a club that has never had a backup.

        Heavier than the drain, and treated as such: this **produces and stores
        a database dump**. It answers `204` with an empty body always — it
        triggers, it never serves an archive, not even a count — and refuses to
        run again within an hour of the last *attempt*, so a caller in a loop
        cannot fill the webspace quota with dumps. There is no URL equivalent
        of the CLI's `--force`.
      operationId: writeDatabaseBackup
      security: []
      parameters:
        - name: secret
          in: query
          required: false
          description: |
            Degraded alternative to the `X-Cron-Secret` header, for panels that
            cannot send one — the secret is then written verbatim to the
            webserver's access log.
          schema:
            type: string
      responses:
        '204':
          description: |
            The request was accepted and a run was attempted. Says nothing about
            whether an archive was written — including when the run was skipped
            for the minimum interval, or refused because the configured
            recipient key is malformed. What the run did goes to the journal
            beside the archives and to the application log.
        '401':
          description: Missing or wrong secret
        '404':
          description: |
            No `cron.secret`, or no `backup.recipient_public_keys` — backups are
            not switched on for this installation
    post:
      tags: [Scheduler]
      summary: Write an encrypted database backup (URL trigger)
      description: |
        Identical to `GET /cron/backup`. Both verbs exist because panels differ
        on which they can schedule.
      operationId: writeDatabaseBackupPost
      security: []
      responses:
        '204':
          description: The request was accepted and a run was attempted
        '401':
          description: Missing or wrong secret
        '404':
          description: |
            No `cron.secret`, or no `backup.recipient_public_keys` — backups are
            not switched on for this installation

  # ============================================================================
  # ADMIN USERS
  # ============================================================================
  /admin/admin-users:
    get:
      tags: [Admin Users]
      summary: List admin users
      description: |
        Retrieve all admin users.

        **Use Case**: UC-A61
      operationId: listAdminUsers
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
      responses:
        '200':
          description: List of admin users
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminUser'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Admin Users]
      summary: Create admin user
      description: |
        Create a new admin user. The caller must first re-prove their own
        identity with a step-up credential: their own current password, plus
        their own fresh TOTP code if they have 2FA enabled (#499). This
        step-up is rate-limited on the caller's account (5 attempts / 15 min,
        same dimension as login) and a failed attempt is audited.

        **Use Case**: UC-A62, UC-A68

        **No password is generated.** The account is created with no usable
        password at all, and an invitation link is mailed to `email`. The
        invitee follows it, sets their own password, and then signs in
        normally — which puts them through Authenticator enrolment, because a
        fresh account has no second factor (migration 058).

        The response carries the invitation: when the link expires, and the URL
        itself. The URL is returned so an installation whose mail is not yet
        configured, or whose host drops outbound SMTP, still has something to
        hand over — the situation this endpoint previously solved by returning
        a live password. It is strictly weaker than that password: it expires
        in seven days, works once, and sets a secret the caller never learns.

        `roles` sets the new account's roles (ADR-0044). Omitted, it defaults to
        `admin` — behaviour-preserving, since every admin created before roles
        existed had full access, and the safe direction for a default to fail:
        an account created with no role could open nothing, including the page
        that would fix it.
      operationId: createAdminUser
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserCreateRequest'
      responses:
        '201':
          description: Admin user created and invited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserWithInvitation'
        '401':
          description: |
            Not authenticated, or the caller's step-up credential
            (`current_password` / `totp_code`) is missing or incorrect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_credentials
                message: Re-enter your password to create a new admin user
        '403':
          $ref: '#/components/responses/InsufficientRole'
        '409':
          description: |
            Email already exists, or `roles` mixes `admin` with a lesser role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyAttempts'

  /admin/admin-users/{adminUserId}:
    parameters:
      - name: adminUserId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    patch:
      tags: [Admin Users]
      summary: Update admin user
      description: |
        Edit an admin account, optionally including its roles.

        **Changing the role set requires a step-up credential** — the caller's
        own current password, plus their own fresh TOTP code when they have 2FA
        enabled (ADR-0044 rule 2: granting a role is minting authority, so it
        costs what creating an account costs). The gate is conditional on the
        role set *actually changing*, mirroring `PATCH /auth/profile`'s email
        gate: editing a display name, or re-submitting the roles the account
        already holds, needs no credential.

        `roles` replaces the set outright rather than adding to it, and it is
        validated as a whole: a list naming anything that is not a role, or an
        empty list, is refused rather than partially applied.

        No account can change its own role set, `admin` included — a caller
        submitting `roles` for their own id gets `403 cannot_edit_own_roles`
        rather than a step-up prompt, regardless of what the array contains.
        A role change is always made by a *different* admin acting on the
        account.

        Rate-limited on the caller's account (5 attempts / 15 min, the same
        dimension as login), pinned to the route so a failed step-up counts
        even when the request never reaches the gate.
      operationId: updateAdminUser
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                display_name:
                  type: string
                  maxLength: 100
                locale:
                  type: string
                  description: ISO 639-1 language code
                is_active:
                  type: boolean
                roles:
                  type: array
                  minItems: 1
                  description: |
                    The account's complete role set after this request.
                    Changing it demands the step-up fields below.
                  items:
                    $ref: '#/components/schemas/AdminRole'
                current_password:
                  type: string
                  description: |
                    The **caller's own** password. Required only when `roles`
                    changes the account's role set.
                totp_code:
                  type: string
                  pattern: '^\d{6}$'
                  description: |
                    The caller's own fresh 6-digit code, required alongside
                    `current_password` when the caller has 2FA enabled.
      responses:
        '200':
          description: Admin user updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: |
            Not authenticated, or the step-up credential for a role change is
            missing or incorrect (`invalid_credentials`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |
            Either the caller lacks `admin` (`insufficient_role`), or `roles`
            names the caller's own account (`cannot_edit_own_roles`) — no
            account, `admin` included, can change its own role set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `roles` mixes `admin` with a lesser role, or would revoke `admin`
            from the last account holding it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyAttempts'

  /admin/admin-users/{adminUserId}/reset-password:
    parameters:
      - name: adminUserId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Admin Users]
      summary: Reset admin user password
      description: |
        Generate a new password for an admin user. The caller must first
        re-prove their own identity with a step-up credential: their own
        current password, plus their own fresh TOTP code if they have 2FA
        enabled (#337). This step-up is rate-limited on the caller's account
        (5 attempts / 15 min, same dimension as login) and a failed attempt
        is audited.

        **Use Case**: UC-A63

        The new password is returned once. All sessions for this user are invalidated.
      operationId: resetAdminPassword
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetAdminPasswordRequest'
      responses:
        '200':
          description: Password reset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserWithPassword'
        '401':
          description: |
            Not authenticated, or the caller's step-up credential
            (`current_password` / `totp_code`) is missing or incorrect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_credentials
                message: Re-enter your password to reset this admin's password
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyAttempts'

  /admin/admin-users/{adminUserId}/invitation:
    parameters:
      - name: adminUserId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Admin Users]
      summary: Send a new invitation link
      description: |
        Issue a replacement invitation for an account that has not accepted one
        yet — the first link went to spam, or expired before anyone opened it.
        Any outstanding invitation for the account is revoked by the same call,
        so a resend never leaves two working links.

        The caller must re-prove their own identity with a step-up credential,
        as for the password reset beside it: this mints a way into somebody
        else's account (ADR-0044 rule 2).

        **Use Case**: UC-A68

        Refused for an account that has already accepted an invitation
        (`admin_already_onboarded`) — the invitation is an onboarding
        credential, not a second password-reset channel — and for a deactivated
        account (`admin_account_inactive`).
      operationId: resendAdminInvitation
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetAdminPasswordRequest'
      responses:
        '201':
          description: A new invitation was issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  invitation:
                    $ref: '#/components/schemas/AdminInvitation'
        '401':
          description: |
            Not authenticated, or the caller's step-up credential
            (`current_password` / `totp_code`) is missing or incorrect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/InsufficientRole'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The account has already accepted an invitation, or is deactivated.
