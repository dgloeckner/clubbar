  # /members/{memberId}/assign-card — REMOVED (2026-03-07 audit)
  # /members/{memberId}/remove-card — REMOVED (2026-03-07 audit)
  # Card UID is managed as a field on the member entity via PATCH /members/{memberId}.
  # Dedicated assign/remove endpoints not needed. See use-case-implementation-audit.md.

  /admin/members/{memberId}/transactions:
    parameters:
      - $ref: '#/components/parameters/memberId'

    get:
      tags: [Transactions]
      summary: Get member's transaction history (tab)
      description: |
        Retrieve the transaction history for a specific member.

        **Use Case**: UC-A20
      operationId: getMemberTransactions
      security:
        - sessionAuth: []
      parameters:
        - name: date_from
          in: query
          description: Filter from date (inclusive)
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          description: Filter to date (inclusive)
          schema:
            type: string
            format: date
        - name: type
          in: query
          description: Filter by transaction type
          schema:
            type: string
            enum: [all, purchase, storno, payout]
            default: all
        - name: include_settled
          in: query
          description: Include transactions that have been settled
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Transaction history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberTransactionHistory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    # POST — REMOVED (#169, 2026-08-08)
    # This was `createManualTransaction`: a freely-typed `amount_cents` against a
    # member, aliased at /transactions, /transactions/correction and
    # /transactions/correct. A correction *is* a storno (#158), so the operation
    # is now scoped to the transaction it reverses and carries no amount:
    # POST /admin/transactions/{transactionId}/storno.
    # No manual-purchase endpoint replaces it — UC-A21 was rejected (2026-08-08).
    # No endpoint in this API accepts a caller-supplied money amount.

  /admin/transactions/{transactionId}/storno:
    parameters:
      - name: transactionId
        in: path
        required: true
        description: The transaction being reversed
        schema:
          type: string
          format: uuid

    post:
      tags: [Transactions]
      summary: Storno a transaction
      description: |
        Reverse one specific transaction, in full.

        **Use Case**: UC-A23

        The transaction is the subject of the operation, not a parameter of it.
        **There is no amount parameter**: the amount is derived as the exact
        negation of the referenced transaction and can never be supplied by the
        caller. This is what removes the sign-convention and zero-amount error
        classes entirely.

        The resulting row names what it reverses via `related_transaction_id`
        (GoBD Rz. 64, *"Korrektur- bzw. Stornobuchungen"*), which is never null
        for a storno.

        Rules:
          * A transaction may be stornoed **at most once** — a second attempt is
            a `409`, refused by a unique index rather than only by the service.
          * A storno may **not** itself be stornoed — `422`. Book a new purchase.
          * A **settled** transaction may be stornoed. This puts the member in
            credit, which is legal and expected (ADR-0028 §1).
          * A member with **no valid SEPA mandate** may be stornoed. A storno
            *reduces* what the member owes; gating a debt reduction on the
            ability to collect would be inverted.
      operationId: stornoTransaction
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StornoRequest'
      responses:
        '201':
          description: Storno created, linked to the original transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: This transaction has already been stornoed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: already_stornoed
                message: This transaction has already been stornoed
        '422':
          description: |
            The reason is missing or too long, or the target is itself a storno.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

