  /admin/settlements/settle-filter:
    post:
      tags: [Settlements]
      summary: Create settlement by date filter
      description: |
        Create a settlement for all unsettled transactions matching date filters.

        `execution_date` follows the same rule as `POST /admin/settlements`: at
        least 7 calendar days from the server's today, and a bank business day
        (Mon-Fri, excluding the six TARGET2 closing days). A `settlement_date`
        in the body is ignored (issue #113).
      operationId: createSettlementByFilters
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [execution_date]
              properties:
                execution_date:
                  type: string
                  format: date
                date_from:
                  type: string
                  format: date
                date_to:
                  type: string
                  format: date
                search:
                  type: string
                member_id:
                  type: string
                  format: uuid
                notes:
                  type: string
      responses:
        '201':
          description: Settlement created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: |
            Validation failed — `execution_date` is less than 7 calendar days
            from the server's today, or is not a bank business day.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: validation_failed
                messages:
                  execution_date:
                    - execution_date must be a bank business day (Mon-Fri, excluding TARGET2 closing days)

  # ============================================================================
  # BACKUPS (ADR-0049, #693)
  # ============================================================================
  /admin/backups:
    get:
      summary: What this installation holds locally
      operationId: listBackups
      description: |
        The archives on disk and the keys that open them, read from the
        filesystem and nothing else.

        **This route never touches the storage provider**, and that is the
        contract rather than an implementation detail. Whether an archive is
        also off-site is `GET /admin/backups/remote`'s answer, on a request of
        its own, so the page renders this table immediately and fills that
        column in when it arrives — a throttled tenant costs a club one
        greyed-out column, never the list of what they have.

        ## The key list

        [ADR-0049](../../adr/0049-encrypted-offsite-backups-on-shared-hosting.md)
        hands the private halves to the club, and #703 removed the
        application's key register along with the tracking tables: custody
        lives in the club's own register, on paper, where a restore cannot
        rewrite it.

        What went with those tables was the answer to a question a treasurer
        eventually asks — *"which of these private keys may we finally
        destroy?"* It needs no register: every archive names the keys that open
        it in a header readable **with no key at all**, so aggregating those
        headers gives the label, the fingerprint and the span of archives each
        key still opens.

        Aggregated by **fingerprint**, never by label. A label is what somebody
        typed into `config.php` and can be reused or reassigned; two envelopes
        both marked `vorstand` from different years are two keys, and merging
        them would tell a club it was safe to destroy one.

        This is the checklist to walk the paper register against, never a
        replacement for it: it sees only what is on this host now.

        `admin` only. An archive carries the audit log, every admin's TOTP
        ciphertext and the database password.
      tags:
        - Backups
      security:
        - sessionAuth: []
      responses:
        '200':
          description: The local inventory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupInventory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'

  /admin/backups/remote:
    get:
      summary: Which archives the off-site store holds
      operationId: getBackupRemote
      description: |
        The one question the local directory cannot answer: a local archive and
        an uploaded one are the same bytes in the same folder, because an upload
        is a copy rather than a move.

        **Its own route so the page never waits on it.** This is the only
        backup surface allowed to reach the storage provider — the security
        self-check and the panel's scheduler banner may not, and assert it on
        their constructors, because a tenant outage must not sit between an
        admin and every screen they own. Here the store *is* the subject, and
        the request is separate, so it may ask.

        Bounded when it does: eight seconds and no retries, rather than the
        nightly job's 120 seconds and three retries honouring `Retry-After`.
        A call that does not answer inside that is not an error — it is the
        expected cost of a throttled tenant, and the answer falls back to the
        listing the nightly run recorded.

        `source` is a closed vocabulary and is never collapsed to two values:
        *"the store says this archive is gone"* and *"we could not ask, and
        last night it was there"* lead a club to different actions.
      tags:
        - Backups
      security:
        - sessionAuth: []
      responses:
        '200':
          description: What the store holds, and how that was established
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupRemoteState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'

  /admin/backups/{name}:
    get:
      summary: Download one archive
      operationId: downloadBackup
      description: |
        Streams the sealed container.

        The bytes are sealed to public keys this server does not hold the other
        half of, so this hands over something the server itself cannot read —
        which is why an ordinary authenticated download is the right shape
        rather than a step-up. Opening it needs a private key from the club's
        own custody and `tools/backup-decryptor.html`.

        `Cache-Control: no-store`: sealed or not, it is the club's whole
        database, and no proxy or shared browser cache should keep a copy.

        The name comes from the URL, so it is reduced to its basename and then
        checked against the archive prefix and extension before the filesystem
        is touched. Anything else — a traversal, the journal, the remote
        snapshot, an operator's notes — is `404`.
      tags:
        - Backups
      security:
        - sessionAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: The archive filename, as `GET /admin/backups` lists it.
          example: clubbar-20260825-030000-1a2b3c4d.cbb
      responses:
        '200':
          description: The sealed archive
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientRole'
        '404':
          description: No such archive, or a name this route will not serve

  /admin/security-check:
    get:
      summary: Security self-check
      operationId: getSecurityCheck
      description: |
        Report the hardening this installation actually has, measured now.

        Implements [ADR-0031](../../adr/0031-production-hardening-on-shared-hosting.md)
        decision 3. On mass hosting no configuration layer is guaranteed:
        `.htaccess` may not be honoured, `.user.ini` may not be read, and a host
        can change either under a running installation without telling anyone.
        Every row therefore comes from an observation — `ini_get()`, `stat()`,
        or a live HTTP fetch of a file that must not be served — and a check
        that could not be run is reported as `unknown`, never as a pass.

        Admin-authenticated because the report is a map of this installation's
        weak points, naming the directories that hold the scanned mandates.

        Running it writes a short-lived canary file into the document root's
        storage and log directories and fetches it back, but only when those
        directories are inside the document root.
      tags:
        - Security
      security:
        - sessionAuth: []
      responses:
        '200':
          description: The measured report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityReport'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================================================
  # IBAN ENCRYPTION KEYS (ADR-0036)
  # ============================================================================
  /admin/encryption-keys:
    get:
      summary: List IBAN encryption keys
      operationId: listEncryptionKeys
      description: |
        Every registered keypair with its lifecycle state, remaining days and
        rotation backlog — what the Security & Credentials page shows.

        Plain session auth: the response carries metadata and **public** keys
        only. Warning tiers are computed at request time (ADR-0031: no cron).
      tags:
        - Security
      security:
        - sessionAuth: []
      responses:
        '200':
          description: The registered keys, newest first
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      $ref: '#/components/schemas/EncryptionKey'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      summary: Register an encryption key
      operationId: registerEncryptionKey
      description: |
        Register the **public** half of a keypair generated offline with
        `tools/keypair-generator.html`. The key starts as `pending`; activating
        it is a separate, deliberate step.

        Requires a fresh step-up credential (the caller's own password, plus
        their TOTP code when 2FA is enrolled) on top of the session: what is
        registered here decides what every future IBAN is sealed under.
      tags:
        - Security
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [public_key, key_identifier, current_password]
              properties:
                public_key:
                  type: string
                  description: The 32-byte Curve25519 public key, base64-encoded
                key_identifier:
                  type: string
                  maxLength: 100
                  example: club-key-2027
                current_password:
                  type: string
                  format: password
                totp_code:
                  type: string
                  description: Required when the calling admin has 2FA enrolled
      responses:
        '201':
          description: Key registered in `pending` state
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    $ref: '#/components/schemas/EncryptionKey'
        '401':
          description: Step-up credential missing or wrong
        '422':
          description: |
            Not a 32-byte public key, already registered, or the development
            keypair published in this repository (refused outside development).

  /admin/encryption-keys/{id}/activate:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Activate a pending key
      operationId: activateEncryptionKey
      description: |
        Promote a `pending` key to ACTIVE and start its 365-day cryptoperiod.
        Any previously active key moves to `retiring` — that transition **is**
        the start of a rotation: new IBANs are sealed under the new key
        immediately, while the existing rows still need re-encrypting.

        **The body carries the private half of the key being activated**, as
        proof the club holds it. Registration cannot show that a public key has
        a counterpart at all — 32 bytes out of a mistyped clipboard register
        exactly like a generated key — and activation is the moment that stops
        being harmless, because everything sealed from here needs that private
        half to ever be read again. The proof is a public-key derivation, never
        a trial decryption, and the secret is wiped once compared.

        Requires a fresh step-up credential.
      tags:
        - Security
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/StepUpCredentials'
                - type: object
                  required: [private_key]
                  properties:
                    private_key:
                      type: string
                      description: |
                        The 32-byte private key of the key being activated,
                        base64-encoded. Never persisted server-side.
      responses:
        '200':
          description: The activated key
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    $ref: '#/components/schemas/EncryptionKey'
        '401':
          description: Step-up credential missing or wrong
        '404':
          description: Unknown key
        '409':
          description: The key is not pending; only a pending key can be activated
        '422':
          description: |
            `private_key_mismatch` — the supplied key belongs to a different
            keypair, or is not 32 base64-encoded bytes. The key stays pending
            and seals nothing.

  /admin/encryption-keys/{id}/revoke:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Revoke or mark a key compromised
      operationId: revokeEncryptionKey
      description: |
        Withdraw a key immediately, regardless of remaining lifetime. Pass
        `compromised: true` for the incident path — it records the reason
        permanently, and the rows sealed under it should be re-encrypted onto a
        replacement as soon as practical (stolen ciphertext plus a stolen key
        is not retroactively fixable).

        Requires a fresh step-up credential.
      tags:
        - Security
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/StepUpCredentials'
                - type: object
                  properties:
                    compromised:
                      type: boolean
                      default: false
                      description: True when the private key is known or suspected to have leaked
      responses:
        '200':
          description: The withdrawn key
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    $ref: '#/components/schemas/EncryptionKey'
        '401':
          description: Step-up credential missing or wrong
        '404':
          description: Unknown key

  /admin/encryption-keys/{id}/rotate-batch:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The key being rotated **away from** (retiring, revoked or compromised)
    post:
      summary: Re-encrypt one batch of stored IBANs
      operationId: rotateEncryptionKeyBatch
      description: |
        Re-seal up to 100 mandate rows from this key onto the ACTIVE one. The
        rotation wizard calls it repeatedly until `drained` is true, then calls
        `complete-rotation`.

        **The body carries the private half of the old key** — the only thing
        that can open what is being rotated away from. As with the SEPA export
        it is sent as a JSON field rather than a multipart upload (PHP writes
        multipart parts to temporary files), validated against the registered
        public half, and wiped before the response is written. Between two
        batches the server holds no decryption capability at all.

        Resumable by construction: a batch is selected by "still on the old
        key", never by offset, and each row is committed as it moves. Closing
        the browser mid-rotation loses nothing; the next batch resumes where
        this one stopped.

        Each row moves with an optimistic `WHERE encryption_key_id = :old`, so
        a member edit landing mid-rotation wins — it already sealed the row
        under the active key, and this endpoint counts it as `skipped` rather
        than restoring what it read.

        Requires a fresh step-up credential.
      tags:
        - Security
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/StepUpCredentials'
                - type: object
                  required: [private_key]
                  properties:
                    private_key:
                      type: string
                      description: |
                        The 32-byte private key of the key being rotated away
                        from, base64-encoded. Never persisted server-side.
      responses:
        '200':
          description: What the batch moved
          content:
            application/json:
              schema:
                type: object
                required: [rotation]
                properties:
                  rotation:
                    $ref: '#/components/schemas/KeyRotationBatch'
        '401':
          description: Step-up credential missing or wrong
        '409':
          description: |
            The key is not in a state that can be rotated away from (e.g. it is
            still the ACTIVE one), or no usable ACTIVE key exists to seal onto.
        '422':
          description: |
            `private_key_mismatch` — the supplied key belongs to a different
            keypair, or is not 32 base64-encoded bytes. Nothing was decrypted.

  /admin/encryption-keys/{id}/complete-rotation:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Retire a fully re-encrypted key
      operationId: completeEncryptionKeyRotation
      description: |
        Verify that nothing is sealed under this key any more, then retire it.

        The zero-row check is re-run here rather than trusted from the last
        batch's `remaining`: a row written under the old key in the meantime
        must block the transition instead of being stranded. A `compromised` or
        `revoked` key keeps its status — finishing the clean-up does not
        resolve the incident that caused it.

        No private key: counting rows is not decryption. Requires a fresh
        step-up credential.
      tags:
        - Security
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepUpCredentials'
      responses:
        '200':
          description: The retired key
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    $ref: '#/components/schemas/EncryptionKey'
        '401':
          description: Step-up credential missing or wrong
        '404':
          description: Unknown key
        '409':
          description: Rows are still sealed under this key, or it is not being rotated away from

  /admin/dashboard:
    get:
      summary: Get Dashboard Metrics
      operationId: getDashboardMetrics
      description: |
        Retrieve aggregated dashboard metrics and system overview.
        Combines metrics from members, transactions, terminals, and settlements modules.

        Implements UC-A80: Dashboard

        **Response Data**:
        - metrics: Business metrics (member counts, balance, revenue, terminals)
        - recent_transactions: Last 10 transactions with member and product details
        - terminal_status: All terminals with connectivity information
        - system_status: High-level system indicators
        - alerts: SEPA compliance alerts
        - members_near_limit: Members whose tab has reached the terminal's credit-limit warning band

        **Performance Notes**:
        - Point-in-time snapshot (not real-time streaming)
        - Optimized with database aggregations
        - Typical response time: < 500ms
      tags:
        - Dashboard
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Dashboard metrics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Database error while aggregating metrics

# ==============================================================================
# COMPONENTS
# ==============================================================================
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: PHPSESSID
      description: |
        PHP session cookie (HttpOnly, Secure, SameSite=Lax).

        **Every operation secured this way can answer `403 insufficient_role`**
        (see the `InsufficientRole` response), because authentication and
        authorization are separate questions here: the session says who is
        calling, and the route→roles map of ADR-0044 says whether that caller's
        role reaches this route. The map is default-deny — a route it does not
        name is `admin`-only — so a client cannot infer reachability from the
        absence of an explicit `403` on an operation.

        Roles are additive and a caller may hold several; `GET /auth/profile`
        reports the ones they hold.

  parameters:
    memberId:
      name: memberId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    registrationId:
      name: registrationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    page:
      name: page
      in: query
      description: Page number (1-indexed)
      schema:
        type: integer
        minimum: 1
        default: 1
    perPage:
      name: per_page
      in: query
      description: Items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

  responses:
    Unauthorized:
      description: |
        Not authenticated. `error` distinguishes why:

        - `admin_not_authenticated` — no session, or the account behind it is gone or disabled.
        - `session_expired` — the session passed one of its limits (2h idle, 24h absolute)
          and was destroyed. Signing in again is the only way forward.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unauthorized
            message: Authentication required
    InsufficientRole:
      description: |
        Authenticated, but the caller's role does not reach this route
        (ADR-0044). `error` is `insufficient_role`.

        Distinct from `401` in kind, not degree: signing in again changes
        nothing, and a client must send the user to a "not available for your
        role" screen rather than to the login page. The message never names
        which role would have sufficed — a refusal is not a place to describe
        the shape of what the caller is not trusted with.

        Also the answer for an account holding no role at all, including on
        `/auth/*`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: insufficient_role
            message: This section is not available for your role.
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: Resource not found
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
    TooManyAttempts:
      description: |
        Rate limit reached: 5 failed authentication attempts within 15 minutes,
        counted per source IP and per account. Windowed, never a permanent lock.
      headers:
        Retry-After:
          description: Seconds until the window expires
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: too_many_attempts
            message: Too many failed authentication attempts. Please try again later.
            retry_after_seconds: 900

  schemas:
    # --------------------------------------------------------------------------
    # Common
    # --------------------------------------------------------------------------
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Error code
        message:
          type: string
          description: |
            Human-readable error message — **always English**. It is written
            for the log and for a raw API caller, not for an end user: a
            client that renders it verbatim shows English to an admin whose
            panel is in another language. Use `reason` for that.
        reason:
          type: string
          description: |
            Why a business rule refused, as a stable code the client
            translates (409 responses only). The admin panel renders
            `errors.reasons.<reason>` from its own locale files. Codes are
            part of this contract: one is retired, never renamed.
          example: member_balance_outstanding
        params:
          type: object
          additionalProperties: true
          description: |
            Values the translated sentence interpolates, present when the
            reason needs any. Values, never prose — an amount is integer
            cents under a `*_cents` key so the client formats it in the
            reader's locale, a date is ISO 8601.
          example:
            balance_cents: 750
        details:
          type: object
          additionalProperties: true
          description: Additional error details

    # A named field was examined and rejected (#446). Every `Validator` call
    # site — and everything that used to hand-write its own body — returns
    # exactly this shape, so this schema now describes what the backend
    # actually emits instead of a body it has never sent.
    ValidationErrorResponse:
      type: object
      required: [error, messages]
      properties:
        error:
          type: string
          example: validation_failed
        message:
          type: string
          description: |
            Present when a service raised a typed exception with its own
            message; absent from a plain `Validator` rejection, which reports
            only through `messages`.
          example: Validation failed
        messages:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Field name to the list of validation messages rejecting it.
          example:
            iban: ["Invalid IBAN checksum"]
            first_name: ["Required field"]

    Pagination:
      type: object
      description: |
        The pagination block every list endpoint returns beside its `data`
        array. All four fields are always present.
      required: [page, per_page, total, total_pages]
      properties:
        page:
          type: integer
          description: 1-indexed page the `data` array belongs to.
        per_page:
          type: integer
          description: Rows requested per page (maximum 100).
        total:
          type: integer
          description: Rows matching the filters, across all pages.
        total_pages:
          type: integer
          description: ceil(total / per_page); 0 when nothing matched.

    MultilingualText:
      type: object
      description: Multilingual text (ISO 639-1 keys)
      additionalProperties:
        type: string
      example:
        de: "Bier 0,5L"
        en: "Beer 0.5L"

    # --------------------------------------------------------------------------
    # Authentication
    # --------------------------------------------------------------------------
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      description: |
        The shape returned depends on the authentication branch:
        - TOTP-enrolled admin: only `requiresMfa` is set — call POST /auth/mfa next.
        - First-time admin (no TOTP yet): `requiresTotpSetup`, `admin`, and
          `csrf_token` are set — call POST /auth/2fa/setup next.
      properties:
        requiresMfa:
          type: boolean
          description: True when the admin has TOTP enabled. Call POST /auth/mfa with the code next.
        requiresTotpSetup:
          type: boolean
          description: True on an admin's first login. Call POST /auth/2fa/setup to begin enrollment.
        admin:
          $ref: '#/components/schemas/AdminProfile'
        csrf_token:
          type: string
          description: CSRF token for subsequent state-changing requests (present alongside requiresTotpSetup)

    MfaRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: 6-digit TOTP code
          pattern: '^\d{6}$'

    MfaResponse:
      type: object
      required: [message, admin, csrf_token]
      properties:
        message:
          type: string
        admin:
          $ref: '#/components/schemas/AdminProfile'
        csrf_token:
          type: string
          description: CSRF token for subsequent state-changing requests

    Setup2faResponse:
      type: object
      required: [qrCode, secret]
      properties:
        qrCode:
          type: string
          description: otpauth:// URI to render as a QR code
        secret:
          type: string
          description: Plain-text TOTP secret, shown as a manual-entry fallback

    Confirm2faRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: 6-digit TOTP code from the authenticator app
          pattern: '^\d{6}$'

    Reset2faRequest:
      type: object
      required: [userId, current_password]
      properties:
        userId:
          type: string
          format: uuid
          description: ID of the admin user whose TOTP enrollment should be cleared
        current_password:
          type: string
          format: password
          description: The caller's own current password (step-up re-authentication, #337)
        totp_code:
          type: string
          description: |
            The caller's own fresh 6-digit TOTP code. Required only when the
            caller has 2FA enabled; ignored otherwise.
          pattern: '^\d{6}$'

    StepUpCredentials:
      type: object
      description: |
        A fresh proof of who the caller is, on top of the session — the flat
        admin model's stand-in for a permission system (ADR-0036 deviations
        table). Every operation that changes what IBANs are sealed under, or
        that declares an incident, asks for one.
      required: [current_password]
      properties:
        current_password:
          type: string
          format: password
          description: The caller's own current password
        totp_code:
          type: string
          description: |
            The caller's own fresh 6-digit TOTP code. Required only when the
            caller has 2FA enabled; ignored otherwise.
          pattern: '^\d{6}$'

    ResetAdminPasswordRequest:
      type: object
      required: [current_password]
      properties:
        current_password:
          type: string
          format: password
          description: The caller's own current password (step-up re-authentication, #337)
        totp_code:
          type: string
          description: |
            The caller's own fresh 6-digit TOTP code. Required only when the
            caller has 2FA enabled; ignored otherwise.
          pattern: '^\d{6}$'

    ChangePasswordRequest:
      type: object
      description: |
        Carries a step-up credential: the caller's own password and, when they
        have 2FA enabled, their own fresh TOTP code — the same gate the
        cross-account resets use. A missing or wrong second factor answers 401
        `invalid_credentials`.
      required: [current_password, new_password, new_password_confirmation]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 8
          description: "Min 8 chars, 1 uppercase, 1 lowercase, 1 digit"
        new_password_confirmation:
          type: string
          format: password
        totp_code:
          type: string
          description: |
            The caller's own fresh 6-digit TOTP code. Required when the caller
            has 2FA enabled; ignored otherwise.
          pattern: '^\d{6}$'

    AdminProfile:
      type: object
      required: [id, email, display_name, locale, totp_enabled]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        locale:
          type: string
        last_login_at:
          type: string
          format: date-time
          nullable: true
        totp_enabled:
          type: boolean
          description: Whether TOTP two-factor authentication is enrolled for this admin

    AdminRole:
      type: string
      description: |
        An admin role (ADR-0044). `admin` is a strict superset of the other two;
        `kassenwart` (treasurer — members, settlements, SEPA) and
        `getraenkewart` (bar stock — categories, products) are lesser siblings
        beneath it. Roles compose additively, so one account may hold both
        lesser roles without being `admin`.

        An account's role set is either `admin` alone, or a non-empty
        combination of the two lesser roles — `admin` is never held alongside
        a lesser role. A `roles` array mixing `admin` with another value is
        refused.

        The set is hardcoded: a new role is a schema migration, not
        configuration.
      enum: [admin, kassenwart, getraenkewart]

    GetProfileResponse:
      type: object
      required: [admin]
      properties:
        admin:
          allOf:
            - $ref: '#/components/schemas/AdminProfile'
            - type: object
              required: [roles]
              properties:
                roles:
                  type: array
                  description: |
                    Every role the caller holds, in the order `admin`,
                    `kassenwart`, `getraenkewart`.

                    Returned so the panel can hide the navigation it cannot use
                    and land the caller on a page they can open. It is not a
                    permission: the server refuses independently on every
                    request, and a client that knows its own roles is still a
                    client. An account holding no role reports an empty array —
                    never a default.
                  items:
                    $ref: '#/components/schemas/AdminRole'
                  example: [admin]
        csrf_token:
          type: string
          nullable: true

    UpdateProfileResponse:
      type: object
      required: [message, admin]
      properties:
        message:
          type: string
        admin:
          $ref: '#/components/schemas/AdminProfile'

    UpdateProfileRequest:
      type: object
      description: |
        Changing `email` moves the login identifier, so it requires a step-up
        credential (`current_password`, plus `totp_code` when the caller has 2FA
        enabled) and answers 401 `invalid_credentials` without one.

        The gate is conditional on the address actually changing — compared
        case-insensitively, since `admin_users.email` is UNIQUE under a `_ci`
        collation. Updating only `display_name` or `locale`, or re-submitting
        the address the account already has, needs no credential.
      properties:
        email:
          type: string
          format: email
        display_name:
          type: string
        locale:
          type: string
          enum: [de, en]
        current_password:
          type: string
          format: password
          description: Required only when `email` differs from the current address.
        totp_code:
          type: string
          description: |
            The caller's own fresh 6-digit TOTP code. Required alongside
            `current_password` when the caller has 2FA enabled.
          pattern: '^\d{6}$'

    # --------------------------------------------------------------------------
    # Members
    # --------------------------------------------------------------------------
    MemberListItem:
      type: object
      description: >-
        The roster row. Deliberately narrower than `Member`: `date_of_birth` in
        particular is **not** here ([ADR-0045](../../adr/0045-age-restricted-products.md)) —
        a list an admin scrolls needs names, balances and SEPA state, and the
        two consumers that need a birth date read one member at a time.
        `has_date_of_birth` carries the *flag* instead (#629), so the members a
        terminal will refuse every age-restricted product to can be found from
        the roster without putting a birth date on every row.
      properties:
        id:
          type: string
          format: uuid
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
          description: >-
            Null only for a legacy member created before email became
            required (#362) — the list surfaces this via `has_email` so a
            Kassenwart can find and backfill them.
        balance_cents:
          type: integer
          description: |
            The member's Deckel: the sum of their transactions that no
            settlement has collected yet, in cents. Positive means they owe
            the club; negative is a credit, which a payout leaves behind.
        card_uid:
          type: string
          nullable: true
        iban_masked:
          type: string
          nullable: true
          description: Masked IBAN (e.g., DE89****3000)
        is_active:
          type: boolean
        is_sepa_valid:
          type: boolean
          description: Whether member has valid IBAN and mandate_reference
        has_date_of_birth:
          type: boolean
          description: >-
            Whether a birth date is on file — never the date itself
            (ADR-0045). False means the terminal refuses this member every
            age-restricted product, which is the one data gap with a legal
            edge and, until #629, the one invisible from the roster.
        created_at:
          type: string
          format: date-time

    MemberDataCompleteness:
      type: object
      description: >-
        How many **active** members are missing each piece of mandatory data
        (#629). Inactive members are excluded: they cannot book and are not
        collected from, so their gaps are not work anyone needs to do, and a
        headline that can never reach zero stops being read. Anonymized members
        carry `deleted_at` and are excluded with the rest of the roster.


        Every count has a filter behind it on `GET /members` that returns
        exactly the members it counted — pair each with `status=active`.
      properties:
        total:
          type: integer
          description: Active members on the roster.
        without_card_uid:
          type: integer
          description: Cannot book at the terminal. Filter -`has_card_uid=without`.
        without_email:
          type: integer
          description: >-
            Reached by no announcement and no Deckelauszug.
            Filter -`has_email=without`.
        without_date_of_birth:
          type: integer
          description: >-
            Refused every age-restricted product (ADR-0045).
            Filter -`has_date_of_birth=without`.
        without_mandate:
          type: integer
          description: >-
            Deckel cannot be collected (ADR-0020).
            Filter -`sepa_status=invalid`.
        incomplete:
          type: integer
          description: >-
            Missing at least one of the four. Not the sum of them — one member
            can be missing several. Filter -`data_status=incomplete`.

    SettlementReversal:
      type: object
      description: |
        One member's collection undone after the money moved (ruling #148).
        Append-only: there is no update and no delete, because the derived
        settlement status is computed from these rows.
      properties:
        id:
          type: string
          format: uuid
        settlement_id:
          type: string
          format: uuid
        member_id:
          type: string
          format: uuid
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        reason:
          type: string
          enum: [bank_return, club_error]
          description: |
            `bank_return` places the member on collection hold; `club_error`
            does not, because re-collection is the point of recording one.

            There is deliberately no finer classification of *why* the bank
            returned it: in Germany AM04, AC04, MD07 and RR01-04 are
            suppressed for data-protection reasons and collapse into
            "sonstige Gründe".
        reason_label:
          type: string
        amount_cents:
          type: integer
          description: |
            The sum of that member's items in the settlement. Derived, never
            supplied by the caller.
        amount_eur:
          type: number
          format: float
        bank_reference:
          type: string
          maxLength: 35
          nullable: true
          description: |
            The reference on the return booking, capped at the ISO 20022
            length. The original Verwendungszweck never comes back — DK
            replaces `SVWZ` with the constant RETURN/REFUND — so this is the
            only thread back to the return.
        notes:
          type: string
          maxLength: 1000
          nullable: true
        created_by_admin_id:
          type: string
          format: uuid
          nullable: true
        created_by_admin_name:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    ReversalCandidate:
      type: object
      description: |
        One collection a bank reference resolved to (epic #433, ADR-0032 §8).

        Carries the four facts that let a treasurer match the row against the
        line on their statement — member, amount, execution date and where the
        run stands — plus whether the reversal they came to record is actually
        available. Nothing is re-derived: `status`, `is_reversible` and
        `reversal_blocked_reason` are the settlement's own answers.
      properties:
        settlement_id:
          type: string
          format: uuid
        member_id:
          type: string
          format: uuid
        member_name:
          type: string
          nullable: true
        amount_cents:
          type: integer
          description: |
            This member's total in this run — what a reversal would free. There
            is no partial-amount reversal: a member comes back whole or not at
            all.
        amount_eur:
          type: number
          format: float
        end_to_end_id:
          type: string
          nullable: true
          description: |
            The identifier the SEPA file carried for this collection, echoed
            back by the bank as `EREF+`. Null for a run exported before
            identifiers were persisted (#150) — such a run is reachable only by
            mandate reference.
        mandate_reference:
          type: string
          nullable: true
        execution_date:
          type: string
          format: date
        settlement_date:
          type: string
          format: date
        status:
          type: string
          enum: [draft, exported, submitted, partly_reversed, fully_reversed, cancelled]
        status_label:
          type: string
        is_reversible:
          type: boolean
        reversal_blocked_reason:
          type: string
          nullable: true
          description: |
            The gate's own words when the settlement cannot be reversed — shown
            verbatim rather than re-derived client-side.
        reversal_blocked_code:
          type: string
          nullable: true
          description: |
            The same refusal as a stable code the client translates — the
            admin panel renders `errors.reasons.<code>` in the admin's own
            language rather than showing the English sentence above.
        reversal_blocked_params:
          type: object
          nullable: true
          additionalProperties: true
          description: |
            Values the translated sentence interpolates (an amount in cents, a
            date, a count). Never prose: the wording lives in the client's
            locale files.
        already_reversed:
          type: boolean
          description: A reversal for this member on this settlement already exists.
        reversed_at:
          type: string
          format: date-time
          nullable: true
        reversed_by_admin_name:
          type: string
          nullable: true
        reversed_reason:
          type: string
          enum: [bank_return, club_error]
          nullable: true
        is_actionable:
          type: boolean
          description: |
            `is_reversible && !already_reversed` — whether recording a reversal
            against this collection would be accepted.

    CollectionHold:
      type: object
      description: |
        A member the next collection run must leave alone after a returned
        direct debit (ruling #148 §3). Without the hold, the next run sweeps
        the member's whole unsettled position — including what just bounced —
        and earns a second return fee.
      properties:
        member_id:
          type: string
          format: uuid
        first_name:
          type: string
        last_name:
          type: string
        collection_hold_reason:
          type: string
          nullable: true
          description: |
            Why the member is held. Retained after the hold is cleared, so the
            question "why was this member skipped in March?" stays answerable.
        held_at:
          type: string
          format: date-time
          nullable: true
        held_by_admin_id:
          type: string
          format: uuid
          nullable: true
        held_by_admin_name:
          type: string
          nullable: true
        balance_cents:
          type: integer
          description: What the member currently owes, held back from collection.

    MandateMissing:
      type: object
      description: |
        A member with an open position the next run cannot collect, because no
        active SEPA mandate is on file (#258).

        There is deliberately no "which half is missing" field, unlike the
        settlement preview's ineligible bucket: since #164 the IBAN and the
        reference live on the same mandate row and arrive together, so a member
        has both or neither.
      properties:
        member_id:
          type: string
          format: uuid
        first_name:
          type: string
        last_name:
          type: string
        balance_cents:
          type: integer
          description: What the member owes and no run can currently collect. Never negative — a negative position is credit, and credit wins.
          example: 1250

    CreditBalance:
      type: object
      properties:
        member_id:
          type: string
          format: uuid
        first_name:
          type: string
        last_name:
          type: string
        balance_cents:
          type: integer
          description: Total unsettled position, negative because the club owes this member money
          example: -1500

    BankLookupResponse:
      type: object
      properties:
        bank_code:
          type: string
          description: 8-digit Bankleitzahl (BLZ) that was looked up
        bank_name:
          type: string
          nullable: true
          description: Full bank name from Bundesbank BLZ file
        short_name:
          type: string
          nullable: true
          description: Short bank designation
        bic:
          type: string
          nullable: true
          description: SWIFT/BIC code
        postal_code:
          type: string
          nullable: true
          description: Postal code of bank headquarters
        city:
          type: string
          nullable: true
          description: City of bank headquarters

    Member:
      type: object
      properties:
        id:
          type: string
          format: uuid
        first_name:
          type: string
          nullable: true
          maxLength: 100
        last_name:
          type: string
          nullable: true
          maxLength: 100
        email:
          type: string
          format: email
          nullable: true
        card_uid:
          type: string
          nullable: true
        preferred_language:
          type: string
          description: ISO 639-1 language code
        iban_last4:
          type: string
          nullable: true
          minLength: 4
          maxLength: 4
          description: |
            The last four characters of the IBAN. The stored IBAN is sealed
            under the club's public key ([ADR-0036](../../adr/0036-iban-encryption-sealed-box.md))
            and the server holds no private key, so no admin endpoint can
            return the full value — enough to recognize the account, useless
            to debit it. The plaintext is reachable only through the SEPA
            export, which takes the private key for the length of one request.
          example: '3000'
        iban_masked:
          type: string
          nullable: true
          description: '`iban_last4` in the established display shape, e.g. ****3000'
        credit_limit_cents:
          type: integer
          nullable: true
          minimum: 0
          maximum: 10000000
          description: >-
            This member's own Deckel ceiling in cents
            ([ADR-0047](../../adr/0047-configurable-credit-limits.md)). `null`
            means they follow the club default and move with it; `0` means a
            deliberate "no ceiling for this member". The two are different
            answers, not synonyms.
        account_holder_name:
          type: string
          nullable: true
          maxLength: 70
          description: Account holder name if different from member. Used in SEPA XML.
        date_of_birth:
          type: string
          format: date
          nullable: true
          description: |
            The member's date of birth, used by the terminal to enforce a
            product's minimum age offline
            ([ADR-0045](../../adr/0045-age-restricted-products.md)). The raw
            date is what the terminal syncs — not an age in years, which is
            wrong from the member's next birthday until the next sync.

            `null` means the member has been **anonymized**, never "unknown".
            The field is required on create and cannot be cleared through an
            update; erasure nulls it through the anonymize endpoint.
          example: '1985-06-15'
        mandate_reference:
          type: string
          nullable: true
          maxLength: 35
        mandate_signed_at:
          type: string
          format: date
          nullable: true
        bank_name:
          type: string
          nullable: true
          description: Bank name resolved from IBAN via Bundesbank BLZ lookup (German IBANs only)
        is_active:
          type: boolean
        is_sepa_valid:
          type: boolean
        balance_cents:
          type: integer
          description: |
            The member's Deckel: the sum of their transactions that no
            settlement has collected yet, in cents. Positive means they owe
            the club; negative is a credit, which a payout leaves behind.
        deleted_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MemberCreateRequest:
      type: object
      description: >-
        An optional field left empty may be sent as `""` as well as omitted or
        `null`: a form has no way to send "absent", so a blank string is read as
        no value for `phone`, `card_uid`, `iban`, `account_holder_name` and
        `mandate_signed_at`. `mandate_reference` is the exception — a blank one
        says the member has no mandate, while an omitted one is minted from the
        member id (ADR-0006).
      # SEPA details are not required to register a member: the list has a
      # "SEPA: Missing" filter and badge precisely because a member without
      # bank details is a supported state, and the backend has always accepted
      # `iban` and `mandate_signed_at` as nullable. The spec said otherwise,
      # which made the admin form refuse to save such a member at all (#131).
      required: [first_name, last_name, email, date_of_birth, preferred_language]
      properties:
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 255
          description: >-
            Required — the pre-notification and settlement statement emails
            are a contractual promise (Nutzungsordnung § 7), so a member
            cannot be onboarded without one (#362).
        phone:
          type: string
          maxLength: 20
        preferred_language:
          type: string
          description: ISO 639-1 language code
          example: de
        iban:
          type: string
          description: ISO 13616 IBAN
          minLength: 15
          maxLength: 34
        account_holder_name:
          type: string
          maxLength: 70
          description: Account holder name if different from member (for divergent payer)
        credit_limit_cents:
          type: integer
          nullable: true
          minimum: 0
          maximum: 10000000
          description: >-
            Optional, and **never required**: omitting it is the ordinary case
            and means this member follows the club default
            ([ADR-0047](../../adr/0047-configurable-credit-limits.md)). `0`
            means no ceiling for them. A negative value is refused rather than
            read as unlimited.
        date_of_birth:
          type: string
          format: date
          description: >-
            Required. Not in the future. Used by the terminal to enforce a
            product's minimum age offline
            ([ADR-0045](../../adr/0045-age-restricted-products.md)). Unlike the
            other optional fields, a blank string is **not** read as "no
            value" here — it is rejected, because a null birth date means an
            anonymized member.
          example: '1985-06-15'
        mandate_signed_at:
          type: string
          format: date
          description: Mandate signature date (not in future)
        mandate_reference:
          type: string
          maxLength: 35
          description: Optional; defaults to UUID without hyphens
        card_uid:
          type: string
          pattern: '^[0-9A-F]{8,20}$'
          description: Optional RFID card UID

    MemberUpdateRequest:
      type: object
      description: >-
        Only the fields the request carries are changed. A field being cleared
        may be sent as `""` as well as `null` — a blank string is read as no
        value for `phone`, `card_uid`, `account_holder_name`, `email` and
        `mandate_signed_at`, so a form that empties an input clears the field
        rather than storing the empty string. `email` is the exception that
        does not always clear: see the field for when it is rejected instead.

        `iban` is the exception, because it is the one field the form cannot
        prefill: it is sealed at rest and never returned, so it arrives blank
        on every save that did not deliberately retype it. A blank `iban`
        therefore keeps the stored account, and only an explicit `null` removes
        it. See the field for the three cases.
      properties:
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 255
          nullable: true
          description: >-
            `null` or `""` is only accepted while the update also sets (or
            finds) the member inactive — an active member's email cannot be
            cleared (#362); the DB column stays nullable for GDPR erasure,
            which anonymizes through a separate endpoint.
        phone:
          type: string
          maxLength: 20
          nullable: true
        credit_limit_cents:
          type: integer
          nullable: true
          minimum: 0
          maximum: 10000000
          description: >-
            Three request shapes, three meanings
            ([ADR-0047](../../adr/0047-configurable-credit-limits.md)):
            **omitting** the field leaves the override exactly as it is;
            `null` or `""` clears it, so the member goes back to the club
            default; `0` stores a deliberate "no ceiling for this member".

            `0` is **not** a way to clear the field. A form that serialises an
            emptied input to `0` grants that member unlimited credit — send
            `null` or `""` for a cleared input.
        date_of_birth:
          type: string
          format: date
          description: >-
            May be **corrected** but not cleared: neither `""` nor `null` is
            accepted, because a null birth date means an anonymized member
            ([ADR-0045](../../adr/0045-age-restricted-products.md) rule 3) and
            erasure is the anonymize endpoint's alone.
          example: '1985-06-15'
        preferred_language:
          type: string
        iban:
          type: string
          minLength: 15
          maxLength: 34
          nullable: true
          description: |
            Overwrite-only. The stored IBAN is sealed and never returned
            ([ADR-0036](../../adr/0036-iban-encryption-sealed-box.md)), so the
            edit form cannot prefill this field:

            - **omitted or `""`** — keep the stored account. This is what a save
              that did not deliberately retype the IBAN sends.
            - **a full IBAN** — replace the account. The current mandate is
              ended and a new one opened, so a collection made under the old
              account still resolves to the mandate it was made under.
            - **`null`** — remove the stored bank details and revoke the mandate.
        account_holder_name:
          type: string
          maxLength: 70
          nullable: true
        mandate_reference:
          type: string
          maxLength: 35
        mandate_signed_at:
          type: string
          format: date
          nullable: true
          description: null to remove the recorded mandate date
        is_active:
          type: boolean
        card_uid:
          type: string
          pattern: '^[0-9A-F]{8,20}$'
          nullable: true
          description: RFID card UID (null to remove)

    MemberImportPreview:
      type: object
      properties:
        import_id:
          type: string
          description: ID to use for confirmation
        preview:
          type: array
          items:
            type: object
            properties:
              row:
                type: integer
              status:
                type: string
                enum: [valid, error]
              data:
                type: object
              errors:
                type: array
                items:
                  type: string
        summary:
          type: object
          properties:
            total_rows:
              type: integer
            valid:
              type: integer
            invalid:
              type: integer

    # --------------------------------------------------------------------------
    # Transactions
    # --------------------------------------------------------------------------
    Transaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        member_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
          nullable: true
        amount_cents:
          type: integer
        transaction_type:
          type: string
          enum: [purchase, storno, payout]
        notes:
          type: string
          nullable: true
        related_transaction_id:
          type: string
          format: uuid
          nullable: true
          description: |
            For a `storno`, the transaction it reverses — never null. Null for
            every other type (GoBD Rz. 64, ADR-0028 §4).
        stornoed_by_transaction_id:
          type: string
          format: uuid
          nullable: true
          description: |
            The storno that reverses this transaction, if it has one. The
            reverse of `related_transaction_id`, so the journal can show the
            linkage from either row and refuse a second storno before the
            request is made. Unique — a transaction is stornoable at most once.
        settlement_id:
          type: string
          format: uuid
          nullable: true
        created_by_terminal_id:
          type: string
          format: uuid
          nullable: true
        created_by_admin_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time

    MemberTransactionHistory:
      type: object
      properties:
        member_id:
          type: string
          format: uuid
        current_balance_cents:
          type: integer
          description: |
            The member's **unsettled** position — what they still owe (positive)
            or the credit the club owes them (negative), per ruling
            [#141](https://github.com/dgloeckner/clubbar/issues/141).
            The `transactions` list below is the full history and still contains
            transactions this figure excludes because a settlement claimed them.
        transactions:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              date:
                type: string
                format: date-time
              type:
                type: string
                enum: [purchase, storno, payout]
              description:
                type: string
              amount_cents:
                type: integer
              running_total_cents:
                type: integer
              settlement_id:
                type: string
                format: uuid
                nullable: true
        settlements:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              date:
                type: string
                format: date
              amount_cents:
                type: integer
              type:
                type: string
                enum: [sepa, manual]

    # ManualTransactionRequest — REMOVED (#169, 2026-08-08).
    # It carried a caller-supplied `amount_cents`. Replaced by StornoRequest,
    # which carries a reason and nothing else.

    StornoRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: |
            Why the booking is being reversed. Required, and recorded both on
            the storno row and in the audit log.

            This is the **only** field. The amount is derived as the exact
            negation of the transaction named in the path; the member is read
            from it too. Neither is accepted from the caller.

