                type: string
                nullable: true
              amount_cents:
                type: integer
              notes:
                type: string
                nullable: true
        settlements:
          type: array
          items:
            type: object
            properties:
              period_start:
                type: string
                format: date
              period_end:
                type: string
                format: date
              amount_cents:
                type: integer
              execution_date:
                type: string
                format: date
