  /admin/blocked-cards:
    get:
      tags: [RFID Cards]
      summary: List blocked cards
      description: |
        Retrieve blocked RFID cards.

        **Use Case**: UC-A71
      operationId: listBlockedCards
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Blocked cards
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BlockedCard'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [RFID Cards]
      summary: Block a card
      description: |
        Add a card to the blocklist.

        **Use Case**: UC-A71

        If the card is assigned to a member, the assignment is removed.
      operationId: blockCard
      security:
        - sessionAuth: []
      requestBody:
