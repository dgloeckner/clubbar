              type: object
              required: [format]
              properties:
                format:
                  type: string
                  enum: [json, pdf]
                  description: Export format
                export_type:
                  type: string
                  enum: [gdpr_access, gdpr_portability]
                  default: gdpr_access
                  description: Type of GDPR export
      responses:
        '200':
          description: Export file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GdprExport'
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Member is anonymized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/members/{memberId}/anonymize:
    parameters:
      - $ref: '#/components/parameters/memberId'
    post:
      tags: [Members]
      summary: Anonymize member (GDPR erasure)
      description: |
        Anonymize a member's personal data per GDPR Art. 17 (Right to Erasure).

        **Use Case**: UC-DSGVO-02

        **Preconditions**:
        - Member balance must be €0.00
        - Member must not be included in any pending settlement

        **Anonymization transforms**:
        - `first_name`, `last_name`, `email` → NULL
        - `iban`, `mandate_reference` → NULL
        - `card_uid` → "ANONYMOUS-{uuid}"
        - `is_active` → false
        - `deleted_at` → current timestamp

        **Retention**: Transaction history is retained (linked to anonymous member).
      operationId: anonymizeMember
      security:
        - sessionAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Optional reason for audit trail
                  maxLength: 500
      responses:
        '200':
          description: Member anonymized
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  member_id:
                    type: string
                    format: uuid
                  anonymized_at:
                    type: string
                    format: date-time
        '400':
          description: Cannot anonymize (balance > 0 or pending settlement)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: cannot_anonymize
                message: Member has outstanding balance
                details:
                  balance_cents: 1250
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Member already anonymized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/members/import:
    post:
      tags: [Members]
      summary: Import members from CSV
      description: |
        Import members from a CSV file.

        **Use Case**: UC-A16
        **Status**: Not implemented — nice to have (2026-03-07 audit)

        **CSV columns** (required): first_name, last_name, email, date_of_birth
        **CSV columns** (optional): iban, mandate_signed_at, preferred_language, phone

        The required set tracks `MemberCreateRequest`, which this endpoint would
        have to satisfy row by row. Two corrections since it was written: `email`
        became required (#362) and `date_of_birth` became required
        ([ADR-0045](../../adr/0045-age-restricted-products.md)), while `iban` and
        `mandate_signed_at` never were — a member with no bank details yet is a
        state the panel already shows as "SEPA: Missing" (#131).

        A CSV without a date of birth column therefore cannot import anybody, and
        that is the intended behaviour: there is no "unknown age" member for the
