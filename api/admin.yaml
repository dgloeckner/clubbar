  # ============================================================================
  # SETTLEMENTS
  # ============================================================================
  /admin/settlements:
    get:
      tags: [Settlements]
      summary: List settlements
      description: |
        Retrieve settlement history.

        **Use Case**: UC-A33
      operationId: listSettlements
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
        - name: type
          in: query
          description: Filter by settlement type
          schema:
            type: string
            enum: [all, sepa, manual]
            default: all
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [created_at_desc, created_at_asc, execution_date]
            default: created_at_desc
      responses:
        '200':
          description: List of settlements
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SettlementListItem'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Settlements]
      summary: Create settlement
      description: |
        Create a new settlement.

        **Use Cases**: UC-A30 (SEPA), UC-A35 (manual), UC-SEPA-05

        **SEPA settlements**:
        - Require `execution_date` (minimum TODAY + 7 calendar days)
        - All members with valid SEPA data are included in XML export

        **Manual settlements**:
        - Require `manual_reason` and `notes` (min 10 chars)
        - No SEPA XML export available
      operationId: createSettlement
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettlementCreateRequest'
      responses:
        '201':
          description: Settlement created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '412':
          description: SEPA configuration incomplete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: sepa_config_incomplete
                message: SEPA configuration is incomplete

  /admin/settlements/preview:
    get:
      tags: [Settlements]
      summary: Preview unsettled transactions
      description: |
        Get a preview of transactions available for settlement.

        **Use Cases**: UC-A30, UC-SEPA-06
      operationId: previewSettlement
      security:
        - sessionAuth: []
      parameters:
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
        - name: member_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Settlement preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementPreview'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/settlements/{settlementId}:
    parameters:
      - name: settlementId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Settlements]
      summary: Get settlement details
      description: |
        Retrieve detailed information about a settlement.

        **Use Cases**: UC-A34, UC-SEPA-06
