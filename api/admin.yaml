  /admin/members/completeness:
    get:
      tags: [Members]
      summary: Count the active members missing each piece of mandatory data
      description: |
        The Datenqualität panel's figures (#629). The roster could always
        *filter* for a gap; nothing said how many there were or what each gap
        costs, so four capable filter pills answered a question nobody knew to
        ask.

        Counts, not members — each has a filter behind it on `GET /members`
        that returns exactly the members counted. One request rather than four
        `per_page=1` probes, so every figure comes from the same snapshot and
        the numbers cannot disagree with each other.

        Active members only, and anonymized members are excluded with the rest
        of the roster; see `MemberDataCompleteness`.
      operationId: getMemberDataCompleteness
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Gap counts across the active roster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberDataCompleteness'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/members/mandate-missing:
    get:
      tags: [Members]
      summary: List members with an open position and no usable mandate
      description: |
        Standing listing of the members the next collection run cannot reach
        at all, because either the IBAN or the SEPA mandate reference is
        missing (#258). Most owed first; soft-deleted members are excluded.

        The third standing exclusion, and the one that was least visible: a
        member in credit or on hold is at least an account somebody is
        transacting with, while a member with no mandate can never be
        collected from.

        Scoped to **participants** — members with an open unsettled position.
        That matches the `ineligible_members` bucket of the settlement
        preview, which answers the same question about a run rather than about
        the roster.

        The three standing exclusions are mutually exclusive and repeat the
        precedence the preview applies (ruling #148 §4): credit wins over a
        hold, and a hold wins over a missing mandate, so a member appears in
        exactly one listing and gets exactly one remedy.
      operationId: listMembersWithoutMandate
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Members who cannot be collected from
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MandateMissing'
                  total_uncollectable_cents:
                    type: integer
                    description: |
                      Sum of what these members owe — money the club is owed
                      and currently cannot collect. A different figure from the
                      credit total (owed out) and the held total (owed in,
                      temporarily skipped).
                    example: 4250
        '401':
          $ref: '#/components/responses/Unauthorized'

