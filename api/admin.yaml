              type: string
            last_name:
              type: string
            email:
              type: string
              nullable: true
            card_uid:
              type: string
              nullable: true
            preferred_language:
              type: string
            iban:
              type: string
              description: Full IBAN (unmasked)
            mandate_reference:
              type: string
            member_since:
              type: string
              format: date
            is_active:
              type: boolean
        transactions:
          type: array
          items:
            type: object
            properties:
