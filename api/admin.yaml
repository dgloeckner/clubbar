      summary: Export member data (GDPR)
      description: |
        Generate a GDPR data export for a member.

        **Use Cases**: UC-DSGVO-01 (right to access), UC-DSGVO-04 (right to portability)

        **Export types**:
        - `gdpr_access`: Full data export including system-generated data (Art. 15)
        - `gdpr_portability`: Only data provided by the member (Art. 20)

        **Formats**:
