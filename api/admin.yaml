        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # /settlements/{settlementId}/finalize — REMOVED (2026-03-07 audit)
  # Settlements are created in final state (one-step with preview).
  # execution_date is validated at creation time. See use-case-implementation-audit.md.

  /admin/settlements/{settlementId}/cancel:
    parameters:
      - name: settlementId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Settlements]
      summary: Cancel settlement
      description: |
        Cancel a settlement, releasing its transactions for future settlements.

        Transactions linked to this settlement will have their settlement_id cleared
        and become available for new settlements.

        **Note**: Uses DELETE method (updated 2026-03-07 audit to match implementation).
      operationId: cancelSettlement
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Settlement cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Settlement already cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/settlements/{settlementId}/export/sepa-xml:
    parameters:
      - name: settlementId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Settlements]
      summary: Download SEPA XML
      description: |
        Download the settlement as a SEPA Direct Debit XML file (pain.008.001.02).

        **Use Cases**: UC-A31, UC-SEPA-08

        **Requirements**:
        - Settlement type must be "sepa"
        - At least one member must have valid SEPA data

        **XML format**: pain.008.001.02 (SEPA Core Direct Debit)
        - Sequence type: Always RCUR
        - Minimal debtor data (name, IBAN only)

        See [ADR-0008](../../adr/0008-sepa-xml-export-format-selection.md) for details.
      operationId: downloadSepaXml
      security:
        - sessionAuth: []
      responses:
        '200':
          description: SEPA XML file
          content:
            application/xml:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              schema:
                type: string
                example: 'attachment; filename="sepa-SET-2025-001-20250123.xml"'
        '400':
          description: No eligible members for SEPA export
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          description: Settlement not of SEPA type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/settlements/{settlementId}/export/csv:
    parameters:
      - name: settlementId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Settlements]
      summary: Download settlement CSV
      description: |
        Download the settlement as a CSV file.

        **Use Cases**: UC-A32, UC-SEPA-09

        **CSV format**:
        - Encoding: UTF-8 with BOM
        - Delimiter: Semicolon (;)
        - Columns: Name, IBAN, Betrag, Verwendungszweck, Mandatsreferenz, Sequenztyp
      operationId: downloadSettlementCsv
      security:
        - sessionAuth: []
      responses:
        '200':
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              schema:
                type: string
                example: 'attachment; filename="abrechnung-SET-2025-001-20250123.csv"'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          description: Settlement cancelled or invalid for export
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

