        id:
          type: integer
        admin_user_id:
          type: string
          format: uuid
          nullable: true
        admin_user_email:
          type: string
          nullable: true
        action:
          type: string
          enum: [create, update, delete, activate, deactivate, anonymize, login, logout, login_failed, export, transaction_storno, transaction_price_divergence, settlement_create, settlement_cancel, settlement_export, settlement_submit, settlement_reverse, collection_hold_placed, collection_hold_cleared, totp_enrolled, totp_reset, mandate_document_upload, mandate_document_delete]
        entity_type:
