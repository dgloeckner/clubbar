    # --------------------------------------------------------------------------
    # Settlements
    # --------------------------------------------------------------------------
    SettlementListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        method:
          type: string
          enum: [direct_debit, bank_transfer, write_off]
          description: |
            How this settlement's balance is collected. Replaces the old
            `settlement_type`/`manual_reason` pair (ruling #163). Only
            `direct_debit` settlements can be exported to SEPA.
        settlement_date:
          type: string
          format: date
          description: |
            The day the server created this settlement. Recorded, never
            supplied — it is not a request field (issue #113).
        execution_date:
          type: string
          format: date
          nullable: true
        member_count:
          type: integer
        total_amount_cents:
          type: integer
        is_cancelled:
          type: boolean
        exported_at:
          type: string
          format: date-time
          nullable: true
        submitted_at:
          type: string
          format: date-time
          nullable: true
        submitted_by_admin_id:
          type: string
          format: uuid
          nullable: true
        is_cancellable:
          type: boolean
          description: Whether a cancel request would currently be accepted.
        cancellation_blocked_reason:
          type: string
          nullable: true
          description: |
            Human-readable reason cancellation is unavailable. Null when
            `is_cancellable` is true.
        status:
          type: string
          enum: [cancelled, fully_reversed, partly_reversed, submitted, exported, draft]
          description: |
            Where the settlement stands, derived on every read from
            `is_cancelled`, the reversal rows, `submitted_at` and
            `exported_at` (ruling #148 §6). There is no status column, so
            nothing can drift out of step with it.
        status_label:
          type: string
          description: Human-readable form of `status`.
        is_reversible:
          type: boolean
          description: |
            Whether a reverse request would currently be accepted — the exact
            mirror of `is_cancellable`. A settlement is one or the other,
            never both; a cancelled one is neither.
        reversal_blocked_reason:
          type: string
          nullable: true
          description: |
            Human-readable reason reversal is unavailable. Null when
            `is_reversible` is true.
        reversed_member_count:
          type: integer
          description: How many of this settlement's members carry a reversal.
        reversals:
          type: array
          description: |
            The reversal events, present on the single-settlement read. The
            list endpoint does not join them and returns an empty array.
          items:
            $ref: '#/components/schemas/SettlementReversal'
        created_at:
          type: string
          format: date-time

    Settlement:
      type: object
      properties:
        id:
          type: string
          format: uuid
        method:
          type: string
          enum: [direct_debit, bank_transfer, write_off]
          description: |
            How this settlement's balance is collected. Replaces the old
            `settlement_type`/`manual_reason` pair (ruling #163). Only
            `direct_debit` settlements can be exported to SEPA.
        settlement_date:
          type: string
          format: date
          description: |
            The day the server created this settlement. Recorded, never
            supplied — it is not a request field (issue #113).
        execution_date:
          type: string
          format: date
          nullable: true
        period_start:
          type: string
          format: date
          nullable: true
        period_end:
          type: string
          format: date
          nullable: true
        sepa_message_id:
          type: string
          nullable: true
        total_amount_cents:
          type: integer
        member_count:
          type: integer
        is_cancelled:
          type: boolean
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        exported_at:
          type: string
          format: date-time
          nullable: true
        submitted_at:
          type: string
          format: date-time
          nullable: true
        submitted_by_admin_id:
          type: string
          format: uuid
          nullable: true
        is_cancellable:
          type: boolean
          description: Whether a cancel request would currently be accepted.
        cancellation_blocked_reason:
          type: string
          nullable: true
          description: |
            Human-readable reason cancellation is unavailable. Null when
            `is_cancellable` is true.
        notes:
          type: string
          nullable: true
        status:
          type: string
          enum: [draft, exported, submitted, partly_reversed, fully_reversed, cancelled]
          description: |
            Where the settlement stands, derived on every read from
            `is_cancelled`, the reversal rows, `submitted_at` and `exported_at`
            (ruling #148 §6). There is no status column, so nothing can drift
            out of step with it.
        status_label:
          type: string
          description: Human-readable form of `status`.
        is_reversible:
          type: boolean
          description: |
            Whether a reverse request would currently be accepted — the exact
            mirror of `is_cancellable`. A settlement is one or the other, never
            both; a cancelled one is neither.
        reversal_blocked_reason:
          type: string
          nullable: true
          description: |
            Human-readable reason reversal is unavailable. Null when
            `is_reversible` is true.
        reversed_member_count:
          type: integer
          description: How many of this settlement's members carry a reversal.
        created_by_admin_id:
          type: string
          format: uuid
        created_by_admin_name:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        transaction_count:
          type: integer
        transaction_date_min:
          type: string
          format: date-time
          nullable: true
        transaction_date_max:
          type: string
          format: date-time
          nullable: true
        items:
          type: array
          description: |
            One row per settled transaction, retained even after the member's
            claim is released — a cancelled or reversed settlement still says
            what it originally contained (ruling #142 §3).
          items:
            $ref: '#/components/schemas/SettlementItem'
        reversals:
          type: array
          description: |
            The reversal events. Present on the single-settlement read; the list
            endpoint does not join them and returns an empty array.
          items:
            $ref: '#/components/schemas/SettlementReversal'

    SettlementItem:
      type: object
      description: One settled transaction inside a settlement.
      properties:
        settlement_id:
          type: string
          format: uuid
        transaction_id:
          type: string
          format: uuid
        member_id:
          type: string
          format: uuid
        member_name:
          type: string
          nullable: true
        amount_cents:
          type: integer
        amount_eur:
          type: number
          format: float
        transaction_type:
          type: string
          nullable: true
        product_name:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        transaction_date:
          type: string
          format: date-time
          nullable: true

    ExecutionDateInfo:
      type: object
      required: [minimum_date, lead_time_days, rule, today]
      properties:
        today:
          type: string
          format: date
          description: |
            The server's own calendar day — the anchor the lead time is
            measured from, and the one `minimum_date` was derived from.

            Informational: since issue #113 no client-supplied date takes part
            in the rule, so a browser whose calendar day runs ahead of the
            server's can no longer produce a pair the server rejects. Display
            it when the UI needs to say what "today" the rule means.
          example: '2026-08-05'
        minimum_date:
          type: string
          format: date
          description: Earliest valid execution date; always a bank business day.
          example: '2026-08-12'
        lead_time_days:
          type: integer
          description: Fixed SEPA lead time in calendar days (ADR-0009).
          example: 7
        rule:
          type: string
          description: Human-readable statement of the rule, for display in the admin UI.
          example: >-
            execution_date >= today + 7 calendar days, rolled to the next bank
            business day (Mon-Fri, excluding TARGET2 closing days)

    SettlementPreview:
      type: object
      properties:
        eligible_members:
          type: array
          description: Members with an active SEPA mandate whose total unsettled position is >= 0
          items:
            $ref: '#/components/schemas/SettlementPreviewMember'
        ineligible_members:
          type: array
          description: Members who owe money but hold no active SEPA mandate — remedy is to chase the bank details
          items:
            $ref: '#/components/schemas/SettlementPreviewMember'
        credit_members:
          type: array
          description: |
            Members whose total unsettled position is negative. Excluded from
            the settlement and from the file; the remedy is the opposite of
            the ineligible bucket's — pay them back (ruling #141, § 812 BGB).
          items:
            $ref: '#/components/schemas/SettlementPreviewMember'
        held_members:
          type: array
          description: |
            Members on collection hold after a returned direct debit (ruling
            #148 §4). Excluded from the run until an admin clears the hold;
            each entry carries `collection_hold_reason` so the exclusion is
            never silent.
          items:
            $ref: '#/components/schemas/SettlementPreviewMember'
        members_without_email:
          type: array
          description: |
            Collected members with no email address (#405). A **subset of
            `eligible_members`**, not a fifth bucket — nobody here is excluded
            from anything. The run collects from them like everybody else;
            what it cannot do is send them the pre-notification Nutzungsordnung
            § 7 Abs. 3 promises. A warning before finalizing, never a block.
            Members closing out at 0.00 are not listed: they are settled but
            not collected from, so there is no announcement to miss.
          items:
            $ref: '#/components/schemas/SettlementPreviewMember'
        eligible_total:
          type: integer
        ineligible_total:
          type: integer
        credit_total:
          type: integer
          description: Sum of the credit bucket; negative, or zero if nobody is in credit
          example: -1500
        held_total:
          type: integer
          description: Sum of what the held members owe
        member_count:
          type: integer
          description: Members placed in any bucket
        transaction_count:
          type: integer
          description: |
            How many transactions the run would contain — every unsettled
            transaction of every eligible member, not the caller's selection.
        warnings:
          type: array
          items:
            type: string

    SettlementPreviewMember:
      type: object
      properties:
        member_id:
          type: string
          format: uuid
        first_name:
          type: string
        last_name:
          type: string
        balance_cents:
          type: integer
          description: The member's whole unsettled position, not the window's slice
        transaction_count:
          type: integer
          description: |
            How many unsettled transactions this member would contribute to
            the run — the count shown on their row in the New Settlement
            screen. Counted over their whole position, like the balance.
        iban_last4:
          type: string
          nullable: true
          minLength: 4
          maxLength: 4
          description: |
            Last four characters only — the preview identifies the account, it
            never needs to debit it ([ADR-0036](../../adr/0036-iban-encryption-sealed-box.md)).
            `null` means the member has no stored account, which is what the
            missing-IBAN badge on the New Settlement screen reads.
        mandate_reference:
          type: string
          nullable: true
        collection_hold_reason:
          type: string
          nullable: true
          description: |
            Why this member is held. Present only on entries in the
            `held_members` bucket.

    SettlementCreateRequest:
      type: object
      description: |
        A run names its **participants**, and then covers each of them in full
        (ruling #141, issue #161). Name them with `member_ids` — the unit of
        selection is the member ([ADR-0030](../../adr/0030-settlement-selection-is-a-member-picker.md)) —
        or with `transaction_ids`, the compatibility path, whose transactions
        are resolved to their members and then discarded.

        Exactly one of the two is required. When both are sent, `member_ids`
        wins. Neither bounds the amounts: every unsettled transaction of every
        named member is settled, including transactions older than
        `period_start`.
      required: [execution_date]
      properties:
        member_ids:
          type: array
          minItems: 1
          description: The run's participants. Required unless `transaction_ids` is given.
          items:
            type: string
            format: uuid
        transaction_ids:
          type: array
          minItems: 1
          description: |
            Compatibility path — names participants indirectly. The
            transactions are resolved to their members; the run then settles
            those members in full, so these ids do not limit its contents.
          items:
            type: string
            format: uuid
        method:
          type: string
          enum: [direct_debit, bank_transfer, write_off]
          default: direct_debit
          description: |
            How this settlement's balance will be collected. Replaces the old
            `settlement_type`/`manual_reason` pair (ruling #163).
            `bank_transfer` and `write_off` settlements must cover exactly one
            member and can never be exported to SEPA.
        period_start:
          type: string
          format: date
          description: Descriptive only — it does not bound what the run settles.
        period_end:
          type: string
          format: date
          description: Descriptive only — it does not bound what the run settles.
        execution_date:
          type: string
          format: date
          description: |
            At least 7 calendar days from the server's today, and a bank
            business day. The settlement's own `settlement_date` is not an
            input — the server records the day it created the settlement, and
            the lead time is measured from that same clock (issue #113).
        notes:
          type: string
          maxLength: 500

    SettlementFilterPreview:
      type: object
      properties:
        transaction_count:
          type: integer
        member_count:
          type: integer
        total_amount_cents:
          type: integer

    # --------------------------------------------------------------------------
    # Terminals
    # --------------------------------------------------------------------------
    Terminal:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        device_id:
          type: string
        is_active:
          type: boolean
        last_sync_at:
          type: string
          format: date-time
          nullable: true
        last_transaction_at:
          type: string
          format: date-time
          nullable: true
        token_issued_at:
          type: string
          format: date-time
          nullable: true
          description: >
            When the terminal's current API token was issued. Null once access
            has been revoked, since no token is outstanding.
        token_expires_at:
          type: string
          format: date-time
          nullable: true
          description: >
            When the current API token stops authenticating. Rotating the token
            stages a replacement with a full `API_TOKEN_TTL_DAYS` lifetime (365
            days by default). A terminal whose token has expired is refused with
            `terminal_token_expired` until it is rotated.
        pending_token_expires_at:
          type: string
          format: date-time
          nullable: true
          description: >
            Lifetime of a replacement token that has been issued but not yet
            used at the device. While this is set, both tokens authenticate; the
            first successful authentication with the new one promotes it and
            retires the old one (#395).
        has_pending_token:
          type: boolean
          description: >
            Whether a rotation is staged and waiting to be entered at the
            terminal.
        lifecycle_state:
          type: string
          enum: [ok, info, warning, critical, expired]
          description: >
            The current token's position on the shared 90/30/7 warning tiers
            (ADR-0036), computed at request time. `ok` when no token is
            outstanding at all — read `token_expires_at` for that case.
        days_until_expiry:
          type: integer
          nullable: true
          description: >
            Whole days until the current token expires, negative once it has.
            Null when no token is outstanding.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateTerminalRequest:
      description: >
        Enrolling a terminal mints a credential that reads the member roster and
        writes transactions, so it carries a step-up credential (#395).
      allOf:
        - $ref: '#/components/schemas/StepUpCredentials'
        - type: object
          required: [name, device_id]
          properties:
            name:
              type: string
            device_id:
              type: string

    RotateTerminalTokenRequest:
      description: >
        Rotation mints a credential too, and carries the same step-up (#395).
      allOf:
        - $ref: '#/components/schemas/StepUpCredentials'

    UpdateTerminalRequest:
      type: object
      properties:
        name:
          type: string
        is_active:
          type: boolean

    TerminalWithToken:
      allOf:
        - $ref: '#/components/schemas/Terminal'
        - type: object
          properties:
            api_token:
              type: string
              description: API token for terminal authentication

    # --------------------------------------------------------------------------
    # Global Transactions
    # --------------------------------------------------------------------------
    GlobalTransaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        member_id:
          type: string
          format: uuid
        member_name:
          type: string
        type:
          type: string
          enum: [purchase, storno, payout]
        amount_cents:
          type: integer
        description:
          type: string
        product_id:
          type: string
          format: uuid
          nullable: true
        product_name:
          type: string
          nullable: true
        product_names:
          type: string
          nullable: true
          description: JSON string with multilingual product names
        created_at:
          type: string
          format: date-time
        created_by_admin_id:
          type: string
          format: uuid
          nullable: true
        created_by_terminal_id:
          type: string
          format: uuid
          nullable: true
        is_settled:
          type: boolean
        settlement_date:
          type: string
          format: date
          nullable: true
        related_transaction_id:
          type: string
          format: uuid
          nullable: true
          description: |
            For a `storno`, the transaction it reverses — never null. Null for
            every other type (GoBD Rz. 64, ADR-0028 §4).
        stornoed_by_transaction_id:
          type: string
          format: uuid
          nullable: true
          description: |
            The storno that reverses this transaction, if it has one — the
            reverse of `related_transaction_id`. Lets the journal show the
            linkage from either row and refuse a second storno before the
            request is made.

    # --------------------------------------------------------------------------
    # SEPA Configuration
    # --------------------------------------------------------------------------
    SepaConfig:
      type: object
      properties:
        creditor_id:
          type: string
          description: Gläubiger-ID (masked)
        creditor_name:
          type: string
          maxLength: 70
        creditor_iban:
          type: string
          description: Masked IBAN
        creditor_address_street:
          type: string
          maxLength: 70
        creditor_address_city:
          type: string
          maxLength: 70
        creditor_address_country:
          type: string
          minLength: 2
          maxLength: 2
        payment_reference_prefix:
          type: string
          maxLength: 100
          description: Prefix of the payment reference shown on member bank statements
        is_configured:
          type: boolean
          description: True once creditor_id, creditor_name and creditor_iban are all set
        updated_at:
          type: string
          format: date-time

    SepaConfigRequest:
      type: object
      required: [creditor_id, creditor_name, creditor_iban, creditor_address_street, creditor_address_city]
      properties:
        creditor_id:
          type: string
          maxLength: 35
          description: Gläubiger-ID (immutable after set)
        creditor_name:
          type: string
          maxLength: 70
        creditor_iban:
          type: string
          minLength: 15
          maxLength: 34
        creditor_address_street:
          type: string
          maxLength: 70
        creditor_address_city:
          type: string
          maxLength: 70
        creditor_address_country:
          type: string
          minLength: 2
          maxLength: 2
          default: DE
        payment_reference_prefix:
          type: string
          maxLength: 100
          description: Prefix of the payment reference shown on member bank statements

    InstanceConfig:
      type: object
      properties:
        instance_name:
          type: string
          maxLength: 100
          description: The deploying club's display name, shown in the admin UI, Terminal, and as the TOTP issuer
          example: FRGS Ruderbar

    InstanceConfigUpdateRequest:
      type: object
      required: [instance_name]
      properties:
        instance_name:
          type: string
          minLength: 1
          maxLength: 100
          example: FRGS Ruderbar

    SchedulerStatus:
      type: object
      properties:
        verified:
          type: boolean
          description: |
            Has a drain run ever been recorded? Once true it stays true.
        last_run_at:
          type: string
          format: date-time
          nullable: true
          description: UTC. `null` on an installation that has never been drained.
        source:
          type: string
          nullable: true
          enum: [cli, url]
          description: How the last observed run was triggered.
        last_sent:
          type: integer
          nullable: true
        last_failed:
          type: integer
          nullable: true
        php_version:
          type: string
          nullable: true
          description: |
            The **drain's** interpreter, which on mass hosting is frequently
            not the web's — a different build, a different `php.ini`, a
            different extension set.
        missing_extensions:
          type: array
          nullable: true
          description: |
            Extensions this application needs that the drain's PHP did not
            load. `null` means the run predates migration 027; `[]` means it
            checked and found nothing missing, which is a different statement.
          items:
            type: string
        setup:
          type: object
          properties:
            cli_command:
              type: string
              description: The line to paste into a hosting panel's cron form.
              example: php /var/www/htdocs/backend/bin/cron.php
            drain_url:
              type: string
              nullable: true
              description: |
                The URL trigger, or `null` when `cron.secret` is unset and the
                route is therefore not mounted.
            recommended_interval_minutes:
              type: integer
              example: 15

    MailConfig:
      type: object
      description: |
        Club-editable mail settings plus the read-only state of the transport
        configured in `config.php`.
      properties:
        sender_name:
          type: string
          maxLength: 120
          description: Display name in the recipient's inbox. Defaults to the instance name.
          example: FRGS Ruderbar
        sender_address:
          type: string
          format: email
          maxLength: 255
          description: Envelope sender. Empty means mail was never configured.
          example: bar@example.org
        reply_to_address:
          type: string
          format: email
          nullable: true
          maxLength: 255
          description: Where a reply goes — the Kassenwart, since a pre-notification invites one.
          example: kassenwart@example.org
        header_style:
          type: string
          enum: [red, petrol, paper]
          description: Header band variant. `paper` is the settlement-mail default.
          example: paper
        footer_org_name:
          type: string
          maxLength: 200
          example: Ruderverein Beispiel e. V.
        footer_address_line:
          type: string
          nullable: true
          maxLength: 255
          example: Musterweg 35 · 60599 Frankfurt am Main
        website_url:
          type: string
          nullable: true
          maxLength: 255
          description: Public site URL; also the origin the mail webfonts are fetched from.
          example: https://www.example.org
        logo_url:
          type: string
          nullable: true
          maxLength: 255
          description: PNG only — Gmail and Outlook do not render SVG in mail.
        is_complete:
          type: boolean
          readOnly: true
          description: Whether a sender address is set at all.
        can_send:
          type: boolean
          readOnly: true
          description: Both halves present — a usable transport and a sender address.
        transport:
          type: object
          readOnly: true
          description: State of `mail.dsn` from `config.php`. Never contains the DSN or its password.
          properties:
            configured:
              type: boolean
            valid:
              type: boolean
            summary:
              type: string
              example: smtp to mail.example.org:587
            error:
              type: string
              nullable: true
              description: Why the configured DSN is unusable, in a sentence an admin can act on.

    MailConfigUpdateRequest:
      type: object
      properties:
        sender_name:
          type: string
          maxLength: 120
        sender_address:
          type: string
          format: email
          maxLength: 255
        reply_to_address:
          type: string
          format: email
          nullable: true
          maxLength: 255
        header_style:
          type: string
          enum: [red, petrol, paper]
        footer_org_name:
          type: string
          maxLength: 200
        footer_address_line:
          type: string
          nullable: true
          maxLength: 255
        website_url:
          type: string
          nullable: true
          maxLength: 255
        logo_url:
          type: string
          nullable: true
          maxLength: 255

    SepaConfigUpdateRequest:
      type: object
      description: |
        `creditor_id` is deliberately absent: it is immutable after initial
        setup and is only accepted by `POST /admin/sepa-config`.
      properties:
        creditor_name:
          type: string
          maxLength: 70
        creditor_iban:
          type: string
          minLength: 15
          maxLength: 34
        creditor_address_street:
          type: string
          maxLength: 70
        creditor_address_city:
          type: string
          maxLength: 70
        creditor_address_country:
          type: string
          minLength: 2
          maxLength: 2
        payment_reference_prefix:
          type: string
          maxLength: 100
          description: Prefix of the payment reference shown on member bank statements

