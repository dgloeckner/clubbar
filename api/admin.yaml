    SettlementAnnouncement:
      type: object
      description: |
        Durable proof that one member was announced to about one settlement, and
        when. Written when the scheduler hands the message to the transport, and
        deliberately address-free so it can be kept after the queue row that
        carried the address has been pruned.
      properties:
        member_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [sepa_prenotification, cancellation_notice]
          description: |
            Only member-addressed settlement mail appears here. An expiry
            warning is about a credential and goes to an admin — there is no
            settlement for it to be evidence against.
        sent_at:
          type: string
          format: date-time
      required: [member_id, kind, sent_at]

    SettlementItem:
      type: object
      description: One settled transaction inside a settlement.
      properties:
        settlement_id:
          type: string
          format: uuid
        transaction_id:
          type: string
          format: uuid
        member_id:
          type: string
          format: uuid
        member_name:
          type: string
          nullable: true
        amount_cents:
          type: integer
        amount_eur:
          type: number
          format: float
        transaction_type:
          type: string
          nullable: true
        product_name:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        transaction_date:
          type: string
          format: date-time
          nullable: true

    ExecutionDateInfo:
      type: object
      required: [minimum_date, lead_time_days, rule, today]
      properties:
        today:
          type: string
          format: date
          description: |
            The server's own calendar day — the anchor the lead time is
            measured from, and the one `minimum_date` was derived from.

            Informational: since issue #113 no client-supplied date takes part
            in the rule, so a browser whose calendar day runs ahead of the
            server's can no longer produce a pair the server rejects. Display
            it when the UI needs to say what "today" the rule means.
          example: '2026-08-05'
        minimum_date:
          type: string
          format: date
          description: Earliest valid execution date; always a bank business day.
          example: '2026-08-12'
        lead_time_days:
          type: integer
          description: Fixed SEPA lead time in calendar days (ADR-0009).
          example: 7
        rule:
          type: string
          description: Human-readable statement of the rule, for display in the admin UI.
          example: >-
            execution_date >= today + 7 calendar days, rolled to the next bank
            business day (Mon-Fri, excluding TARGET2 closing days)

    SettlementPreview:
      type: object
      properties:
        eligible_members:
          type: array
          description: Members with an active SEPA mandate whose total unsettled position is >= 0
          items:
            $ref: '#/components/schemas/SettlementPreviewMember'
        ineligible_members:
          type: array
          description: Members who owe money but hold no active SEPA mandate — remedy is to chase the bank details
          items:
            $ref: '#/components/schemas/SettlementPreviewMember'
        credit_members:
          type: array
          description: |
            Members whose total unsettled position is negative. Excluded from
            the settlement and from the file; the remedy is the opposite of
            the ineligible bucket's — pay them back (ruling #141, § 812 BGB).
          items:
            $ref: '#/components/schemas/SettlementPreviewMember'
        held_members:
          type: array
          description: |
            Members on collection hold after a returned direct debit (ruling
            #148 §4). Excluded from the run until an admin clears the hold;
            each entry carries `collection_hold_reason` so the exclusion is
            never silent.
          items:
            $ref: '#/components/schemas/SettlementPreviewMember'
        members_without_email:
          type: array
          description: |
            Collected members with no email address (#405). A **subset of
            `eligible_members`**, not a fifth bucket — nobody here is excluded
            from anything. The run collects from them like everybody else;
            what it cannot do is send them the pre-notification Nutzungsordnung
            § 7 Abs. 3 promises. A warning before finalizing, never a block.
            Members closing out at 0.00 are not listed: they are settled but
            not collected from, so there is no announcement to miss.
          items:
            $ref: '#/components/schemas/SettlementPreviewMember'
        eligible_total:
          type: integer
        ineligible_total:
          type: integer
        credit_total:
          type: integer
          description: Sum of the credit bucket; negative, or zero if nobody is in credit
          example: -1500
        held_total:
          type: integer
          description: Sum of what the held members owe
        member_count:
          type: integer
          description: Members placed in any bucket
        transaction_count:
          type: integer
          description: |
            How many transactions the run would contain — every unsettled
            transaction of every eligible member, not the caller's selection.
        warnings:
          type: array
          items:
            type: string

    SettlementPreviewMember:
      type: object
      properties:
        member_id:
          type: string
          format: uuid
        first_name:
          type: string
        last_name:
          type: string
        balance_cents:
          type: integer
          description: The member's whole unsettled position, not the window's slice
        transaction_count:
          type: integer
          description: |
            How many unsettled transactions this member would contribute to
            the run — the count shown on their row in the New Settlement
            screen. Counted over their whole position, like the balance.
        iban_last4:
          type: string
          nullable: true
          minLength: 4
          maxLength: 4
          description: |
            Last four characters only — the preview identifies the account, it
            never needs to debit it ([ADR-0036](../../adr/0036-iban-encryption-sealed-box.md)).
            `null` means the member has no stored account, which is what the
            missing-IBAN badge on the New Settlement screen reads.
        mandate_reference:
          type: string
          nullable: true
        collection_hold_reason:
          type: string
          nullable: true
          description: |
            Why this member is held. Present only on entries in the
            `held_members` bucket.

    SettlementCreateRequest:
      type: object
      description: |
        A run names its **participants**, and then covers each of them in full
        (ruling #141, issue #161). Name them with `member_ids` — the unit of
        selection is the member ([ADR-0030](../../adr/0030-settlement-selection-is-a-member-picker.md)) —
        or with `transaction_ids`, the compatibility path, whose transactions
        are resolved to their members and then discarded.

        Exactly one of the two is required. When both are sent, `member_ids`
        wins. Neither bounds the amounts: every unsettled transaction of every
        named member is settled, including transactions older than
        `period_start`.
      required: [execution_date]
      properties:
        member_ids:
          type: array
          minItems: 1
          description: The run's participants. Required unless `transaction_ids` is given.
          items:
            type: string
            format: uuid
        transaction_ids:
          type: array
          minItems: 1
          description: |
            Compatibility path — names participants indirectly. The
            transactions are resolved to their members; the run then settles
            those members in full, so these ids do not limit its contents.
          items:
            type: string
            format: uuid
        method:
          type: string
          enum: [direct_debit, bank_transfer, write_off]
          default: direct_debit
          description: |
            How this settlement's balance will be collected. Replaces the old
            `settlement_type`/`manual_reason` pair (ruling #163).
            `bank_transfer` and `write_off` settlements must cover exactly one
            member and can never be exported to SEPA.
        period_start:
          type: string
          format: date
          description: Descriptive only — it does not bound what the run settles.
        period_end:
          type: string
          format: date
          description: Descriptive only — it does not bound what the run settles.
        execution_date:
          type: string
          format: date
          description: |
            At least 7 calendar days from the server's today, and a bank
            business day. The settlement's own `settlement_date` is not an
            input — the server records the day it created the settlement, and
            the lead time is measured from that same clock (issue #113).
        notes:
          type: string
          maxLength: 500

    SettlementFilterPreview:
      type: object
      properties:
        transaction_count:
          type: integer
        member_count:
          type: integer
        total_amount_cents:
          type: integer

    # --------------------------------------------------------------------------
    # Terminals
    # --------------------------------------------------------------------------
    Terminal:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        device_id:
          type: string
        is_active:
          type: boolean
        last_sync_at:
          type: string
          format: date-time
          nullable: true
        last_transaction_at:
          type: string
          format: date-time
          nullable: true
        token_issued_at:
          type: string
          format: date-time
          nullable: true
          description: >
            When the terminal's current API token was issued. Null once access
            has been revoked, since no token is outstanding.
        token_expires_at:
          type: string
          format: date-time
          nullable: true
          description: >
            When the current API token stops authenticating. Rotating the token
            stages a replacement with a full `API_TOKEN_TTL_DAYS` lifetime (365
            days by default). A terminal whose token has expired is refused with
            `terminal_token_expired` until it is rotated.
        pending_token_expires_at:
          type: string
          format: date-time
          nullable: true
          description: >
            Lifetime of a replacement token that has been issued but not yet
            used at the device. While this is set, both tokens authenticate; the
            first successful authentication with the new one promotes it and
            retires the old one (#395).
        has_pending_token:
          type: boolean
          description: >
            Whether a rotation is staged and waiting to be entered at the
            terminal.
        lifecycle_state:
          type: string
          enum: [ok, info, warning, critical, expired]
          description: >
            The current token's position on the shared 90/30/7 warning tiers
            (ADR-0036), computed at request time. `ok` when no token is
            outstanding at all — read `token_expires_at` for that case.
        days_until_expiry:
          type: integer
          nullable: true
          description: >
            Whole days until the current token expires, negative once it has.
            Null when no token is outstanding.
        open_anomaly_count:
          type: integer
          description: >
            Unacknowledged credential anomalies for this terminal (ADR-0041) —
            concurrent use from two addresses, or a sync cursor that does not
            continue this token's history. Answers the same question the
            lifecycle fields do, from the other direction: not "is this about
            to expire" but "is somebody else already using it".
        has_open_anomaly:
          type: boolean
          description: Whether `open_anomaly_count` is greater than zero.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TerminalAnomaly:
      type: object
      description: >
        One open anomaly row (ADR-0041 §4) — the detail behind
        `Terminal.open_anomaly_count`, carrying the id an admin needs to
        acknowledge it.
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [concurrent_ip, cursor_regression, cursor_reset]
        severity:
          type: string
          enum: [warning, error]
          description: >
            How this one anomaly reads alone — `error` for `concurrent_ip`,
            `warning` for the two cursor kinds, which both have a routine
            innocent cause.
        first_detected_at:
          type: string
          format: date-time
        last_detected_at:
          type: string
          format: date-time
        occurrence_count:
          type: integer
          description: How many cron ticks in a row found this still true.
        details:
          type: object
          description: >
            Evidence behind the finding — the overlapping addresses and
            overlap duration for `concurrent_ip`, or the stream and the two
            cursor values for a cursor anomaly. Shape depends on `kind`.
          additionalProperties: true

    CreateTerminalRequest:
      description: >
        Enrolling a terminal mints a credential that reads the member roster and
        writes transactions, so it carries a step-up credential (#395).
      allOf:
        - $ref: '#/components/schemas/StepUpCredentials'
        - type: object
          required: [name, device_id]
          properties:
            name:
              type: string
            device_id:
              type: string

    RotateTerminalTokenRequest:
      description: >
        Rotation mints a credential too, and carries the same step-up (#395).
      allOf:
        - $ref: '#/components/schemas/StepUpCredentials'

    UpdateTerminalRequest:
      type: object
      properties:
        name:
          type: string
        is_active:
          type: boolean

    TerminalWithToken:
      allOf:
        - $ref: '#/components/schemas/Terminal'
        - type: object
          properties:
            api_token:
              type: string
              description: API token for terminal authentication

    # --------------------------------------------------------------------------
    # Global Transactions
    # --------------------------------------------------------------------------
    GlobalTransaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        member_id:
          type: string
          format: uuid
        member_name:
          type: string
        type:
          type: string
          enum: [purchase, storno, payout]
        amount_cents:
          type: integer
        description:
          type: string
        product_id:
          type: string
          format: uuid
          nullable: true
        product_name:
          type: string
          nullable: true
        product_names:
          type: string
          nullable: true
          description: JSON string with multilingual product names
        created_at:
          type: string
          format: date-time
        created_by_admin_id:
          type: string
          format: uuid
          nullable: true
        created_by_terminal_id:
          type: string
          format: uuid
          nullable: true
        is_settled:
          type: boolean
        settlement_date:
          type: string
          format: date
          nullable: true
        related_transaction_id:
          type: string
          format: uuid
          nullable: true
          description: |
            For a `storno`, the transaction it reverses — never null. Null for
            every other type (GoBD Rz. 64, ADR-0028 §4).
        stornoed_by_transaction_id:
          type: string
          format: uuid
          nullable: true
          description: |
            The storno that reverses this transaction, if it has one — the
            reverse of `related_transaction_id`. Lets the journal show the
            linkage from either row and refuse a second storno before the
            request is made.

    # --------------------------------------------------------------------------
    # SEPA Configuration
    # --------------------------------------------------------------------------
    SepaConfig:
      type: object
      properties:
        creditor_id:
          type: string
          description: Gläubiger-ID (masked)
        creditor_name:
          type: string
          maxLength: 70
        creditor_iban:
          type: string
          description: Masked IBAN
        creditor_address_street:
          type: string
          maxLength: 70
        creditor_address_city:
          type: string
          maxLength: 70
        creditor_address_country:
          type: string
          minLength: 2
          maxLength: 2
        payment_reference_prefix:
          type: string
          maxLength: 100
          description: Prefix of the payment reference shown on member bank statements
        mandate_template_url:
          type: string
          maxLength: 255
          nullable: true
          description: |
            The externally hosted registration form ("Anmeldung zur
            bargeldlosen Vereinsbar") a new member signs (#360). The blank
            mandate PDF used to be generated in-app; the club now maintains
            this form elsewhere and links to it instead.
        is_configured:
          type: boolean
          description: True once creditor_id, creditor_name, creditor_iban and mandate_template_url are all set
        updated_at:
          type: string
          format: date-time

    SepaConfigRequest:
      type: object
      required: [creditor_id, creditor_name, creditor_iban, creditor_address_street, creditor_address_city]
      properties:
        creditor_id:
          type: string
          maxLength: 35
          description: Gläubiger-ID (immutable after set)
        creditor_name:
          type: string
          maxLength: 70
        creditor_iban:
          type: string
          minLength: 15
          maxLength: 34
        creditor_address_street:
          type: string
          maxLength: 70
        creditor_address_city:
          type: string
          maxLength: 70
        creditor_address_country:
          type: string
          minLength: 2
          maxLength: 2
          default: DE
        payment_reference_prefix:
          type: string
          maxLength: 100
          description: Prefix of the payment reference shown on member bank statements
        mandate_template_url:
          type: string
          maxLength: 255
          nullable: true
          description: The externally hosted registration form a new member signs (#360)

    InstanceConfig:
      type: object
      properties:
        instance_name:
          type: string
          maxLength: 100
          description: The deploying club's display name, shown in the admin UI, Terminal, and as the TOTP issuer
          example: FRGS Ruderbar

    InstanceConfigUpdateRequest:
      type: object
      required: [instance_name]
      properties:
        instance_name:
          type: string
          minLength: 1
          maxLength: 100
          example: FRGS Ruderbar

    CreditLimitConfig:
      type: object
      properties:
        default_limit_cents:
          type: integer
          minimum: 0
          maximum: 10000000
          description: |
            The club-wide ceiling in cents. `0` means no ceiling is enforced —
            the convention the terminal's `CreditLimitCheck` and the
            Deckelauszug already use (ADR-0047 decision 3).
          example: 10000
        warn_threshold_percent:
          type: integer
          minimum: 1
          maximum: 100
          description: |
            Share of the *effective* ceiling from which a member is warned but
            still served. Club-wide: a member's override sets their ceiling,
            never their band (ADR-0047 decision 4).
          example: 80

    CreditLimitConfigUpdateRequest:
      type: object
      required: [default_limit_cents, warn_threshold_percent]
      properties:
        default_limit_cents:
          type: integer
          minimum: 0
          maximum: 10000000
          description: |
            `0` sets "no ceiling". A negative value is rejected rather than
            read as unlimited — it would pass the same `<= 0` test by accident.
          example: 15000
        warn_threshold_percent:
          type: integer
          minimum: 1
          maximum: 100
          example: 80

    MailKind:
      type: string
      description: |
        What a queued message is. The value is part of the outbox's uniqueness
        key, which is why one settlement can carry both an announcement and a
        later cancellation notice for the same member.

        The two expiry warnings
        ([#438](https://github.com/dgloeckner/clubbar/issues/438)) are reserved:
        the storage accepts them, and nothing enqueues them yet. There is no
        `payment_request` — it was reserved for
        [#410](https://github.com/dgloeckner/clubbar/issues/410) and removed with
        migration `036` when that issue was closed unbuilt, because a
        `bank_transfer` settlement records money that already arrived and a mail
        asking for it would ask twice.

        `terminal_anomaly_warning` is queued by the anomaly detector
        ([ADR-0041](../../adr/0041-terminal-credential-anomaly-detection.md)) and
        addressed to an admin rather than a member.

        `admin_email_changed` is the security notice sent when an admin's login
        address moves. It is the only kind addressed to an address the system no
        longer holds — the one it moved *from*, read from the row's `recipient`
        snapshot rather than from `admin_users`.

        `deckel_statement` is the periodic Deckelauszug
        ([ADR-0039](../../adr/0039-periodic-deckel-statement.md)): the first kind
        whose subject is the **member** rather than a settlement, a key or a
        terminal, and the first triggered by time passing rather than by
        somebody doing something. Its `dedup_key` is the period (`2026-08`,
        `2026-Q3`), which is what makes a scan that runs every hour produce one
        statement a month.

        The four `member_*` kinds
        ([ADR-0051](../../adr/0051-member-lifecycle-mail.md)) are the first mail
        a member gets for a reason other than money, and all four are gated on
        the card: `member_welcome` fires when a card is first assigned — not
        when the record is created — and `member_card_replaced` on every later
        assignment. `member_email_changed` and `member_email_activated` are the
        two ends of one address change, one to the address being left and one to
        the address being taken up; like `admin_email_changed`, the first is
        addressed to a value the system no longer holds and reads it from the
        `recipient` snapshot.

        This list is the whole of `MailKind`, and the `kind` filter on
        `GET /api/admin/notifications` rejects anything outside it. Prefer
        reading `filters.kinds` off that response, which is generated from the
        enum itself and therefore cannot drift from it.
      enum:
        - sepa_prenotification
        - cancellation_notice
        - key_expiry_warning
        - terminal_token_expiry_warning
        - terminal_anomaly_warning
        - terminal_token_issued
        - admin_email_changed
        - deckel_statement
        - encryption_key_registered
        - encryption_key_activated
        - encryption_key_revoked
        - admin_account_created
        - admin_role_changed
        - jugendschutz_violation
        - credit_limit_digest
        - backup_secret_expiry_warning
        - backup_health_warning
        - member_welcome
        - member_card_replaced
        - member_email_changed
        - member_email_activated

    MailStatus:
      type: string
      description: |
        Where a queued message stands. `superseded` is the one worth explaining:
        it is what a cancellation does to an announcement that never left the
        host. Nothing went wrong — the collection was called off before anybody
        was told, so there is nothing to retract and nothing to send.
      enum: [pending, sent, failed, superseded]

    QueuedMail:
      type: object
      description: |
        One message in the outbox, as an admin reads it (ADR-0038 rule 6).

        `recipient` is a **snapshot** taken when the message was queued, not a
        join: `members.email` can change or be erased afterwards, and this is
        the proof of who was actually written to. It is also what makes *"the
        announcement went to the old address"* a diagnosis a name alone cannot
        give.

        There is no body and no way to fetch one — nothing stores a rendered
        message (rule 5). The content is reproduced from settlement data at send
        time.
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/MailKind'
        subject_id:
          type: string
          format: uuid
          description: |
            What the message is about. Which table it points at is decided by
            `kind`, so there is no second column to disagree with it — and no
            foreign key, because a polymorphic one cannot exist.
        member_id:
          type: string
          format: uuid
          nullable: true
        member_name:
          type: string
          nullable: true
          description: |
            `null` for a message addressed to an admin, and for an anonymised
            member — ADR-0029 clears the name and keeps the booking history, and
            the row still has to render.
        admin_user_id:
          type: string
          format: uuid
          nullable: true
        admin_name:
          type: string
          nullable: true
        recipient:
          type: string
          description: The address the message was queued for. See the schema description.
        language:
          type: string
          description: Frozen at enqueue from the member's preference, `de` fallback (ADR-0002).
          example: de
        status:
          $ref: '#/components/schemas/MailStatus'
        attempts:
          type: integer
        last_error:
          type: string
          nullable: true
          description: |
            The receiving server's own words, unedited. "Authentication failed",
            "mailbox full" and "relay access denied" point at three different
            fixes, and a friendly summary would erase the difference.
        queued_at:
          type: string
          format: date-time
        next_attempt_at:
          type: string
          format: date-time
          nullable: true
          description: |
            When the message becomes due again. In the *future* while a retry is
            waiting out its backoff — which is why the stall alarm keys on being
            overdue rather than on age (ADR-0039 decision 5).
        sent_at:
          type: string
          format: date-time
          nullable: true
        is_retryable:
          type: boolean
          readOnly: true
          description: |
            Whether `POST /admin/notifications/{id}/retry` would be accepted.
            Answered by the server so the button and the endpoint cannot
            disagree about which rows are eligible.

    TestMailResult:
      type: object
      description: |
        What happened when an admin asked for a test mail. Always `200`: every
        outcome here is the answer the button was pressed to get, and an error
        status would put the diagnosis behind a generic failure banner.
      properties:
        sent:
          type: boolean
        recipient:
          type: string
          nullable: true
          description: |
            The requesting admin's own address. There is no parameter to point
            it elsewhere — an endpoint that mails an arbitrary address on
            request is an authenticated open relay on the club's own domain.
        transport:
          type: string
          nullable: true
          description: Where the mail went, redacted. Never the DSN.
          example: smtp to mail.example.org:587
        error:
          type: string
          nullable: true
          description: The transport's own words when it refused. See `QueuedMail.last_error`.

    BackupInventory:
      type: object
      description: |
        The local half of the backups page (#693). Filesystem only — the
        off-site column comes from `GET /admin/backups/remote`.
      properties:
        archives:
          type: array
          items:
            $ref: '#/components/schemas/BackupArchive'
        keys:
          type: array
          description: |
            The keys that open what is here, aggregated by fingerprint.
          items:
            $ref: '#/components/schemas/BackupKey'

    BackupArchive:
      type: object
      properties:
        name:
          type: string
          example: clubbar-20260825-030000-1a2b3c4d.cbb
        bytes:
          type: integer
          description: Size of the sealed container on disk.
        at:
          type: integer
          description: |
            The snapshot instant, as a Unix timestamp, taken from the
            **filename** rather than the file's mtime. A copy, a restore from a
            provider's recycle bin or a stray `touch` rewrites the mtime while
            the name still says when the snapshot was taken.
        readable:
          type: boolean
          description: |
            Whether the header parsed. `false` means the archive is on disk but
            damaged — it is **listed anyway**, because omitting it would remove
            the one file most worth investigating and let a club count backups
            it does not have. Every field below is then `null`.
        created_at:
          type: string
          nullable: true
          description: The archive's own claim, from its header.
        config_included:
          type: boolean
          nullable: true
          description: |
            Whether the payload carries `config.php` as well as the rows (#692).
            It changes what a restore still needs: without it, restoring yields
            a database every admin is locked out of, because the TOTP encryption
            key is not in the database.
        plaintext_bytes:
          type: integer
          nullable: true
          description: Size of the dump the decryptor hands back, before sealing.
        recipients:
          type: array
          description: The keys this archive is sealed to. Public halves only.
          items:
            type: object
            properties:
              label:
                type: string
              fingerprint:
                type: string

    BackupKey:
      type: object
      description: |
        One recipient key, and the span of archives it still opens. A key whose
        newest archive has aged out opens nothing this installation holds —
        which is the fact somebody needs before shredding a paper envelope.
      properties:
        label:
          type: string
          description: What is written on the envelope. Not an identity.
          example: vorstand
        fingerprint:
          type: string
          description: SHA-256 of the public key. This is the identity.
        archives:
          type: integer
          description: How many archives here are sealed to it.
        first_seen:
          type: string
          nullable: true
          description: The oldest archive it opens.
        last_seen:
          type: string
          nullable: true
          description: The newest archive it opens.

    BackupRemoteState:
      type: object
      description: |
        What the off-site store holds, and how that was established.
      properties:
        source:
          type: string
          enum: [live, snapshot, unavailable]
          description: |
            `live` — the store was asked just now and answered.

            `snapshot` — it could not be reached in the budget; this is what the
            nightly run last saw, and `taken_at` says when.

            `unavailable` — no live answer and no snapshot: nobody has ever
            successfully listed this store, which on a configured installation
            means the nightly job has not run.
        remote:
          type: string
          nullable: true
          description: Which store this is. Null when no `backup.dsn` is configured.
        taken_at:
          type: integer
          nullable: true
          description: |
            When this answer was true, as a Unix timestamp. Present for `live`
            and `snapshot`; a reader must show it, so "as of last night" is
            never passed off as "right now".
        names:
          type: array
          description: Archive filenames the store holds.
          items:
            type: string
        error:
          type: string
          nullable: true

    SchedulerStatus:
      type: object
      description: |
        What a `kassenwart` receives is `verified` and
        `setup.recommended_interval_minutes` only — every other field here is
        `admin`-only and simply absent from their response (#677), the `backup`
        section included (#693). Nothing is marked required for that reason;
        read defensively.

        `backup` is absent from an `admin`'s response too when no backup half
        was assembled, so its presence is the test — never a null value.
      properties:
        verified:
          type: boolean
          description: |
            Has a drain run ever been recorded? Once true it stays true.
            The one field every role granted this route receives.
        last_run_at:
          type: string
          format: date-time
          nullable: true
          description: UTC. `null` on an installation that has never been drained.
        source:
          type: string
          nullable: true
          enum: [cli, url]
          description: How the last observed run was triggered.
        last_sent:
          type: integer
          nullable: true
        last_failed:
          type: integer
          nullable: true
        php_version:
          type: string
          nullable: true
          description: |
            The **drain's** interpreter, which on mass hosting is frequently
            not the web's — a different build, a different `php.ini`, a
            different extension set.
        missing_extensions:
          type: array
          nullable: true
          description: |
            Extensions this application needs that the drain's PHP did not
            load. `null` means the run predates migration 027; `[]` means it
            checked and found nothing missing, which is a different statement.
          items:
            type: string
        declared_interval:
          type: string
          enum: [hourly, daily]
          description: |
            What this installation says its scheduler does. Every retry and
            alarm threshold is measured in ticks of it (ADR-0039 decision 5).
        observed_interval:
          type: string
          enum: [hourly, daily]
          nullable: true
          description: |
            What the gap between the last two recorded runs looks like. `null`
            while there has been only one run, or when the gap is too short to
            conclude anything from — a manual run minutes after a scheduled one
            says nothing about the schedule.
        interval_disagrees:
          type: boolean
          description: |
            The scheduler fires less often than it was declared to. Reported,
            never acted on: the declaration is what an admin has to go and fix
            in a hosting panel, and silently re-deriving it would hide exactly
            that. A scheduler *faster* than declared is not a disagreement — it
            only makes every threshold conservative.
        setup:
          type: object
          properties:
            cli_command:
              type: string
              description: |
                The line to paste into a hosting panel's cron form.
                `admin` only — it names this installation's document root.
              example: php /var/www/htdocs/backend/bin/cron.php
            drain_url:
              type: string
              nullable: true
              description: |
                The URL trigger, or `null` when `cron.secret` is unset and the
                route is therefore not mounted. `admin` only.
            recommended_interval_minutes:
              type: integer
              description: |
                How often the setup instructions ask for the drain to run.
                Sent to every role granted this route, so a banner without the
                command can still say how often the missing task has to fire.
              example: 15
        backup:
          type: object
          description: |
            The nightly encrypted backup — the second scheduled job an
            installation needs (#693, ADR-0049).

            **`admin` only, and absent entirely for any other role.** It mirrors
            the surfaces it points at: `GET /api/admin/security-check`, where the
            measured backup rows render, is `admin`-only, and backup
            configuration is the operator's throughout. A Kassenwart cannot
            reach a hosting panel and cannot act on a missing backup cron.

            Also absent when the caller assembled no backup half at all — the
            installer and the package smoke test read this status without the
            module wired.

            **No schedule is carried here.** Triggering is external: a hosting
            panel fires the job, the application never reads a cadence and could
            not act on one. The recommended `0 3 * * *` is identical on every
            installation, so it lives in the panel's own strings rather than in a
            field that would dress advice up as configuration.
          properties:
            configured:
              type: boolean
              description: |
                Whether backups are switched on. Configuring a recipient public
                key *is* the on-switch (ADR-0049 decision 2) — there is no
                separate flag that could disagree with the keys.
            verified:
              type: boolean
              description: |
                Whether a backup run has ever been observed on this
                installation, read from the journal and the archives on disk.
                No backup run history exists in the database, by decision
                (ADR-0049 decision 8).

                `false` while `configured` is `true` is the state this field
                exists for: backups are on and the nightly job was never added
                to the panel, which is otherwise indistinguishable from silence.
              example: false
            cli_command:
              type: string
              description: |
                The line to paste into a hosting panel's cron form. Names this
                installation's document root, like the drain's.
              example: php /var/www/htdocs/backend/bin/backup.php
            trigger_url:
              type: string
              nullable: true
              description: |
                The URL trigger, or `null` when the route is not mounted — which
                needs a cron secret **and** a recipient key. Offering a URL that
                answers 404 is worse than offering none.

    MailConfig:
      type: object
      description: |
        Club-editable mail settings plus the read-only state of the transport
        configured in `config.php`.
      properties:
        sender_name:
          type: string
          maxLength: 120
          description: Display name in the recipient's inbox. Defaults to the instance name.
          example: FRGS Ruderbar
        sender_address:
          type: string
          format: email
          maxLength: 255
          description: Envelope sender. Empty means mail was never configured.
          example: bar@example.org
        reply_to_address:
          type: string
          format: email
          nullable: true
          maxLength: 255
          description: Where a reply goes — the Kassenwart, since a pre-notification invites one.
          example: kassenwart@example.org
        club_notification_address:
          type: string
          format: email
          nullable: true
          maxLength: 255
          description: |
            A club-level address — a Vorstand list, the Kassenwart's inbox —
            that also receives **admin lifecycle mail**: an account being
            created, and an account's roles changing (ADR-0044 rule 3).

            *In addition to* every active `admin` account, never instead of
            them. The point is a second pair of eyes: with exactly one admin, a
            notice about account creation otherwise travels from the person who
            acted to the same person, about something they just did — and is
            silent in precisely the case where that one account is the
            compromised one.

            It is also where an **unstaffed office's** mail goes (#633). Admin
            mail is addressed to the office that can open the screen it is
            about, and if no active account holds that office the notice is
            escalated here rather than widened back to every account. With this
            unset, such a notice reaches nobody and is logged as unreachable.

            `null` means unset, which is the previous behaviour exactly: the
            offices a kind is addressed to, no error.

            It lives here, on an `admin`-only endpoint, deliberately: a
            `kassenwart` must not be able to redirect the channel that would
            report their own promotion.
          example: vorstand@example.org
        header_style:
          type: string
          enum: [red, petrol, paper]
          description: Header band variant. `paper` is the settlement-mail default.
          example: paper
        footer_org_name:
          type: string
          maxLength: 200
          example: Ruderverein Beispiel e. V.
        footer_address_line:
          type: string
          nullable: true
          maxLength: 255
          example: Musterweg 35 · 60599 Frankfurt am Main
        website_url:
          type: string
          nullable: true
          maxLength: 255
          description: Public site URL; also the origin the mail webfonts are fetched from.
          example: https://www.example.org
        logo_url:
          type: string
          nullable: true
          maxLength: 255
          description: PNG only — Gmail and Outlook do not render SVG in mail.
        cron_interval:
          type: string
          enum: [fifteen_minutes, hourly, daily]
          description: |
            How often this installation's scheduler actually fires (ADR-0039
            decision 5). The retry ladder and both stall thresholds are measured
            in ticks of this interval, not in wall-clock minutes — the drain
            cannot act between ticks, so a backoff finer than the schedule
            describes a machine that does not exist.

            `fifteen_minutes` is what `bin/cron.php` recommends and what an
            external HTTP scheduler can actually deliver; a hosting panel's cron
            wizard usually cannot, which is why the coarser values exist.

            `weekly` is refused with 422: an announcement queued shortly after a
            weekly run leaves up to seven days later and would land on the
            collection date, taking the Nutzungsordnung § 7 Abs. 3 distance to
            zero.
          example: hourly
        drain_batch_size:
          type: integer
          minimum: 1
          maximum: 1000
          description: |
            Messages claimed per drain round. Lower it for a relay with a
            stricter per-connection limit; it does not make a run faster, since
            the transport is serial either way.
          example: 100
        drain_budget_seconds:
          type: integer
          minimum: 10
          maximum: 55
          description: |
            Wall-clock budget for one drain run. It must stay under the timeout
            of whatever triggers the run — a hosting panel's cron cap (IONOS:
            60s) or an external HTTP scheduler's request timeout (commonly 30s),
            neither of which is visible to this application.

            Overshooting is the expensive direction: a run killed mid-send
            leaves its rows claimed, and the stale window hands them to the next
            run, so a message that was already delivered goes out twice.
            Undershooting only means the next tick finishes the queue. The
            default is 25 for that reason.
          example: 25
        statement_cadence:
          type: string
          enum: ["off", "monthly", "quarterly"]
          description: |
            How often every member receives a Deckelauszug — a periodic
            statement of their tab, itemised, announcing nothing and collecting
            nothing (ADR-0039). Club-wide: there is deliberately no per-member
            opt-out, because this system has no member login and an opt-out
            would mean a public endpoint, a token and a preference record.

            `weekly` is absent by design. Nothing breaks at that cadence; it
            simply stops being predictable and starts being relentless, and a
            tab that settles monthly does not move fast enough to report on
            weekly.

            Migration 039 leaves every installation on `off`, so switching the
            statements on is always somebody's decision rather than a side
            effect of an upgrade.
        credit_limit_digest_cadence:
          type: string
          enum: ["off", "daily", "weekly", "monthly"]
          description: |
            How often admins and the Kassenwart receive the near-limit digest —
            one aggregate mail naming every member whose Deckel has reached the
            warning band, what they owe and the ceiling that applies to them
            (ADR-0047, migration 053). It is the push half of the dashboard's
            near-limit panel; members never receive it.

            `weekly` is present here and absent from `statement_cadence`
            because the audience differs: this reaches the handful of people
            who run the club, about a condition that changes inside a week.

            Nothing is queued when nobody is in the warning band, so silence
            means "nobody is near their ceiling" rather than "the scheduler has
            stopped". Migration 053 leaves a fresh or upgraded installation on
            `weekly`; see that migration for why this one defaults on where the
            statements default off.
          example: monthly
        is_complete:
          type: boolean
          readOnly: true
          description: Whether a sender address is set at all.
        can_send:
          type: boolean
          readOnly: true
          description: Both halves present — a usable transport and a sender address.
        transport:
          type: object
          readOnly: true
          description: State of `mail.dsn` from `config.php`. Never contains the DSN or its password.
          properties:
            configured:
              type: boolean
            valid:
              type: boolean
            summary:
              type: string
              example: smtp to mail.example.org:587
            error:
              type: string
              nullable: true
              description: Why the configured DSN is unusable, in a sentence an admin can act on.

    MailConfigUpdateRequest:
      type: object
      properties:
        sender_name:
          type: string
          maxLength: 120
        sender_address:
          type: string
          format: email
          maxLength: 255
        reply_to_address:
          type: string
          format: email
          nullable: true
          maxLength: 255
        club_notification_address:
          type: string
          format: email
          nullable: true
          maxLength: 255
          description: |
            The club-level address that also receives admin lifecycle mail
            (ADR-0044 rule 3). Send `null` to switch it off and return to
            mailing active admins only.
        header_style:
          type: string
          enum: [red, petrol, paper]
        footer_org_name:
          type: string
          maxLength: 200
        footer_address_line:
          type: string
          nullable: true
          maxLength: 255
        website_url:
          type: string
          nullable: true
          maxLength: 255
        logo_url:
          type: string
          nullable: true
          maxLength: 255
        cron_interval:
          type: string
          enum: [fifteen_minutes, hourly, daily]
          description: |
            `weekly` is rejected with 422 and a message naming Nutzungsordnung
            § 7 Abs. 3 — see the same field on `MailConfig`.
        drain_batch_size:
          type: integer
          minimum: 1
          maximum: 1000
        drain_budget_seconds:
          type: integer
          minimum: 10
          maximum: 55
          description: |
            Must stay under the trigger's own timeout — see the same field on
            `MailConfig`.
        statement_cadence:
          type: string
          enum: ["off", "monthly", "quarterly"]
          description: |
            The club-wide Deckelauszug switch — see the same field on
            `MailConfig`.
        credit_limit_digest_cadence:
          type: string
          enum: ["off", "daily", "weekly", "monthly"]
          description: |
            The club-wide near-limit digest switch — see the same field on
            `MailConfig`.

    SepaConfigUpdateRequest:
      type: object
      description: |
        `creditor_id` is deliberately absent: it is immutable after initial
        setup and is only accepted by `POST /admin/sepa-config`.
      properties:
        creditor_name:
          type: string
          maxLength: 70
        creditor_iban:
          type: string
          minLength: 15
          maxLength: 34
        creditor_address_street:
          type: string
          maxLength: 70
        creditor_address_city:
          type: string
          maxLength: 70
        creditor_address_country:
          type: string
          minLength: 2
          maxLength: 2
        payment_reference_prefix:
          type: string
          maxLength: 100
          description: Prefix of the payment reference shown on member bank statements
        mandate_template_url:
          type: string
          maxLength: 255
          nullable: true
          description: The externally hosted registration form a new member signs (#360)

    # --------------------------------------------------------------------------
    # Admin Users
    # --------------------------------------------------------------------------
    AdminUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        roles:
          type: array
          description: |
            The roles this account holds (ADR-0044). Always at least one — an
            account with no role can reach nothing, so the API refuses to
            create that state.
          items:
            $ref: '#/components/schemas/AdminRole'
          example: [admin]
        email:
          type: string
          format: email
        display_name:
          type: string
        locale:
          type: string
        is_active:
          type: boolean
        last_login_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        invitation_pending:
          type: boolean
          description: |
            Whether this account is still waiting on the invitation that gives
            it a password (migration 058) — invited, never accepted.

            Absent when the endpoint did not resolve it: the write endpoints
            return the row they just wrote without asking about invitations,
            and reporting `false` there would be wrong for the one moment an
            account certainly is pending. The list and detail endpoints always
            carry it. An account predating invitations is not pending; the way
            back into one of those is a password reset.

    AdminUserWithPassword:
      allOf:
        - $ref: '#/components/schemas/AdminUser'
        - type: object
          properties:
            password:
              type: string
              description: Generated password (shown once)

    AdminInvitation:
      type: object
      description: >
        A one-time link that lets a newly created admin set their own password
        (migration 058).
      properties:
        admin_user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          description: The address the link was mailed to.
        expires_at:
          type: string
          format: date-time
          description: After this instant the link no longer works.
        url:
          type: string
          format: uri
          description: >
            The absolute link, present only in the response to the request that
            minted it. There is no way to ask for it again — the token is stored
            hashed, and sealed only for the mail that carries it.
          example: https://club.example.org/invite/9pQ2b0kZ...

    AdminUserWithInvitation:
      type: object
      properties:
        admin:
          $ref: '#/components/schemas/AdminUser'
        invitation:
          $ref: '#/components/schemas/AdminInvitation'

    InvitationToken:
      type: string
      description: >
        The one-time token from the invitation link, carried in the body rather
        than in the URL: the browser reads it out of the link's fragment, which
        is the one part of a URL that never leaves the machine.
      example: 8Kq2mS1pXv0dR7bH-nLzT4wYcE6jA9uGfIoP3aQrZsM

    InvitationInvitee:
      type: object
      description: >
        Everything an unauthenticated holder of a valid token is told: the
        account's own address, name, locale and roles. No club detail, no other
        account, nothing about who issued the invitation.
      properties:
        email:
          type: string
          format: email
          description: The address this account will sign in with.
        display_name:
          type: string
        locale:
          type: string
        roles:
          type: array
          description: >
            The roles this account holds (ADR-0044) — its own, never anybody
            else's. Present so the accept page can say what somebody is being
            onboarded *as* before asking them to set a credential: a
            Getränkewart told only that "an account was created for you" has to
            sign in and infer their job from which pages open.
          items:
            $ref: '#/components/schemas/AdminRole'
          example: [getraenkewart]

    InvitationTokenRequest:
      type: object
      required: [token]
      properties:
        token:
          $ref: '#/components/schemas/InvitationToken'

    AcceptInvitationRequest:
      type: object
      required: [token, password, password_confirmation]
      properties:
        token:
          $ref: '#/components/schemas/InvitationToken'
        password:
          type: string
          minLength: 8
          description: >
            At least 8 characters, with a lower-case letter, an upper-case
            letter and a digit — the same rule as `PATCH /auth/change-password`.
        password_confirmation:
          type: string

    RegistrationRequest:
      description: >
        What a prospective member fills in. The field set is UC-A11's, minus
        everything an admin decides: no card UID (assigned later, and it is the
        card that welcomes them — UC-A67), and no mandate signature date, since
        nothing has been signed at submission time.
      type: object
      required: [secret, first_name, last_name, email, date_of_birth, preferred_language, iban]
      properties:
        secret:
          type: string
          description: >
            The poster secret, read by the page from the URL fragment and sent
            here in the body. Never named in a validation error: a 422 naming it
            would tell a prober the shape of what they are guessing.
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 255
          description: >
            Unverified, and nothing is sent to it. The welcome mail is earned by
            a card, not by a form (UC-A67 rule 1).
        phone:
          type: string
          maxLength: 20
          nullable: true
        date_of_birth:
          type: string
          format: date
          description: >
            Must not be in the future. Drives the Jugendschutz check once the
            member exists (ADR-0045), and the legal-representative line on the
            printed document when the applicant is a minor.
        preferred_language:
          type: string
          enum: [de, en, fr]
          description: >
            The language of the *page*. It selects no document: the club
            publishes one Anmeldung, in its own language (ADR-0052 decision 6).
        account_holder_name:
          type: string
          maxLength: 70
          nullable: true
          description: >
            The Kontoinhaber, when whoever signs the mandate is not the
            applicant — a parent paying for a child. When set, the printed
            signature block names the holder.
        iban:
          type: string
          maxLength: 34
          description: >
            Validated mod-97 and sealed under the club's active public key
            before it is stored. The server cannot read it back (ADR-0036).
        website:
          type: string
          description: >
            A honeypot. No person ever sees this field; a filled one is answered
            with an ordinary receipt and stored nowhere.

    PendingRegistration:
      description: >
        One pending submission as an admin may see it (ADR-0052, UC-A17).

        The sealed material is deliberately absent. `iban_ciphertext` is the
        IBAN itself, and `iban_fingerprint` is a stable identifier for a bank
        account — given it, anyone holding a candidate number can confirm this
        applicant banks there. Neither leaves the server; `iban_masked` is what
        the paper in the admin's hand shows too, and is exactly enough to check
        that the two match.
      type: object
      properties:
        id:
          type: string
          format: uuid
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        date_of_birth:
          type: string
          format: date
        preferred_language:
          type: string
          enum: [de, en, fr]
        account_holder_name:
          type: string
          nullable: true
        mandate_reference:
          type: string
          description: >
            Minted at submission, because it is printed on the paper the member
            signs (ADR-0006). Approval carries it to the mandate unchanged, so
            it is not editable here.
        iban_masked:
          type: string
          example: '****3000'
        iban_last4:
          type: string
        bank_name:
          type: string
          nullable: true
          description: Resolved from the BLZ at write time; a sealed row cannot answer this again.
        privacy_notice_url:
          type: string
          description: >
            The document this applicant was pointed at before entering anything.
            The club's evidence of what was shown — the document at that URL can
            change afterwards, which is why the moment is recorded separately.
        privacy_notice_shown_at:
          type: string
          format: date-time
        submitted_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: When the TTL purge deletes this row if nobody has acted on it.
        duplicate_email:
          type: boolean
          description: The club already has a member at this address.
        duplicate_iban:
          type: boolean
          description: >
            The club already holds an active mandate on this account, matched by
            keyed fingerprint — the one comparison answerable without a key.

    RegistrationUpdateRequest:
      description: >
        Corrections an admin may make before approving. Every field optional;
        only what is sent is validated, so a one-field fix is not a
        resubmission.
      type: object
      properties:
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 255
        phone:
          type: string
          maxLength: 20
          nullable: true
        date_of_birth:
          type: string
          format: date
        preferred_language:
          type: string
          enum: [de, en, fr]
        account_holder_name:
          type: string
          maxLength: 70
          nullable: true
        iban:
          type: string
          maxLength: 34
          description: >
            A replacement, not a field write: validated mod-97, then sealed
            under today's active key with a new last four, fingerprint and bank
            name. The four sealed columns move as one unit — a ciphertext
            labelled with a key that cannot open it is a row that is wrong the
            moment it is written and looks fine until a SEPA export needs the
            plaintext.

    RegistrationApprovalRequest:
      type: object
      required: [mandate_signed_at, signed_mandate_confirmed]
      properties:
        mandate_signed_at:
          type: string
          format: date
          description: >
            The date on the paper. Must not be in the future; today is the
            ordinary case, an admin approving at the desk.
        signed_mandate_confirmed:
          type: boolean
          description: >
            The attestation. Must be sent, and must be `true` for the approval
            to proceed: the admin is stating that they hold the signed SEPA
            mandate and that the IBAN on it matches `iban_masked`. Never a
            client-side default.

    SelfRegistrationSettings:
      type: object
      description: |
        The club's registration surface as the settings screen sees it (#783).
        Carries no secret material by construction — see
        `GET /admin/self-registration`.
      required: [enabled, disabled_reason, has_secret, secret_rotated_at, document_url, retention_days]
      properties:
        enabled:
          type: boolean
          description: Whether the public page accepts submissions right now.
        disabled_reason:
          type: string
          nullable: true
          description: |
            The club's own words, shown on the public page when `enabled` is
            false. Null while registration is on.
          example: Wir pausieren die Anmeldung bis zur Mitgliederversammlung am 14.03.
        has_secret:
          type: boolean
          description: |
            Whether a poster secret exists. The secret itself never appears
            here; this is what lets the screen say "a poster exists".
        secret_rotated_at:
          type: string
          format: date-time
          nullable: true
          description: When the current secret was minted — the poster's age.
        document_url:
          type: string
          nullable: true
          description: |
            The club's published Anmeldung, linked before any data is entered
            (ADR-0052 decision 6) and used as the template the review print
            fills. Validated at save time, not at print time.
          example: https://frgs.example/dokumente/anmeldung-vereinsbar.pdf
        retention_days:
          type: integer
          description: |
            How long an unapproved submission survives before the purge tick
            deletes it. Not a credential and not audited — a retention window
            is a setting, not an act of authority.
          example: 30

    SelfRegistrationUpdateRequest:
      type: object
      description: |
        Only the fields present are touched. An absent field is not "clear it".
      properties:
        enabled:
          type: boolean
          description: |
            Switching on requires a poster secret and a usable document;
            switching off requires `disabled_reason`.
        disabled_reason:
          type: string
          nullable: true
          maxLength: 500
          description: |
            Required when `enabled` is false. Trimmed, and cleared automatically
            when registration is switched back on — a stale "we paused for the
            AGM" left on a live surface is worse than none.
        document_url:
          type: string
          nullable: true
          maxLength: 500
          description: |
            Fetched and checked before it is stored. An empty string clears it,
            which also switches the club off: there is nothing left to show an
            applicant before they type.

    AdminUserCreateRequest:
      description: >
        Creating an admin user mints a persistent peer account, so it carries a
        step-up credential (#499). Since ADR-0044 that account's power is its
        role set rather than "everything" — but the default is still `admin`,
        so an omitted `roles` creates exactly what this endpoint always created.
      allOf:
        - $ref: '#/components/schemas/StepUpCredentials'
        - type: object
          required: [email, display_name]
          properties:
            email:
              type: string
              format: email
            display_name:
              type: string
              maxLength: 100
            locale:
              type: string
              default: de
            roles:
              type: array
              minItems: 1
              description: |
                The new account's roles. Defaults to `[admin]` when omitted. A
                list naming anything that is not a role, or an empty list, is
                refused rather than partially applied.
              items:
                $ref: '#/components/schemas/AdminRole'
              example: [kassenwart]

    # --------------------------------------------------------------------------
    # Reports & Dashboard
    # --------------------------------------------------------------------------
    Dashboard:
      type: object
      properties:
        metrics:
          type: object
          properties:
            active_members:
              type: integer
            outstanding_balance_cents:
              type: integer
            today_revenue_cents:
              type: integer
            terminal_status:
              type: string
              enum: [online, offline, unknown]
            last_sync_at:
              type: string
              format: date-time
              nullable: true
        alerts:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              severity:
                type: string
                enum: [info, warning, error]
              count:
                type: integer
              message:
                type: string
        recent_transactions:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              timestamp:
                type: string
                format: date-time
              member_name:
                type: string
              product_name:
                type: string
              amount_cents:
                type: integer
        system_status:
          type: object
          properties:
            pending_syncs:
              type: integer
            last_settlement_date:
              type: string
              format: date
              nullable: true

    Report:
      type: object
      properties:
        metadata:
          type: object
          properties:
            report_type:
              type: string
            generated_at:
              type: string
              format: date-time
            filters:
              type: object
              description: Echoes the non-empty request filters back (date_from, date_to, group_by, category_ids, product_ids)
              properties:
                date_from:
                  type: string
                  format: date
                date_to:
                  type: string
                  format: date
                group_by:
                  type: string
                  enum: [category, product, member, day, week, month, year]
                category_ids:
                  type: string
                product_ids:
                  type: string
        summary:
          type: object
          properties:
            total_revenue_cents:
              type: integer
            unique_member_count:
              type: integer
            transaction_count:
              type: integer
            avg_transaction_cents:
              type: integer
        data:
          type: array
          items:
            type: object
            properties:
              dimension:
                type: string
                nullable: true
                description: |
                  The group's name — a product, a category, a member, or the
                  date bucket itself.

                  **Null when the group has no name.** A terminal may upload a
                  sale whose `product_id` resolves to nothing (ADR-0033 §1: the
                  drink was poured against a cached catalogue, and refusing the
                  row would lose the record of a sale that happened), and such a
                  sale still belongs in the revenue it produced. The API does
                  not invent a placeholder word for it: it is language-agnostic,
                  so the label an admin reads is the client's to choose.
                example: Helles
              dimension_id:
                type: string
                nullable: true
                description: |
                  The id this group keys on — the product, category or member.
                  Null for the date groupings (`day`, `week`, `month`, `year`),
                  which key on a derived value rather than an entity.

                  Present even when `dimension` is null, and that is the point:
                  it is what tells two nameless groups apart. Rows are grouped
                  by this id, so two sales naming different missing products
                  stay two rows rather than merging into one.
                example: 33333331-3333-3333-3333-333333333331
              revenue_cents:
                type: integer
              count:
                type: integer
              percent_of_total:
                type: number
        pagination:
          $ref: '#/components/schemas/Pagination'

    TerminalActivityReport:
      type: object
      properties:
        sessions:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              start_time:
                type: string
              end_time:
                type: string
              transaction_count:
                type: integer
              revenue_cents:
                type: integer
        hourly_distribution:
          type: array
          items:
            type: object
            properties:
              hour:
                type: integer
                minimum: 0
                maximum: 23
              transaction_count:
                type: integer
        terminals:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              transaction_count:
                type: integer

    # --------------------------------------------------------------------------
