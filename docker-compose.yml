# Club Bar - Development Environment
# Usage: docker-compose up -d

services:
  # =============================================================================
  # Database - MariaDB
  # =============================================================================
  database:
    image: mariadb:10.11
    container_name: clubbar-db
    restart: unless-stopped
    platform: linux/arm64
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: clubbar
      MYSQL_USER: clubbar
      MYSQL_PASSWORD: clubbar
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # Backend - PHP 8.3 + Apache (Slim 4, code mounted)
  # Setup: cd backend && composer install && cd ..
  # Start:  UID=$(id -u) GID=$(id -g) docker compose up -d
  # =============================================================================
  backend:
    image: webdevops/php-apache:8.3
    platform: linux/amd64
    container_name: clubbar-backend
    restart: unless-stopped
    environment:
      PUID: ${UID:-1000}
      PGID: ${GID:-1000}
      # Apache Configuration
      WEB_DOCUMENT_ROOT: /app/public
      SSL_MODE: "off"

      # PHP Configuration
      PHP_MEMORY_LIMIT: "256M"
      PHP_MAX_EXECUTION_TIME: "99"
      PHP_UPLOAD_MAX_FILE_SIZE: "100M"
      PHP_POST_MAX_SIZE: "100M"
      PHP_OPCACHE_ENABLE: "0"  # Disabled for development

      # Application Configuration
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080

      # Database Configuration
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: clubbar
      DB_USER: clubbar
      DB_PASS: clubbar

      # Session & Auth
      SESSION_MAX_AGE: 7200
      SESSION_REGEN_INTERVAL: 900
      API_TOKEN_TTL_DAYS: 90

      # CORS
      CORS_ORIGINS: "*"

      # Installation
      INSTALL_KEY: dev-install-key
    ports:
      - "8080:80"
    volumes:
      - ./backend:/app
      - ./docker/apache-slim.conf:/opt/docker/etc/httpd/vhost.common.d/01-slim.conf:ro
    depends_on:
      database:
        condition: service_healthy

  # =============================================================================
  # Admin Frontend - React + Apache (production-like, mass hoster compatible)
  # =============================================================================
  admin-frontend:
    build:
      context: .
      dockerfile: docker/admin-frontend.Dockerfile
    container_name: clubbar-admin
    restart: unless-stopped
    profiles:
      - frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  # =============================================================================
  # Terminal Frontend - React + Vite (dev server for web preview)
  # =============================================================================
  terminal-frontend:
    image: node:20-alpine
    container_name: clubbar-terminal
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    profiles:
      - frontend
    ports:
      - "5174:5174"
    volumes:
      - ./terminal:/app
      - terminal_node_modules:/app/node_modules
    depends_on:
      - backend

  # =============================================================================
  # E2E Tests - Playwright
  # =============================================================================
  e2etests:
    image: mcr.microsoft.com/playwright:v1.49.0-noble
    container_name: clubbar-e2etests
    working_dir: /app
    profiles:
      - test
    environment:
      API_URL: http://backend
      ADMIN_URL: http://admin-frontend
      TERMINAL_URL: http://terminal-frontend:5174
    volumes:
      - ./e2etests:/app
      - e2etests_node_modules:/app/node_modules
    depends_on:
      - backend
    command: sh -c "npm install && npx playwright test --project=api-tests"

volumes:
  db_data:
  terminal_node_modules:
  e2etests_node_modules:
