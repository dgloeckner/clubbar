# Ruderbar - Development Environment
# Usage: docker-compose up -d

services:
  # =============================================================================
  # Database - MariaDB
  # =============================================================================
  database:
    image: mariadb:10.11
    container_name: ruderbar-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ruderbar
      MYSQL_USER: ruderbar
      MYSQL_PASSWORD: ruderbar
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # Backend - PHP 8.3 + Laravel
  # =============================================================================
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: ruderbar-backend
    restart: unless-stopped
    environment:
      APP_ENV: local
      APP_DEBUG: true
      APP_KEY: base64:your-app-key-here-generate-with-artisan
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ruderbar
      DB_USERNAME: ruderbar
      DB_PASSWORD: ruderbar
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      database:
        condition: service_healthy

  # =============================================================================
  # Admin Frontend - React + Apache (production-like, mass hoster compatible)
  # =============================================================================
  admin-frontend:
    build:
      context: .
      dockerfile: docker/admin-frontend.Dockerfile
    container_name: ruderbar-admin
    restart: unless-stopped
    profiles:
      - frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  # =============================================================================
  # Terminal Frontend - React + Vite (dev server for web preview)
  # =============================================================================
  terminal-frontend:
    image: node:20-alpine
    container_name: ruderbar-terminal
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    profiles:
      - frontend
    ports:
      - "5174:5174"
    volumes:
      - ./terminal:/app
      - terminal_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  db_data:
  terminal_node_modules:
