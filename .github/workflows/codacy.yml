# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow checks out code, performs a Codacy security scan
# and integrates the results with the
# GitHub Advanced Security code scanning feature.  For more information on
# the Codacy security scan action usage and parameters, see
# https://github.com/codacy/codacy-analysis-cli-action.
# For more information on Codacy Analysis CLI in general, see
# https://github.com/codacy/codacy-analysis-cli.

name: Codacy Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '26 11 * * 5'

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Execute Codacy Analysis CLI and generate a SARIF output with the security issues identified during the analysis
      # The scan is scoped by .codacy.yaml in the repository root -- without a
      # project token the CLI has no server-side configuration and would otherwise
      # run every default tool over every file in the checkout.
      - name: Run Codacy Analysis CLI
        id: codacy
        # The CLI exits non-zero on its own internal errors as well as on findings.
        # Most notably its SARIF writer reads back every file it reports an issue
        # in and decodes it as UTF-8, so one finding in a file it cannot decode
        # aborts the run after the analysis, leaving no report behind. A crash in a
        # third-party scanner must not turn the branch red, so the step is allowed
        # to fail and the upload below is guarded on a usable report instead.
        continue-on-error: true
        uses: codacy/codacy-analysis-cli-action@d840f886c4bd4edc059706d09c6a1586111c540b
        with:
          # Check https://github.com/codacy/codacy-analysis-cli#project-token to get your project token from your Codacy repository
          # You can also omit the token and run the tools that support default configurations
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: results.sarif
          format: sarif
          # Adjust severity of non-security issues
          gh-code-scanning-compat: true
          # Force 0 exit code to allow SARIF file generation
          # This will handover control about PR rejection to the GitHub side
          max-allowed-issues: 2147483647

      # TEMPORARY (removed before merge): the SARIF writer names no file when it
      # fails to decode one. The JSON formatter reads no files, so re-running with
      # it yields the exact set of files Codacy reported issues in.
      - name: Diagnose unreadable SARIF report
        if: always() && steps.codacy.outcome == 'failure'
        run: |
          echo "--- working tree after the analysis (files tools left behind):"
          git status --porcelain=v1 -uall | head -50
          "$CLI_SCRIPT_PATH" analyze --format json --output results.json --max-allowed-issues 2147483647 || true
          jq -r '.[] | .filename? // empty' results.json | sort -u > issue-files.txt
          echo "--- $(wc -l < issue-files.txt) distinct files with issues"
          echo "--- issue files that are missing or not valid UTF-8:"
          while IFS= read -r f; do
            if [ ! -f "$f" ]; then echo "MISSING:  $f"
            elif ! iconv -f UTF-8 -t UTF-8 "$f" > /dev/null 2>&1; then echo "NON-UTF8: $f"
            fi
          done < issue-files.txt
          echo "--- issues per top-level directory:"
          cut -d/ -f1-2 issue-files.txt | sort | uniq -c | sort -rn | head -20

      # A crashed or interrupted run leaves the output file empty, which the upload
      # would reject as malformed SARIF. Report that as a warning instead.
      - name: Check SARIF report
        id: sarif
        if: always()
        run: |
          if [ -s results.sarif ] && jq -e '.runs' results.sarif > /dev/null 2>&1; then
            echo "usable=true" >> "$GITHUB_OUTPUT"
            echo "Codacy reported $(jq '[.runs[].results | length] | add // 0' results.sarif) results."
          else
            echo "usable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Codacy Analysis CLI produced no usable SARIF report - nothing to upload. See the analysis step above for the cause."
          fi

      # Upload the SARIF file generated in the previous step
      - name: Upload SARIF results file
        if: always() && steps.sarif.outputs.usable == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
