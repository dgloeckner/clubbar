# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow checks out code, performs a Codacy security scan
# and integrates the results with the
# GitHub Advanced Security code scanning feature.  For more information on
# the Codacy security scan action usage and parameters, see
# https://github.com/codacy/codacy-analysis-cli-action.
# For more information on Codacy Analysis CLI in general, see
# https://github.com/codacy/codacy-analysis-cli.

name: Codacy Security Scan

# The scan runs nightly against main, not on pushes or pull requests: a full
# Codacy run costs several minutes and its findings are repository-wide rather
# than diff-scoped, so it tells us nothing per-change that the nightly run does
# not report. workflow_dispatch keeps a manual run available on demand.
on:
  schedule:
    - cron: '26 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout code
        uses: actions/checkout@v7

      # Execute Codacy Analysis CLI and generate a JSON report of the issues identified during the analysis
      # The scan is scoped by .codacy.yaml in the repository root -- without a
      # project token the CLI has no server-side configuration and would otherwise
      # run every default tool over every file in the checkout.
      #
      # This asks for JSON rather than SARIF, and scripts/codacy_sarif.py converts
      # it, because the CLI's own SARIF writer reads back every file it reports an
      # issue in and its decoder throws on a multi-byte character that straddles
      # the 8192-byte read boundary -- taking the entire report with it. The JSON
      # formatter reads no files. See the script for the details.
      - name: Run Codacy Analysis CLI
        id: codacy
        # The CLI exits non-zero on its own internal errors as well as on findings.
        # A crash in a third-party scanner must not turn the branch red, so the
        # step is allowed to fail and the upload below is guarded on a usable
        # report instead.
        continue-on-error: true
        uses: codacy/codacy-analysis-cli-action@562ee3e92b8e92df8b67e0a5ff8aa8e261919c08
        with:
          # Check https://github.com/codacy/codacy-analysis-cli#project-token to get your project token from your Codacy repository
          # You can also omit the token and run the tools that support default configurations
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: results.json
          format: json
          # Force 0 exit code to allow report generation
          # This will handover control about PR rejection to the GitHub side
          max-allowed-issues: 2147483647

      # gh-code-scanning-compat lives in the CLI's SARIF writer, which this
      # workflow no longer uses; the severity mapping is in the converter.
      - name: Convert the Codacy report to SARIF
        id: sarif
        if: always()
        run: |
          if [ ! -s results.json ]; then
            echo "::warning::Codacy Analysis CLI produced no report - nothing to upload. See the analysis step above for the cause."
          elif python3 scripts/codacy_sarif.py results.json results.sarif; then
            echo "usable=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Could not convert the Codacy report to SARIF - nothing to upload."
          fi

      # Upload the SARIF file generated in the previous step
      - name: Upload SARIF results file
        if: always() && steps.sarif.outputs.usable == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
