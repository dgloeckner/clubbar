name: Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-terminal:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop
        working-directory: terminal-frontend

      - name: Get dependencies
        run: flutter pub get
        working-directory: terminal-frontend

      - name: Build Linux ARM64
        run: flutter build linux --release
        working-directory: terminal-frontend

      - name: Package artifact
        working-directory: terminal-frontend
        run: |
          cd build/linux/arm64/release/bundle
          tar -czf "$GITHUB_WORKSPACE/flutter-app-linux-arm64-${{ github.event.release.tag_name }}.tar.gz" .

      - name: Upload terminal app to release
        uses: softprops/action-gh-release@v2
        with:
          files: terminal-frontend/flutter-app-linux-arm64-${{ github.event.release.tag_name }}.tar.gz