name: Scheduled failure issue

# Turns a red scheduled workflow into an open GitHub issue, and closes that
# issue when the workflow goes green again.
#
# Why: a scheduled workflow that fails has no PR to turn red, and nobody is
# watching the Actions tab on a Monday morning. `mirror-images.yaml` failed
# **9 runs over 15 days** before anyone noticed (#696 item 2) — and the thing it
# exists to provide, a fallback for when Docker Hub answers 429, was therefore
# missing on the one day it was needed. ADR-0038 rule 6 names this failure class
# for the mail queue: a stalled queue silently erodes the very thing the feature
# exists to promise. This applies it to CI.
#
# An issue, rather than an email: email is what already existed and is what went
# unread. The issue list is where this repo's work is triaged, it carries
# `owner-action` so it sorts with the rest of the owner's queue, and it cannot be
# archived by accident without someone deciding to close it.
#
# Self-closing matters as much as opening. A notification that stays after the
# problem is fixed trains its reader to ignore it — which is how the original
# failure went unread. The issue is closed by the first green run, so an open one
# always means "broken right now". That also covers the delayed variant of the
# same trap: if the mirror is authenticated with a `GHCR_TOKEN` PAT rather than
# by linking the packages, the token expires months later and reintroduces
# exactly this silent failure — this reopens the issue when it does.
#
# Usage from a scheduled workflow:
#
#     jobs:
#       mirror:
#         ...
#       report:
#         needs: [mirror]
#         if: always() && github.event_name == 'schedule'
#         uses: ./.github/workflows/scheduled-failure-issue.yaml
#         with:
#           workflow-name: Mirror images
#           succeeded: ${{ needs.mirror.result == 'success' }}
#         permissions:
#           issues: write

on:
  workflow_call:
    inputs:
      workflow-name:
        description: Human-readable name, used in the issue title.
        type: string
        required: true
      succeeded:
        description: Whether the workflow's real job succeeded.
        type: boolean
        required: true

permissions:
  issues: write

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - name: Open, refresh or close the failure issue
        env:
          # `gh` is preinstalled on GitHub-hosted runners, so this needs no
          # third-party action and nothing to SHA-pin.
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ inputs.workflow-name }}
          SUCCEEDED: ${{ inputs.succeeded }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          title="Scheduled workflow failing: ${WORKFLOW}"
          footer=$'\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_'

          # Match on the exact title so repeated failures reuse one issue
          # instead of opening a new one every week.
          existing=$(gh issue list --repo "$REPO" --state open --search "\"$title\" in:title" \
                       --json number,title \
                       --jq "[.[] | select(.title == \"$title\") | .number] | first // empty")

          if [ "$SUCCEEDED" = "true" ]; then
            if [ -n "$existing" ]; then
              echo "Recovered — closing #$existing"
              gh issue close "$existing" --repo "$REPO" \
                --comment "Green again as of [this run](${RUN_URL}).${footer}"
            else
              echo "Succeeded, nothing open. Nothing to do."
            fi
            exit 0
          fi

          if [ -n "$existing" ]; then
            echo "Still failing — commenting on #$existing"
            gh issue comment "$existing" --repo "$REPO" \
              --body "Still failing: [run](${RUN_URL}).${footer}"
            exit 0
          fi

          echo "Newly failing — opening an issue"
          gh issue create --repo "$REPO" --title "$title" \
            --label "owner-action" --label "priority: high" --label "tech-debt" \
            --body "\`${WORKFLOW}\` failed on its schedule.

          Failing run: ${RUN_URL}

          This issue was opened automatically because a scheduled workflow has no
          pull request to turn red. It closes itself on the next green run, so an
          open one means it is still broken.${footer}"
