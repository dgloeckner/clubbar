# CodeQL configuration for Club Bar.
#
# Scanned languages are scoped to what actually carries first-party logic:
#   - javascript-typescript: admin-frontend (React SPA) and e2etests (Playwright)
#   - python: the terminal-frontend/scripts/ kiosk helpers (blackscreen.py,
#             screen-idle.py)
#   - actions: this repo's own GitHub Actions workflows
#
# Not scanned, and not omitted by oversight:
#   - PHP (backend/, the majority of the codebase) — CodeQL has no PHP extractor.
#   - Dart (terminal-frontend/lib/, the terminal app's actual logic) — CodeQL has
#     no Dart extractor.
#   - swift / c-cpp: terminal-frontend's linux/ and macos/ directories only hold
#     Flutter's generated desktop-embedding boilerplate (AppDelegate.swift,
#     generated_plugin_registrant.cc, my_application.cc, ...); there is no
#     first-party Swift or C/C++ to analyze, and Swift would otherwise force a
#     macos-latest runner + autobuild for no security benefit.
name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '34 11 * * 3'

# Nothing at workflow level; each job asks for exactly what it needs, as
# build.yaml and osv-scanner.yaml already do.
permissions: {}

# Superseded runs on the same branch are pointless — cancel them, the same way
# build.yaml does and for the same reason. main is exempt: its result is the
# alert set shown in the Security tab, and cancelling that halfway leaves the
# branch's findings stale rather than merely re-computed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: javascript-typescript
          build-mode: none
        # No Python lane: the repo's last two .py files were the screen-blanking
        # workaround, removed in #763. CodeQL fails a language with no source
        # ("could not process any code written in Python"), so an empty lane is
        # a red build, not a clean one. Restore this entry if Python returns.
    steps:
    # Every `uses:` below is pinned to a commit SHA, not a floating major tag.
    # This file arrived from GitHub's template after #646/#647 had already
    # SHA-pinned the rest of the repository, so it was the only workflow left
    # resolving a tag at run time — and a tag is mutable by whoever owns it.
    # Dependabot's github-actions ecosystem keeps these current.
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@a35ac6e6798d72df5475948b28efb89edc2e19ca # v4.37.9
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        # security-extended adds broader coverage (e.g. additional injection,
        # crypto and data-flow checks) than the default query pack, which is
        # worth the extra runtime given this project handles member PII and
        # SEPA/financial data.
        queries: security-extended

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@a35ac6e6798d72df5475948b28efb89edc2e19ca # v4.37.9
      with:
        category: "/language:${{matrix.language}}"
