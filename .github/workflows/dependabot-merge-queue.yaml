name: Dependabot merge queue

# Merges Dependabot's pull requests once — and only once — their build is green,
# one at a time, without anybody clicking Merge.
#
# Why: a dependency bump's review *is* the build. On the morning this was
# written thirteen pull requests were open, eleven of them Dependabot's, and one
# of those was a Slim security release (GHSA-h377-p8x2-prf9) that had been green
# since 03:10 and unmerged. Nothing was wrong with it; it was simply waiting for
# a person. That wait is not free — an unmerged bump drifts behind main until it
# conflicts, and by then the cheap merge has become work somebody has to
# schedule.
#
# The queue's policy, and everything it refuses to touch, lives in
# `e2etests/scripts/dependabot-queue.mjs` next to the tests that hold it: patch
# and minor only, nothing labelled `blocked-upstream` or `do-not-merge`, nothing
# red, pending, conflicted or draft, and never a commit the Build workflow did
# not actually run on.
#
# One merge per run, by design. The moment one lands, every other pull request's
# green refers to a main that no longer exists, so the next run re-reads the
# world rather than trusting a batch decision. That is the difference between a
# queue and a bulk merge. It is not slow, because a merge wakes the next round
# itself — see the triggers below — so the backlog drains at the pace of the
# build rather than of the clock.
#
# ---------------------------------------------------------------------------
# MERGE_QUEUE_TOKEN — read this before wondering why nothing merges
# ---------------------------------------------------------------------------
#
# `GITHUB_TOKEN` is enough to *decide*, but it is a poor merger, for two reasons
# that are properties of GitHub rather than of this workflow:
#
#   1. **It cannot satisfy a code-owner review.** `main` is protected and
#      `.github/CODEOWNERS` claims every path, so a green Dependabot pull
#      request sits at `mergeable_state: blocked` until somebody with review
#      rights approves it. The queue does approve before merging, but as
#      `github-actions[bot]` — which counts for a plain "1 approval" rule and
#      does *not* count for "require review from Code Owners". If your merges
#      come back refused, the comment the queue leaves on the pull request says
#      exactly which rule refused it.
#   2. **A push it makes starts no workflow.** GitHub suppresses that to avoid
#      recursion, so a merge to main made with `GITHUB_TOKEN` never runs Build,
#      and therefore never deploys to Integration. The queue works around it by
#      dispatching Build itself (dispatch is the documented exception), which is
#      why `build.yaml` carries a `workflow_dispatch` trigger — but a dispatched
#      run is a second-best copy of the run the push should have produced.
#
# Both disappear with a token that belongs to a person or a GitHub App:
#
#     Settings -> Secrets and variables -> Actions -> New repository secret
#       Name:  MERGE_QUEUE_TOKEN
#       Value: a fine-grained PAT on this repository with
#              Contents: read and write, Pull requests: read and write
#
# Nothing else changes: the workflow picks the secret up when it is there and
# falls back to `GITHUB_TOKEN` when it is not.
#
# ---------------------------------------------------------------------------
#
# To stop the queue entirely, disable this workflow in the Actions tab. To take
# a single pull request out of it, label it `do-not-merge`.

on:
  # Off the hour: scheduled workflows queue behind everyone else's :00 cron.
  #
  # This is the queue's slowest wake-up, not its only one, and deliberately so.
  # GitHub runs `schedule` on a best-effort queue that it drops under load: the
  # first two rounds after this workflow landed (17:37 and 18:07) never ran at
  # all. A queue whose only clock is that one is a queue that stops without
  # anything looking broken — the workflow stays `active`, no run turns red, and
  # the pull requests simply sit there. The two event triggers below are what
  # make it self-driving; the cron is the floor under them.
  schedule:
    - cron: '7,37 * * * *'

  # Something landed on the base branch — take the next round now. This is the
  # ordinary case: a person merges, and the queue reconsiders immediately
  # instead of at the next half hour.
  push:
    branches:
      - main

  # Two different wake-ups share this trigger:
  #
  #   * a build on a `dependabot/*` branch — a pull request may have just gone
  #     green, or come back green after Dependabot rebased it;
  #   * a build on `main` — which is how the queue chains. Its own merge push is
  #     made with GITHUB_TOKEN and therefore starts nothing (see the header), so
  #     the run it dispatches instead is the only signal that the merge
  #     happened. Without `main` here, the queue merges once per cron round and
  #     no faster.
  #
  # Anything else — every feature branch in the repository — is filtered out by
  # the job's `if` rather than here, because `workflow_run` takes no branch
  # filter.
  workflow_run:
    workflows: [Build]
    types: [completed]

  workflow_dispatch:
    inputs:
      dry-run:
        description: Report what the queue would do, and do none of it.
        type: boolean
        default: false

# One queue. Two runs merging at once is the batch behaviour this exists to
# avoid, and cancelling a run mid-merge is worse than making it wait.
concurrency:
  group: dependabot-merge-queue
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  queue:
    if: >-
      github.event_name != 'workflow_run'
      || startsWith(github.event.workflow_run.head_branch, 'dependabot/')
      || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Merging is a push to the base branch; approving and commenting are
      # pull-request writes; `actions: write` is only for the Build dispatch
      # that stands in for the push GITHUB_TOKEN cannot make.
      contents: write
      pull-requests: write
      actions: write

    steps:
      # Schedule, dispatch and workflow_run all check out the default branch, so
      # the queue always runs main's copy of its own policy — never a version of
      # it that came in on the pull request being judged.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # No `npm ci`: the script imports nothing outside Node's standard library
      # and talks to GitHub through `gh`, which is preinstalled on the runner.
      # That keeps a workflow with `contents: write` from executing a dependency
      # tree it has not audited.
      - name: Work the queue
        env:
          GH_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN || github.token }}
          # The script needs to know which of the two it got: only the fallback
          # has to dispatch Build after a merge.
          TOKEN_KIND: ${{ secrets.MERGE_QUEUE_TOKEN && 'merge-queue-token' || 'github-token' }}
          DRY_RUN: ${{ inputs.dry-run || 'false' }}
          BASE_BRANCH: main
          # Strict mode: require a pull request's green build to have run on a
          # head that already contains main's tip, updating the branch first
          # when it does not. Off by default because it costs a full CI run per
          # merge and, without MERGE_QUEUE_TOKEN, the update pushes a commit
          # that starts no build — the queue would then wait forever for checks
          # that cannot appear. Turn it on together with the token.
          REQUIRE_UP_TO_DATE: 'false'
        run: node e2etests/scripts/dependabot-queue.mjs
