name: Deploy to Production

# Manual, release-selectable deployment of the backend + admin frontend to the
# production IONOS site. They ship as one artifact: build-package.sh bakes the
# Vite build into the release ZIP, so there is nothing to deploy separately.
#
# The mechanism is the one deploy-integration uses — upload one ZIP over SFTP,
# unpack it server-side via upgrade.php, run migrations over HTTP — because
# IONOS shared hosting gives us no shell. See #320.
#
# What differs from integration, deliberately:
#   * manual dispatch + a required reviewer on the ionos-production environment
#   * the artifact comes from a *release*, not a CI run, so we ship the exact
#     bytes test-package smoke-tested
#   * no force=1 on extract, so deploying an older tag fails with a clean 409
#     instead of silently rolling code back underneath a newer schema
#   * the upgrade secret is generated per run and never stored (see below)
#   * install.php is deleted afterwards — extract re-creates it every time

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release tag to deploy, or "latest"'
        default: 'latest'
        required: true
      confirm:
        description: 'Type the production hostname to confirm'
        required: true

permissions:
  contents: read

# Never two production deploys at once, and never cancel one half-way: the
# window between "files extracted" and "migrations applied" must close.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ionos-production

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SITE_URL: ${{ vars.SITE_URL }}
      SFTP_HOST: ${{ vars.IONOS_SFTP_HOST }}
      SFTP_USER: ${{ secrets.SFTP_USER }}
      SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}

    steps:
      # ---------------------------------------------------------------------
      # Everything that can fail cheaply fails here, before a single byte is
      # uploaded. A half-uploaded production site is the outcome to avoid.
      # ---------------------------------------------------------------------
      - name: Check the confirmation input
        run: |
          HOST="$(echo "$SITE_URL" | sed -E 's#^https?://##; s#/.*$##')"
          if [ "${{ inputs.confirm }}" != "$HOST" ]; then
            echo "::error::Confirmation mismatch. Expected the production hostname ($HOST)."
            exit 1
          fi
          echo "Target: $HOST"

      - name: Resolve the release tag
        run: |
          set -euo pipefail
          if [ "${{ inputs.release }}" = "latest" ]; then
            # NOT `gh release view` and NOT /releases/latest: every release so
            # far is a pre-release, and GitHub's "latest" excludes those — the
            # bare command returns "release not found". Newest by creation date
            # across all releases is what we actually mean.
            TAG="$(gh release list --limit 100 --json tagName,createdAt \
                    --jq 'sort_by(.createdAt) | reverse | .[0].tagName')"
          else
            TAG="${{ inputs.release }}"
          fi

          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::Could not resolve a release tag."
            exit 1
          fi

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG does not exist."
            exit 1
          fi

          # Exactly one, not head -1: releases also carry a terminal tarball,
          # and silently picking the first match is how you deploy the wrong file.
          ASSETS="$(gh release view "$TAG" --json assets \
                     --jq '[.assets[].name | select(endswith(".zip")) | select(startswith("clubbar-terminal") | not)] | join(" ")')"
          COUNT="$(echo "$ASSETS" | wc -w)"
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::Expected exactly one package ZIP on $TAG, found $COUNT: $ASSETS"
            exit 1
          fi

          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "ASSET=$ASSETS" >> "$GITHUB_ENV"
          echo "Resolved: $TAG ($ASSETS)"

      - name: Announce the deployment
        run: |
          {
            echo "## Deploying \`$TAG\` to production"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Release | \`$TAG\` |"
            echo "| Asset | \`$ASSET\` |"
            echo "| Target | $SITE_URL |"
            echo
            echo "> **No database backup is taken automatically.** Shared hosting gives us no"
            echo "> shell, so a pre-migration dump has to be made by hand. If this release"
            echo "> carries a migration that drops or alters a column, back up first."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download the release package
        run: |
          set -euo pipefail
          mkdir -p dist/download
          gh release download "$TAG" --pattern "$ASSET" --dir dist/download
          ls -la dist/download/

      - name: Stage the upload
        run: |
          set -euo pipefail
          mkdir -p dist/upload
          cp "dist/download/$ASSET" dist/upload/.upgrade-package.zip

          # The upgrade secret is generated per run and never stored as a GitHub
          # secret. Nothing on the server pre-shares it: CI *uploads*
          # .upgrade-secret, and upgrade.php compares the request key against
          # whatever that file holds. So there is no long-lived credential
          # pointing at a live migration trigger, and nothing to rotate. A run
          # that dies between upload and migrate leaves a value nobody knows,
          # which the next run overwrites.
          SECRET="$(openssl rand -hex 16)"
          echo "::add-mask::$SECRET"
          echo "UPGRADE_SECRET=$SECRET" >> "$GITHUB_ENV"
          printf '%s' "$SECRET" > dist/upload/.upgrade-secret

          # upgrade.php has to travel next to the ZIP: on a server whose current
          # install predates it, there is nothing to run. It bootstraps the two
          # Shared classes it needs straight out of the ZIP.
          unzip -o "dist/download/$ASSET" upgrade.php -d dist/upload/
          ls -la dist/upload/

      - name: Install lftp
        run: sudo apt-get install -y lftp

      # No `cd`: the production SFTP account's login root *is* its document
      # root, verified during the manual install (#320). Integration works the
      # same way with its own account on the same host.
      - name: Upload via SFTP
        timeout-minutes: 5
        run: |
          set -euo pipefail
          echo "Uploading $(du -h dist/upload/.upgrade-package.zip | cut -f1) ZIP..."
          lftp -u "$SFTP_USER,$SFTP_PASSWORD" "sftp://$SFTP_HOST:22" << 'LFTP'
          set sftp:auto-confirm yes
          set net:timeout 30
          set net:max-retries 3
          set net:reconnect-interval-base 5
          # Without this a failed `put` prints its error, lftp carries on to the
          # next command and exits 0 — an upload step that goes green having
          # transferred nothing.
          set cmd:fail-exit yes
          put dist/upload/upgrade.php
          put dist/upload/.upgrade-package.zip
          put dist/upload/.upgrade-secret
          bye
          LFTP

      # Deliberately no force=1 (integration uses it). upgrade.php compares the
      # ZIP's package.json version against the installed one and answers 409 on
      # a downgrade — which is exactly what we want production to do when
      # someone dispatches an older tag by mistake.
      - name: Extract on the server
        timeout-minutes: 3
        run: |
          set -euo pipefail
          RESPONSE="$(curl -sS --max-time 180 -w '\n%{http_code}' \
            "$SITE_URL/upgrade.php?key=$UPGRADE_SECRET&action=extract")"
          CODE="$(echo "$RESPONSE" | tail -n 1)"
          BODY="$(echo "$RESPONSE" | sed '$d')"
          echo "$BODY" | jq . || echo "$BODY"

          if [ "$CODE" = "409" ]; then
            echo "::error::Downgrade refused by the server. Deploy a newer tag, or restore from backup first."
            exit 1
          fi
          if [ "$CODE" != "200" ] || [ "$(echo "$BODY" | jq -r '.ok')" != "true" ]; then
            echo "::error::Extract failed (HTTP $CODE)."
            exit 1
          fi

      - name: Run migrations
        timeout-minutes: 3
        run: |
          set -euo pipefail
          # This call self-destructs upgrade.php and .upgrade-secret on the way out.
          RESPONSE="$(curl -sS --max-time 180 -w '\n%{http_code}' \
            "$SITE_URL/upgrade.php?key=$UPGRADE_SECRET")"
          CODE="$(echo "$RESPONSE" | tail -n 1)"
          BODY="$(echo "$RESPONSE" | sed '$d')"
          echo "$BODY" | jq . || echo "$BODY"

          if [ "$CODE" != "200" ] || [ "$(echo "$BODY" | jq -r '.ok')" != "true" ]; then
            echo "::error::Migrations failed (HTTP $CODE). Files are already extracted — inspect before retrying."
            exit 1
          fi

      # Extract re-creates install.php from the package every single time, and
      # docs/deployment.md tells operators to delete it after installing. It has
      # to run after migrate, or extract would simply put it back.
      - name: Remove the installer
        run: |
          set -euo pipefail
          lftp -u "$SFTP_USER,$SFTP_PASSWORD" "sftp://$SFTP_HOST:22" << 'LFTP'
          set sftp:auto-confirm yes
          rm -f install.php
          rm -f install.js
          bye
          LFTP

      - name: Verify the deployment
        run: |
          set -euo pipefail
          HEALTH="$(curl -sS --max-time 60 "$SITE_URL/api/health")"
          echo "$HEALTH" | jq .

          STATUS="$(echo "$HEALTH" | jq -r '.status')"
          LIVE="$(echo "$HEALTH" | jq -r '.version')"

          if [ "$STATUS" != "ok" ]; then
            echo "::error::Health check reports status=$STATUS"
            exit 1
          fi
          # The version assertion. backend/VERSION is written from the release
          # tag at package time and read back by HealthCheckService, so this
          # proves what is *serving* — not merely what was unpacked.
          if [ "$LIVE" != "$TAG" ]; then
            echo "::error::Live version is $LIVE, expected $TAG."
            exit 1
          fi

          # Absence cannot be checked by status code here: .htaccess serves the
          # SPA shell for any unmatched path, so a deleted install.php answers
          # 200. Assert on content instead.
          if curl -sS --max-time 60 "$SITE_URL/install.php" | grep -q 'Club Bar Installation'; then
            echo "::error::install.php is still being served."
            exit 1
          fi

          echo "Deployed $TAG — health ok, installer gone."
          {
            echo
            echo "### Deployed"
            echo
            echo "- Live version: \`$LIVE\`"
            echo "- Health: \`$STATUS\`"
            echo "- Installer removed"
          } >> "$GITHUB_STEP_SUMMARY"

      # A run that failed between upload and migrate leaves upgrade.php, the
      # secret and an 8 MB ZIP in the document root. upgrade.php is a ZIP-upload
      # wizard, so leaving it behind on a failure is the worst case, not the
      # harmless one.
      - name: Clean up upload artefacts
        if: always()
        continue-on-error: true
        run: |
          lftp -u "$SFTP_USER,$SFTP_PASSWORD" "sftp://$SFTP_HOST:22" << 'LFTP'
          set sftp:auto-confirm yes
          rm -f upgrade.php
          rm -f .upgrade-secret
          rm -f .upgrade-package.zip
          bye
          LFTP
