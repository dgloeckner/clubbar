name: Build

on:
  push:
    tags-ignore:
      - '**'
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-terminal:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop
        working-directory: terminal-frontend

      - name: Get dependencies
        run: flutter pub get
        working-directory: terminal-frontend

      - name: Build Linux ARM64
        run: flutter build linux --release
        working-directory: terminal-frontend

      - name: Package artifact
        id: package
        working-directory: terminal-frontend/build/linux/arm64/release/bundle
        run: |
          VERSION="${{ github.event.release.tag_name || github.sha }}"
          ARTIFACT="flutter-app-linux-arm64-${VERSION}.tar.gz"
          tar -czf "$GITHUB_WORKSPACE/${ARTIFACT}" .
          echo "artifact=${ARTIFACT}" >> "$GITHUB_OUTPUT"

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.artifact }}
