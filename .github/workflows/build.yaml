name: Build

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  release:
    types: [created]

permissions:
  contents: write

jobs:
  test-backend:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
        working-directory: backend

      - name: Run unit tests
        run: php vendor/bin/phpunit -c phpunit.xml --testsuite Unit
        working-directory: backend

  test-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            admin-frontend/package-lock.json
            e2etests/package-lock.json

      - name: Install backend dependencies
        run: composer install --no-interaction --prefer-dist
        working-directory: backend

      - name: Prepare writable directories
        run: chmod -R 777 backend/logs backend/storage

      - name: Build admin frontend
        run: npm ci && npm run build
        working-directory: admin-frontend

      - name: Start services
        uses: hoverkraft-tech/compose-action@v2.0.2
        with:
          compose-file: |
            ./docker-compose.yml
            ./docker-compose.ci.yml
          services: |
            database
            backend

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/api/health && break
            sleep 2
          done

      - name: Run database migrations and seed
        run: |
          curl -sf "http://localhost:8080/install.php?action=migrate&key=dev-install-key"
          curl -sf "http://localhost:8080/install.php?action=seed&key=dev-install-key"

      - name: Serve admin frontend
        run: npx vite preview --port 5173 --host &
        working-directory: admin-frontend

      - name: Wait for admin frontend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:5173 && break
            if [ $i -eq 30 ]; then echo "Admin frontend not ready after 60s" && exit 1; fi
            sleep 2
          done

      - name: Install E2E dependencies
        run: npm ci
        working-directory: e2etests

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('e2etests/package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2etests

      - name: Run E2E tests
        run: npx playwright test
        working-directory: e2etests
        env:
          CI: true
          ADMIN_URL: http://localhost:5173

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2etests/playwright-report/
          retention-days: 14

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: e2etests/test-results/
          retention-days: 14

  test-package:
    name: Build & Test Package
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          extensions: pdo_mysql, mbstring

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            admin-frontend/package-lock.json
            e2etests/package-lock.json

      - name: Install backend dependencies (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction
        working-directory: backend

      - name: Build admin frontend
        run: npm ci && npm run build
        working-directory: admin-frontend

      - name: Assemble package
        run: |
          mkdir -p dist/package/api/db
          cp -r backend/src backend/vendor dist/package/api/
          cp backend/bootstrap.php dist/package/api/
          cp backend/db/MigrationRunner.php dist/package/api/db/
          cp -r backend/db/migrations dist/package/api/db/migrations
          mkdir -p dist/package/api/storage dist/package/api/logs
          chmod -R 777 dist/package/api/storage dist/package/api/logs
          cp -r admin-frontend/dist dist/package/assets
          cp package/index.php package/install.php package/.htaccess package/config.sample.php package/README.txt dist/package/
          chmod 777 dist/package/

      - name: Start services
        uses: hoverkraft-tech/compose-action@v2.0.2
        with:
          compose-file: |
            ./docker-compose.yml
            ./docker-compose.ci.yml
            ./docker-compose.package.yml
          services: |
            database
            backend

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/install.php?step=1 > /dev/null 2>&1 && break
            if [ $i -eq 30 ]; then echo "Backend not ready after 60s" && exit 1; fi
            sleep 2
          done

      - name: Install E2E dependencies
        run: npm ci
        working-directory: e2etests

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('e2etests/package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2etests

      - name: Run package smoke tests
        run: npx playwright test --project=package-tests --workers=1
        working-directory: e2etests
        env:
          CI: true
          PACKAGE_TEST: '1'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-test-results
          path: e2etests/test-results/
          retention-days: 14

      - name: Create package ZIP
        run: cd dist && zip -r ruderbar-package.zip package/ -q

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ruderbar-package
          path: dist/ruderbar-package.zip
          retention-days: 30

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ruderbar-package.zip

  build-terminal:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Setup Flutter
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 -b stable ~/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH

      - name: Verify Flutter
        run: flutter doctor -v

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop
        working-directory: terminal-frontend

      - name: Get dependencies
        run: flutter pub get
        working-directory: terminal-frontend

      - name: Build Linux ARM64
        run: flutter build linux --release
        working-directory: terminal-frontend

      - name: Package artifact
        id: package
        working-directory: terminal-frontend/build/linux/arm64/release/bundle
        run: |
          VERSION="${{ github.event.release.tag_name || github.sha }}"
          ARTIFACT="flutter-app-linux-arm64-${VERSION}.tar.gz"
          tar -czf "$GITHUB_WORKSPACE/${ARTIFACT}" .
          echo "artifact=${ARTIFACT}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: ${{ steps.package.outputs.artifact }}
          retention-days: 30

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.artifact }}
