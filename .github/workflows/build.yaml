name: Build

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  release:
    types: [created]

permissions:
  contents: write

# Superseded runs on the same branch are pointless — cancel them. main is
# exempt because its runs deploy, and a half-finished deploy is worse than a
# redundant one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Which parts of the repo did this branch actually touch? Every downstream
  # job is gated on the answer, so a terminal-only change no longer pays for
  # admin lint, backend tests, E2E and packaging.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      admin: ${{ steps.filter.outputs.admin }}
      backend: ${{ steps.filter.outputs.backend }}
      e2e: ${{ steps.filter.outputs.e2e }}
      terminal: ${{ steps.filter.outputs.terminal }}
      # "Run the lot": main and releases must build every artifact regardless
      # of paths, and a workflow edit has to be exercised end to end.
      full: ${{ steps.full.outputs.value }}
      # The web stack travels together: E2E drives admin against the backend,
      # so a change to either side (or to the tests) runs the whole chain.
      web: ${{ steps.web.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # paths-filter diffs against main

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: main
          filters: |
            admin:
              - 'admin-frontend/**'
            backend:
              - 'backend/**'
              - 'scripts/**'
              - 'docker-compose*.yml'
            e2e:
              - 'e2etests/**'
            terminal:
              - 'terminal-frontend/**'
            ci:
              - '.github/workflows/**'

      - name: Decide whether to run everything
        id: full
        run: |
          if [ "${{ github.event_name }}" = "release" ] \
            || [ "${{ github.ref }}" = "refs/heads/main" ] \
            || [ "${{ steps.filter.outputs.ci }}" = "true" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether the web stack runs
        id: web
        run: |
          if [ "${{ steps.full.outputs.value }}" = "true" ] \
            || [ "${{ steps.filter.outputs.admin }}" = "true" ] \
            || [ "${{ steps.filter.outputs.backend }}" = "true" ] \
            || [ "${{ steps.filter.outputs.e2e }}" = "true" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    needs: [changes]
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: admin-frontend

      - name: Type check
        run: npm run type-check
        working-directory: admin-frontend

      - name: Lint
        run: npm run lint
        working-directory: admin-frontend

      # Runs vitest with the v8 coverage provider; the thresholds in
      # vite.config.ts fail this step on coverage regression (#103).
      - name: Unit tests (coverage-gated)
        run: npm run test:coverage
        working-directory: admin-frontend

      # The run above uses the non-UTC default pinned in vite.config.ts. A
      # UTC-vs-local defect only shows on one side of Greenwich, though —
      # `date_to` rolls forward west of it, date-only values render a day
      # early east of it — so the suite runs on both sides (#95).
      - name: Unit tests (both sides of Greenwich)
        run: npm run test:timezones
        working-directory: admin-frontend

      # Consumed by the patch-coverage job, which gates both projects from
      # their clover reports (#168 §3). vitest emits clover by default.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: admin-frontend/coverage/clover.xml
          retention-days: 14
          if-no-files-found: warn

  # Backend deps only ever change with backend/composer.lock, so installing
  # them once here and handing the vendor/ tree to every downstream job beats
  # running `composer install` three times (test-backend, test-e2e, and again
  # inside build-package.sh for the production package).
  build-backend:
    needs: [changes]
    # Same gate as build-frontend: test-e2e needs a backend to run against
    # even on an admin- or e2e-only change, where test-backend itself is
    # skipped.
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          extensions: pdo_mysql, mbstring

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
        working-directory: backend

      - name: Upload backend vendor
        uses: actions/upload-artifact@v4
        with:
          name: backend-vendor
          path: backend/vendor/
          retention-days: 1

  test-backend:
    needs: [changes, build-backend]
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04

    services:
      database:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: clubbar
          MYSQL_USER: clubbar
          MYSQL_PASSWORD: clubbar
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          extensions: pdo_mysql, mbstring
          coverage: pcov

      - name: Download backend vendor
        uses: actions/download-artifact@v4
        with:
          name: backend-vendor
          path: backend/vendor/

      - name: Run database migrations
        run: |
          php -r "
            require 'vendor/autoload.php';
            \$pdo = new PDO('mysql:host=127.0.0.1;dbname=clubbar;charset=utf8mb4', 'clubbar', 'clubbar');
            \$runner = new App\Db\MigrationRunner(\$pdo);
            \$log = \$runner->migrate(__DIR__ . '/db/migrations', 'ci');
            foreach (\$log as \$entry) echo \$entry . PHP_EOL;
          "
        working-directory: backend

      # One combined run so the clover report reflects Unit + Feature
      # together (two runs would overwrite each other's report).
      - name: Run unit & feature tests (with coverage)
        run: php vendor/bin/phpunit -c phpunit.xml
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: clubbar
          DB_USER: clubbar
          DB_PASS: clubbar

      # PHPUnit only reports coverage; this step is the enforcement half.
      # The floor now lives in backend/.coverage-floor rather than in this
      # argument (#168 §2, ruling #166): it never decreases, and is raised by
      # the PR that earns it, so a drop shows up as a diff instead of an
      # invisible edit to a workflow line.
      - name: Enforce coverage floor
        run: php scripts/check-coverage.php coverage/clover.xml
        working-directory: backend

      # Uploaded even when the floor check fails — that is exactly when the
      # per-file breakdown is needed to see what regressed.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/clover.xml
          retention-days: 14
          if-no-files-found: warn

  # The skip lint rule (#168 §4, ruling #146): a data-dependent test.skip()
  # reads as coverage while verifying nothing, so it fails at authoring time
  # rather than after a green-but-hollow run.
  lint-e2e:
    needs: [changes]
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2etests/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: e2etests

      # The rule is itself code, and it gates the whole suite — it gets tests.
      - name: Test the lint rules
        run: npm run test:lint-rules
        working-directory: e2etests

      - name: Lint E2E specs
        run: npm run lint
        working-directory: e2etests

  # 80% of the lines this branch changed must be covered (#168 §3, ruling
  # #146). This coexists with the never-decrease floor and fails differently:
  # the floor blocks regression, patch coverage blocks new untested code.
  #
  # Scope is not declared here — it inherits each project's own measurement
  # scope, because a file the project does not measure never appears in its
  # clover report. That keeps the frontend's delegation of pages and
  # components to Playwright (ruled on #166) undisturbed.
  patch-coverage:
    needs: [changes, lint, test-backend]
    # Skipped upstream jobs must not cascade, and a red upstream build is
    # already reported — no value in a second failure from stale reports.
    # main has no merge-base to diff against; this is a branch gate.
    if: |
      always() && !cancelled()
      && github.ref != 'refs/heads/main'
      && github.event_name != 'release'
      && (needs.lint.result == 'success' || needs['test-backend'].result == 'success')
      && needs.lint.result != 'failure'
      && needs['test-backend'].result != 'failure'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the gate diffs against the merge-base with main

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      # Either report may legitimately be absent: a backend-only change never
      # runs the frontend job, and vice versa.
      - name: Download backend coverage
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: reports/backend

      - name: Download frontend coverage
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: reports/frontend

      - name: Enforce patch coverage
        run: |
          set -euo pipefail
          base="$(git merge-base origin/main HEAD)"
          echo "Merge base with main: $base"
          git diff --unified=0 "$base" HEAD > changes.diff

          args=()
          for report in reports/backend/clover.xml reports/frontend/clover.xml; do
            if [ -f "$report" ]; then
              args+=("--clover=$report")
            fi
          done

          if [ ${#args[@]} -eq 0 ]; then
            echo "No coverage reports produced — nothing to gate."
            exit 0
          fi

          php scripts/check-patch-coverage.php --diff=changes.diff --min=80 "${args[@]}"

  build-frontend:
    needs: [changes]
    # Gated on `web`, not `admin`: test-e2e and test-package download this
    # job's dist artifact, so it has to run whenever they do.
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin-frontend/package-lock.json

      - name: Install and build
        run: npm ci && npm run build
        working-directory: admin-frontend
        env:
          VITE_APP_VERSION: ${{ github.event.release.tag_name || format('dev-{0}', github.sha) }}

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: admin-frontend-dist
          path: admin-frontend/dist/
          retention-days: 1

  test-e2e:
    needs: [changes, lint, test-backend, build-frontend, build-backend]
    # A skipped dependency must not cascade into skipping this job (lint is
    # skipped for a backend-only change), so gate on failure rather than on
    # the default "all needs succeeded".
    if: |
      always() && !cancelled()
      && needs.changes.outputs.web == 'true'
      && needs.lint.result != 'failure'
      && needs['test-backend'].result != 'failure'
      && needs['build-frontend'].result == 'success'
      && needs['build-backend'].result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Three lanes rather than two blind shards, because `--shard` cannot split a
    # dependency-connected component and almost every project was in one: the
    # ordered specs and the mail chains all declare `api-tests` and
    # `admin-chromium` as dependencies, so Playwright had to keep the lot
    # together. Measured on the old two-way shard: shard 1 got **28** tests and
    # ran for 52 seconds, shard 2 got **995** and ran for 7m54 — the matrix paid
    # for two stacks and bought nothing.
    #
    # Those dependencies are about one shared database, so a job of its own
    # satisfies them (see the `E2E_LANE` note in playwright.config.ts). The
    # remaining two lanes are homogeneous, which is what makes Playwright's
    # count-based sharding balance them by *time*: 318/318 for `api`, and
    # 180/179 for `ui`.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lane: api, id: api-1, shard: 1/2, browsers: chromium, projects: --project=api-tests }
          - { lane: api, id: api-2, shard: 2/2, browsers: chromium, projects: --project=api-tests }
          - { lane: ui, id: ui-1, shard: 1/2, browsers: chromium webkit, projects: --project=admin-chromium --project=admin-mobile }
          - { lane: ui, id: ui-2, shard: 2/2, browsers: chromium webkit, projects: --project=admin-chromium --project=admin-mobile }
          # One job, no shard: every project in it is deliberately serial.
          - { lane: chain, id: chain, shard: 1/1, browsers: chromium, projects: --project=api-ordered --project=api-rotation --project=mail-chain --project=mail-statement --project=mail-credentials --project=mail-issuance }

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            admin-frontend/package-lock.json
            e2etests/package-lock.json

      - name: Download backend vendor
        uses: actions/download-artifact@v4
        with:
          name: backend-vendor
          path: backend/vendor/

      - name: Prepare writable directories
        run: chmod -R 777 backend/logs backend/storage

      - name: Download admin frontend build
        uses: actions/download-artifact@v4
        with:
          name: admin-frontend-dist
          path: admin-frontend/dist/

      - name: Install admin frontend deps (for vite preview)
        run: npm ci
        working-directory: admin-frontend

      # Started explicitly rather than through hoverkraft-tech/compose-action,
      # whose post step dumps the *entire* container log — over a megabyte of
      # per-request access lines — as the last thing in the job. GitHub's
      # job-log API only returns the tail, so that dump pushed Playwright's
      # summary past the horizon and made a red run undiagnosable through the
      # API. The teardown below is bounded and runs before the failure report.
      # `mailpit` is named explicitly: it is deliberately not a dependency of
      # `backend` (the backend must run with no mail server anywhere), so
      # nothing would start it otherwise — and the mail-chain project reads its
      # API for what a drain actually delivered.
      - name: Start services
        run: docker compose -f ./docker-compose.yml -f ./docker-compose.ci.yml up -d database backend mailpit

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/api/health && break
            if [ $i -eq 30 ]; then echo "Backend not ready after 60s" && exit 1; fi
            sleep 2
          done

      - name: Wait for Mailpit
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8025/readyz && break
            if [ $i -eq 30 ]; then echo "Mailpit not ready after 60s" && exit 1; fi
            sleep 2
          done

      - name: Run database migrations and seed
        run: |
          # Temporarily allow install.php through .htaccess (CI only — container is ephemeral)
          sed -i '/<Files "install.php">/,/<\/Files>/d' backend/public/.htaccess
          # CI: clear installed marker before each action — container is ephemeral so persistence
          # of the marker between steps has no security value here.
          rm -f backend/storage/.installed
          curl -sf -H "X-Install-Key: dev-install-key-x" "http://localhost:8080/install.php?action=migrate"
          rm -f backend/storage/.installed
          curl -sf -H "X-Install-Key: dev-install-key-x" "http://localhost:8080/install.php?action=seed"
          # Re-enable the installed marker so security tests see install.php as blocked
          docker compose exec -T backend touch /app/storage/.installed

      - name: Serve admin frontend
        run: npx vite preview --port 5173 --host &
        working-directory: admin-frontend

      - name: Wait for admin frontend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:5173 && break
            if [ $i -eq 30 ]; then echo "Admin frontend not ready after 60s" && exit 1; fi
            sleep 2
          done

      - name: Install E2E dependencies
        run: npm ci
        working-directory: e2etests

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Per lane, because lanes now install different browser sets: a
          # chromium-only lane must not fill the entry the ui lane restores, or
          # that lane silently redownloads WebKit on every run.
          key: playwright-${{ matrix.lane }}-${{ hashFiles('e2etests/package-lock.json') }}

      # Only the browsers this lane actually launches. `admin-mobile`
      # (`devices['iPhone 14']`) is the **only** project in CI that runs on
      # WebKit, and it lives in the ui lane; everything else drives Chromium or
      # no browser at all.
      #
      # It is `--with-deps` that makes this worth doing. The browser binaries
      # come from the cache above, but the apt packages never do — they are
      # refetched by every job on every run, and WebKit's closure is the
      # expensive half (gstreamer, libwoff, libmanette, fonts...). Measured on
      # the first run of this matrix, with the binaries cached:
      #
      #     Fetched 104 MB in 13min 40s (127 kB/s)
      #
      # in a job whose tests then took 1m47. The mirror is not always that
      # slow — the same step took 39 seconds on main an hour earlier — which is
      # exactly why it is worth not paying for it five times over.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browsers }}
        working-directory: e2etests

      - name: Run E2E tests
        # Every project is named explicitly, in one lane or another: these specs
        # live in their own testDir or are excluded from `api-tests`, so leaving
        # one out drops it from CI silently. The union of the three lanes is the
        # project list this job used to run as one.
        #
        # `E2E_LANE` reaches playwright.config.ts, where it is the only thing
        # that relaxes a dependency edge — and only for the chain lane, which
        # has this database to itself.
        run: npx playwright test ${{ matrix.projects }} --shard=${{ matrix.shard }}
        working-directory: e2etests
        env:
          CI: true
          ADMIN_URL: http://localhost:5173
          E2E_LANE: ${{ matrix.lane }}

      # Container logs, bounded. Enough to see a backend 500 or a crash loop
      # behind a failing test, without burying what comes after it.
      - name: Container logs (tail)
        if: failure()
        run: docker compose -f ./docker-compose.yml -f ./docker-compose.ci.yml logs --tail=150 --no-color

      # Last thing in the job log, deliberately: names every failing spec with
      # its error, its location and a copy-pasteable re-run command, anchored by
      # the marker `E2E-FAILURES` so it can be grepped out of the tail. Also
      # writes the job summary and one annotation per failure.
      - name: Name the failing tests
        if: failure()
        run: node scripts/report-failures.mjs
        working-directory: e2etests

      # Was the compose-action's post step, which dumped every container log
      # line. Explicit teardown prints a handful of lines instead, so the report
      # above stays inside the tail the log API returns.
      - name: Stop services
        if: always()
        run: docker compose -f ./docker-compose.yml -f ./docker-compose.ci.yml down -v --remove-orphans

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.id }}
          # results/ carries the JSON reporter output the debugging workflow in
          # CLAUDE.md reads; the HTML report alone cannot be grepped.
          path: |
            e2etests/playwright-report/
            e2etests/results/
          retention-days: 14

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.id }}
          path: e2etests/test-results/
          retention-days: 14

  test-package:
    name: Build & Test Package
    needs: [changes, test-e2e, build-backend]
    if: |
      always() && !cancelled()
      && needs.changes.outputs.web == 'true'
      && needs['test-e2e'].result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact: ${{ steps.package.outputs.artifact }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          extensions: pdo_mysql, mbstring

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2etests/package-lock.json

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-no-dev-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-no-dev-

      - name: Download admin frontend build
        uses: actions/download-artifact@v4
        with:
          name: admin-frontend-dist
          path: admin-frontend/dist/

      # Pre-warms backend/vendor from the shared dev install so
      # build-package.sh's `composer install --no-dev` only has to prune
      # dev-only packages and rebuild the optimized autoloader, instead of
      # reinstalling everything from scratch.
      - name: Download backend vendor
        uses: actions/download-artifact@v4
        with:
          name: backend-vendor
          path: backend/vendor/

      - name: Assemble package
        run: |
          VERSION="${{ github.event.release.tag_name || format('dev-{0}', github.sha) }}"
          echo "$VERSION" > backend/VERSION
          ./scripts/build-package.sh "$VERSION"

      # Explicit, for the same reason as the E2E job: the action's post step
      # dumped every container log line as the last thing in the job, which is
      # what made a red run undiagnosable through the log API.
      - name: Start services
        run: docker compose -f ./docker-compose.yml -f ./docker-compose.ci.yml -f ./docker-compose.package.yml up -d database backend

      - name: Write installer data for package tests
        run: echo -n '{"key":"ci-package-install-key-0000","completed_step":0}' > dist/package/.installer-data

      - name: Write deploy secret for package tests
        run: echo -n 'ci-deploy-secret-0000' > dist/package/.upgrade-secret

      # The package ships 0700 on storage/ and logs/ and 0755 on the document
      # root (#248, ADR-0031 decision 4), while the container runs the
      # application as uid 1000 and the build ran as the runner. Ownership is
      # what gives here, not the modes: loosening them for the container would
      # mean the smoke test measures modes the release does not carry, which is
      # exactly the regression #248 is about. Must run after the two files
      # above — they are written as the runner, into a directory the container
      # user is about to own.
      - name: Hand the package to the container user
        run: ./scripts/package-permissions.sh container-user

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/install.php > /dev/null 2>&1 && break
            if [ $i -eq 30 ]; then echo "Backend not ready after 60s" && exit 1; fi
            sleep 2
          done

      - name: Install E2E dependencies
        run: npm ci
        working-directory: e2etests

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('e2etests/package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2etests

      - name: Run package smoke tests
        run: npx playwright test --project=package-tests --workers=1
        working-directory: e2etests
        env:
          CI: true
          PACKAGE_TEST: '1'

      - name: Container logs (tail)
        if: failure()
        run: docker compose -f ./docker-compose.yml -f ./docker-compose.ci.yml -f ./docker-compose.package.yml logs --tail=150 --no-color

      - name: Name the failing tests
        if: failure()
        run: node scripts/report-failures.mjs
        working-directory: e2etests

      - name: Stop services
        if: always()
        run: docker compose -f ./docker-compose.yml -f ./docker-compose.ci.yml -f ./docker-compose.package.yml down -v --remove-orphans

      - name: Clean test artifacts from package
        # Everything the install wizard and the smoke tests wrote into the
        # package. Shipping any of it in the release ZIP would hand every
        # download this run's database credentials, its data path, a member's
        # scanned mandate, a live session or this run's request log.
        #
        # sudo because the application creates mandates/ and sessions/ from
        # inside the container as uid 1000 with mode 0700 — the runner cannot
        # descend into them otherwise.
        run: |
          sudo rm -f dist/package/config.php dist/package/backend/config.php \
                     dist/package/data-path.php \
                     dist/package/.installer-data dist/package/.upgrade-secret \
                     dist/package/backend/storage/install.lock
          sudo rm -rf dist/package/backend/storage/mandates \
                      dist/package/backend/storage/sessions
          sudo find dist/package/backend/logs -name '*.log' -delete
          # Loud rather than best-effort: a leftover here ships to users.
          # Exact paths, not a find sweep — vendor/ is full of files with these
          # names and a false positive would fail every release.
          survivors=""
          for path in config.php backend/config.php data-path.php \
                      .installer-data .upgrade-secret \
                      backend/storage/install.lock backend/storage/mandates \
                      backend/storage/sessions; do
            # An `if`, not `[ … ] && …`: the job shell runs with -e, where a
            # false test as the last command of the loop body aborts the step.
            if [ -e "dist/package/$path" ]; then survivors="$survivors $path"; fi
          done
          # Log files are named after the day they were written, so they need a
          # glob rather than a path — and they carry the request context of this
          # run, member identifiers included.
          logs="$(sudo find dist/package/backend/logs -name '*.log' -printf ' backend/logs/%f' || true)"
          survivors="$survivors$logs"
          if [ -n "$survivors" ]; then
            echo "Test artifacts survived cleanup and would ship in the ZIP:$survivors"
            exit 1
          fi

      # The tree goes back to the runner so `zip` can read every path of it —
      # storage/ and logs/ are 0700 and were owned by the container user until
      # now — and the modes are re-asserted afterwards, because the install the
      # smoke tests drove created directories of its own.
      - name: Take the package back and re-assert its modes
        run: |
          ./scripts/package-permissions.sh builder-user
          ./scripts/package-permissions.sh harden
          ./scripts/package-permissions.sh verify

      - name: Create package ZIP
        id: package
        run: |
          VERSION="${{ github.event.release.tag_name || format('dev-{0}', github.sha) }}"
          ARTIFACT="clubbar-${VERSION}.zip"
          cd dist/package && zip -r "../${ARTIFACT}" . -q
          echo "artifact=${ARTIFACT}" >> "$GITHUB_OUTPUT"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: dist/${{ steps.package.outputs.artifact }}
          retention-days: 30

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ steps.package.outputs.artifact }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-test-results
          path: e2etests/test-results/
          retention-days: 14

  build-terminal:
    # The Flutter terminal shares no code, artifact or service with admin lint
    # or the backend suite — waiting on them only delayed this job.
    needs: [changes]
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.terminal == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            xvfb

      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: ~/flutter
          key: flutter-arm64-stable-${{ hashFiles('terminal-frontend/pubspec.lock') }}
          restore-keys: flutter-arm64-stable-

      - name: Setup Flutter
        run: |
          if [ ! -d ~/flutter ]; then
            git clone https://github.com/flutter/flutter.git --depth 1 -b stable ~/flutter
          fi
          echo "$HOME/flutter/bin" >> $GITHUB_PATH

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop
        working-directory: terminal-frontend

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('terminal-frontend/pubspec.lock') }}
          restore-keys: pub-

      - name: Get dependencies
        run: flutter pub get
        working-directory: terminal-frontend

      - name: Generate code (build_runner)
        run: flutter pub run build_runner build --delete-conflicting-outputs
        working-directory: terminal-frontend

      - name: Run unit tests
        run: flutter test
        working-directory: terminal-frontend

      - name: Run integration tests
        run: xvfb-run flutter test integration_test/ --exclude-tags=walkthrough
        timeout-minutes: 5
        working-directory: terminal-frontend

      - name: Build Linux ARM64
        run: flutter build linux --release --dart-define=APP_VERSION=${{ github.event.release.tag_name || format('dev-{0}', github.sha) }}
        working-directory: terminal-frontend

      - name: Package artifact
        id: package
        working-directory: terminal-frontend/build/linux/arm64/release/bundle
        run: |
          VERSION="${{ github.event.release.tag_name || format('dev-{0}', github.sha) }}"
          ARTIFACT="clubbar-terminal-linux-arm64-${VERSION}.tar.gz"
          tar -czf "$GITHUB_WORKSPACE/${ARTIFACT}" .
          echo "artifact=${ARTIFACT}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: ${{ steps.package.outputs.artifact }}
          retention-days: 30

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.artifact }}

  deploy-integration:
    name: Deploy to Integration
    needs: [changes, test-package]
    # On main `full` is true, so every upstream job ran and this deploys the
    # fully-tested package exactly as before.
    if: |
      always() && !cancelled()
      && github.ref == 'refs/heads/main'
      && needs['test-package'].result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ionos-integration

    steps:
      # The deploy needs scripts/deploy-request.sh; every other job in this
      # workflow checks out for its own reasons, this one only for that.
      - uses: actions/checkout@v4

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.test-package.outputs.artifact }}
          path: dist/download/

      - name: Prepare upload files
        run: |
          echo "Downloaded contents:"
          ls -laR dist/download/
          # Find the ZIP file regardless of name
          ZIP_FILE=$(find dist/download/ -name '*.zip' -type f | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No ZIP file found in downloaded artifact"
            echo "Full working directory:"
            find . -maxdepth 3 -type f
            exit 1
          fi
          echo "Found ZIP: $ZIP_FILE ($(du -h "$ZIP_FILE" | cut -f1))"
          mkdir -p dist/upload/
          cp "$ZIP_FILE" dist/upload/.upgrade-package.zip
          echo -n "${{ secrets.IONOS_DEPLOY_SECRET }}" > dist/upload/.upgrade-secret
          # Extract upgrade.php from ZIP so we can upload it alongside
          unzip -o "$ZIP_FILE" upgrade.php -d dist/upload/
          ls -la dist/upload/

      - name: Install lftp
        run: sudo apt-get install -y lftp

      # The upload used to `put` straight into the SFTP login directory, on the
      # assumption — true when this was set up, recorded in the design spec —
      # that the login directory *is* the document root. It is not. The account
      # logs in at `/clubbar-integration`, and the site is served one level
      # below that, from its `root/`. Run #689 proved it: upgrade.php, the ZIP
      # and the secret all transferred, and index.php, spa.html and .htaccess
      # were nowhere beside them — so every extract since has been answered by
      # index.php with the SPA shell.
      #
      # Deliberately relative, not `/clubbar-integration/root`: the path is
      # resolved against wherever this account lands, so it survives the login
      # directory being the chroot root (what it is today) or the webspace
      # directory above it. IONOS_SFTP_PATH on the ionos-integration
      # environment overrides it without another commit if the site moves.
      - name: Upload ZIP via SFTP
        timeout-minutes: 3
        env:
          REMOTE_DIR: ${{ vars.IONOS_SFTP_PATH || 'root' }}
        run: |
          set -euo pipefail
          echo "Uploading $(du -h dist/upload/.upgrade-package.zip | cut -f1) ZIP..."
          {
            echo "set sftp:auto-confirm yes"
            echo "set net:timeout 30"
            echo "set net:max-retries 3"
            echo "set net:reconnect-interval-base 5"
            # Without this a failed `put` prints its error, lftp carries on to
            # the next command and exits 0 — so the step goes green while
            # nothing reached the server, and the failure only surfaces one step
            # later as an unexplained non-JSON answer from an upgrade.php that
            # was never uploaded.
            echo "set cmd:fail-exit yes"
            if [ -n "$REMOTE_DIR" ]; then
              echo "Uploading into $REMOTE_DIR" >&2
              echo "cd $REMOTE_DIR"
            fi
            echo "put dist/upload/upgrade.php"
            echo "put dist/upload/.upgrade-package.zip"
            echo "put dist/upload/.upgrade-secret"
            echo "bye"
          } > lftp-upload.txt
          # Fed on stdin, exactly as the here-document used to be — `-f` is a
          # different invocation form that does not take a site argument.
          lftp -u "${{ secrets.IONOS_SFTP_USER }},${{ secrets.IONOS_SFTP_PASSWORD }}" \
            "sftp://${{ vars.IONOS_SFTP_HOST }}:22" < lftp-upload.txt

      # Did the files land next to the installation? That is the whole question
      # an upload into the wrong directory hides: it is indistinguishable from a
      # successful one until upgrade.php answers with the SPA shell. The
      # listing shows upgrade.php beside index.php and spa.html when the target
      # is right, and names what is actually there when it is not.
      #
      # Never fails the job — it is diagnostics, and the two steps below are the
      # ones that decide whether the deploy worked.
      - name: List the deploy target
        if: always()
        continue-on-error: true
        env:
          REMOTE_DIR: ${{ vars.IONOS_SFTP_PATH || 'root' }}
        run: |
          {
            echo "set sftp:auto-confirm yes"
            echo "cd $REMOTE_DIR"
            echo "pwd"
            echo "cls -la"
            echo "bye"
          } > lftp-list.txt
          lftp -u "${{ secrets.IONOS_SFTP_USER }},${{ secrets.IONOS_SFTP_PASSWORD }}" \
            "sftp://${{ vars.IONOS_SFTP_HOST }}:22" < lftp-list.txt 2>&1 | head -200 || true

      - name: Extract package on server
        timeout-minutes: 2
        run: |
          echo "Extracting package..."
          scripts/deploy-request.sh "Extract" \
            "${{ secrets.IONOS_SITE_URL }}/upgrade.php?key=${{ secrets.IONOS_DEPLOY_SECRET }}&action=extract&force=1"

      - name: Run migrations
        timeout-minutes: 2
        run: |
          echo "Running migrations..."
          scripts/deploy-request.sh "Migrate" \
            "${{ secrets.IONOS_SITE_URL }}/upgrade.php?key=${{ secrets.IONOS_DEPLOY_SECRET }}"

      # Two messes to clear, and the same three names in both places. Both
      # paths are relative to the login directory, for the same reason the
      # upload's is.
      #
      # The login directory holds what every run since 2026-08-11 uploaded into
      # it by mistake: an upgrade wizard, the deploy secret and an 8 MB ZIP,
      # left in a directory whose exposure we do not control.
      #
      # The document root is production's reasoning (see its own cleanup step):
      # a run that dies between upload and migrate leaves upgrade.php — a
      # ZIP-upload wizard — sitting in a served directory. A successful run has
      # already self-destructed all three, so this is a no-op then.
      - name: Clean up upload artefacts
        if: always()
        continue-on-error: true
        env:
          REMOTE_DIR: ${{ vars.IONOS_SFTP_PATH || 'root' }}
        run: |
          {
            echo "set sftp:auto-confirm yes"
            for dir in "" "$REMOTE_DIR"; do
              prefix="${dir:+${dir%/}/}"
              echo "rm -f ${prefix}upgrade.php"
              echo "rm -f ${prefix}.upgrade-package.zip"
              echo "rm -f ${prefix}.upgrade-secret"
            done
            echo "bye"
          } > lftp-cleanup.txt
          lftp -u "${{ secrets.IONOS_SFTP_USER }},${{ secrets.IONOS_SFTP_PASSWORD }}" \
            "sftp://${{ vars.IONOS_SFTP_HOST }}:22" < lftp-cleanup.txt || true
