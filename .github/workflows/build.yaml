name: Build

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  release:
    types: [created]

permissions:
  contents: write

jobs:
  test-backend:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
        working-directory: backend

      - name: Run unit tests
        run: php vendor/bin/phpunit -c phpunit.xml --testsuite Unit
        working-directory: backend

  test-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install backend dependencies
        run: composer install --no-interaction --prefer-dist
        working-directory: backend

      - name: Start services
        uses: hoverkraft-tech/compose-action@v2.0.2
        with:
          compose-file: |
            ./docker-compose.yml
            ./docker-compose.ci.yml
          services: |
            database
            backend
            admin-frontend

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/api/health && break
            sleep 2
          done

      - name: Run database migrations
        run: |
          curl -sf "http://localhost:8080/install.php?action=migrate&key=dev-install-key"

      - name: Wait for admin frontend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:5173 && break
            sleep 2
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install E2E dependencies
        run: npm ci
        working-directory: e2etests

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chrome
        working-directory: e2etests

      - name: Run E2E tests
        run: npx playwright test
        working-directory: e2etests
        env:
          CI: true
          ADMIN_URL: http://localhost:5173

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2etests/playwright-report/
          retention-days: 14

  build-terminal:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Setup Flutter
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 -b stable ~/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH

      - name: Verify Flutter
        run: flutter doctor -v

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop
        working-directory: terminal-frontend

      - name: Get dependencies
        run: flutter pub get
        working-directory: terminal-frontend

      - name: Build Linux ARM64
        run: flutter build linux --release
        working-directory: terminal-frontend

      - name: Package artifact
        id: package
        working-directory: terminal-frontend/build/linux/arm64/release/bundle
        run: |
          VERSION="${{ github.event.release.tag_name || github.sha }}"
          ARTIFACT="flutter-app-linux-arm64-${VERSION}.tar.gz"
          tar -czf "$GITHUB_WORKSPACE/${ARTIFACT}" .
          echo "artifact=${ARTIFACT}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: ${{ steps.package.outputs.artifact }}
          retention-days: 30

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.artifact }}
