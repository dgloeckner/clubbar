name: Build

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  release:
    types: [created]

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: admin-frontend

      - name: Type check
        run: npm run type-check
        working-directory: admin-frontend

      - name: Lint
        run: npm run lint
        working-directory: admin-frontend

  test-backend:
    runs-on: ubuntu-24.04

    services:
      database:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: clubbar
          MYSQL_USER: clubbar
          MYSQL_PASSWORD: clubbar
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          extensions: pdo_mysql, mbstring

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
        working-directory: backend

      - name: Run database migrations
        run: |
          php -r "
            require 'vendor/autoload.php';
            \$pdo = new PDO('mysql:host=127.0.0.1;dbname=clubbar;charset=utf8mb4', 'clubbar', 'clubbar');
            \$runner = new App\Db\MigrationRunner(\$pdo);
            \$log = \$runner->migrate(__DIR__ . '/db/migrations', 'ci');
            foreach (\$log as \$entry) echo \$entry . PHP_EOL;
          "
        working-directory: backend

      - name: Run unit tests
        run: php vendor/bin/phpunit -c phpunit.xml --testsuite Unit
        working-directory: backend

      - name: Run feature tests
        run: php vendor/bin/phpunit -c phpunit.xml --testsuite Feature
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: clubbar
          DB_USER: clubbar
          DB_PASS: clubbar

  build-frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin-frontend/package-lock.json

      - name: Install and build
        run: npm ci && npm run build
        working-directory: admin-frontend
        env:
          VITE_APP_VERSION: ${{ github.event.release.tag_name || format('dev-{0}', github.sha) }}

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: admin-frontend-dist
          path: admin-frontend/dist/
          retention-days: 1

  test-e2e:
    needs: [lint, test-backend, build-frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            admin-frontend/package-lock.json
            e2etests/package-lock.json

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install backend dependencies
        run: composer install --no-interaction --prefer-dist
        working-directory: backend

      - name: Prepare writable directories
        run: chmod -R 777 backend/logs backend/storage

      - name: Download admin frontend build
        uses: actions/download-artifact@v4
        with:
          name: admin-frontend-dist
          path: admin-frontend/dist/

      - name: Install admin frontend deps (for vite preview)
        run: npm ci
        working-directory: admin-frontend

      - name: Start services
        uses: hoverkraft-tech/compose-action@v2.0.2
        with:
          compose-file: |
            ./docker-compose.yml
            ./docker-compose.ci.yml
          services: |
            database
            backend

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/api/health && break
            if [ $i -eq 30 ]; then echo "Backend not ready after 60s" && exit 1; fi
            sleep 2
          done

      - name: Run database migrations and seed
        run: |
          # Temporarily allow install.php through .htaccess (CI only — container is ephemeral)
          sed -i '/<Files "install.php">/,/<\/Files>/d' backend/public/.htaccess
          # CI: clear installed marker before each action — container is ephemeral so persistence
          # of the marker between steps has no security value here.
          rm -f backend/storage/.installed
          curl -sf -H "X-Install-Key: dev-install-key-x" "http://localhost:8080/install.php?action=migrate"
          rm -f backend/storage/.installed
          curl -sf -H "X-Install-Key: dev-install-key-x" "http://localhost:8080/install.php?action=seed"
          # Re-enable the installed marker so security tests see install.php as blocked
          docker compose exec -T backend touch /app/storage/.installed

      - name: Serve admin frontend
        run: npx vite preview --port 5173 --host &
        working-directory: admin-frontend

      - name: Wait for admin frontend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:5173 && break
            if [ $i -eq 30 ]; then echo "Admin frontend not ready after 60s" && exit 1; fi
            sleep 2
          done

      - name: Install E2E dependencies
        run: npm ci
        working-directory: e2etests

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-webkit-${{ hashFiles('e2etests/package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
        working-directory: e2etests

      - name: Run E2E tests
        run: npx playwright test --project=api-tests --project=admin-chromium --project=admin-mobile
        working-directory: e2etests
        env:
          CI: true
          ADMIN_URL: http://localhost:5173

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2etests/playwright-report/
          retention-days: 14

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: e2etests/test-results/
          retention-days: 14

  test-package:
    name: Build & Test Package
    needs: [test-e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          extensions: pdo_mysql, mbstring

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2etests/package-lock.json

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-no-dev-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-no-dev-

      - name: Install backend dependencies (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction
        working-directory: backend

      - name: Download admin frontend build
        uses: actions/download-artifact@v4
        with:
          name: admin-frontend-dist
          path: admin-frontend/dist/

      - name: Write version file
        run: echo "${{ github.event.release.tag_name || format('dev-{0}', github.sha) }}" > backend/VERSION

      - name: Assemble package
        run: |
          mkdir -p dist/package/backend/db
          cp -r backend/src backend/vendor dist/package/backend/
          cp backend/bootstrap.php backend/VERSION dist/package/backend/
          cp backend/db/MigrationRunner.php dist/package/backend/db/
          cp -r backend/db/migrations dist/package/backend/db/migrations
          mkdir -p dist/package/backend/storage dist/package/backend/logs
          chmod -R 777 dist/package/backend/storage dist/package/backend/logs
          cp -r admin-frontend/dist/assets dist/package/assets
          cp admin-frontend/dist/index.html dist/package/spa.html
          for f in admin-frontend/dist/*; do
            fname="$(basename "$f")"
            [ "$fname" = "assets" ] && continue
            [ "$fname" = "index.html" ] && continue
            cp -r "$f" "dist/package/$fname"
          done
          cp package/index.php package/install.php package/.htaccess package/config.sample.php package/README.txt dist/package/
          chmod 777 dist/package/

      - name: Start services
        uses: hoverkraft-tech/compose-action@v2.0.2
        with:
          compose-file: |
            ./docker-compose.yml
            ./docker-compose.ci.yml
            ./docker-compose.package.yml
          services: |
            database
            backend

      - name: Write installer data for package tests
        run: echo -n '{"key":"ci-package-install-key-0000","completed_step":0}' > dist/package/.installer-data

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/install.php > /dev/null 2>&1 && break
            if [ $i -eq 30 ]; then echo "Backend not ready after 60s" && exit 1; fi
            sleep 2
          done

      - name: Install E2E dependencies
        run: npm ci
        working-directory: e2etests

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('e2etests/package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2etests

      - name: Run package smoke tests
        run: npx playwright test --project=package-tests --workers=1
        working-directory: e2etests
        env:
          CI: true
          PACKAGE_TEST: '1'

      - name: Clean test artifacts from package
        run: rm -f dist/package/config.php dist/package/.installer-data dist/package/backend/storage/install.lock

      - name: Create package ZIP
        id: package
        run: |
          VERSION="${{ github.event.release.tag_name || format('dev-{0}', github.sha) }}"
          ARTIFACT="clubbar-${VERSION}.zip"
          cd dist/package && zip -r "../${ARTIFACT}" . -q
          echo "artifact=${ARTIFACT}" >> "$GITHUB_OUTPUT"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: dist/${{ steps.package.outputs.artifact }}
          retention-days: 30

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ steps.package.outputs.artifact }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-test-results
          path: e2etests/test-results/
          retention-days: 14

  build-terminal:
    needs: [lint, test-backend]
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            xvfb

      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: ~/flutter
          key: flutter-arm64-stable-${{ hashFiles('terminal-frontend/pubspec.lock') }}
          restore-keys: flutter-arm64-stable-

      - name: Setup Flutter
        run: |
          if [ ! -d ~/flutter ]; then
            git clone https://github.com/flutter/flutter.git --depth 1 -b stable ~/flutter
          fi
          echo "$HOME/flutter/bin" >> $GITHUB_PATH

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop
        working-directory: terminal-frontend

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('terminal-frontend/pubspec.lock') }}
          restore-keys: pub-

      - name: Get dependencies
        run: flutter pub get
        working-directory: terminal-frontend

      - name: Run unit tests
        run: flutter test
        working-directory: terminal-frontend

      - name: Run integration tests
        run: xvfb-run flutter test integration_test/ --exclude-tags=walkthrough
        timeout-minutes: 5
        working-directory: terminal-frontend

      - name: Build Linux ARM64
        run: flutter build linux --release --dart-define=APP_VERSION=${{ github.event.release.tag_name || format('dev-{0}', github.sha) }}
        working-directory: terminal-frontend

      - name: Package artifact
        id: package
        working-directory: terminal-frontend/build/linux/arm64/release/bundle
        run: |
          VERSION="${{ github.event.release.tag_name || format('dev-{0}', github.sha) }}"
          ARTIFACT="clubbar-terminal-linux-arm64-${VERSION}.tar.gz"
          tar -czf "$GITHUB_WORKSPACE/${ARTIFACT}" .
          echo "artifact=${ARTIFACT}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: ${{ steps.package.outputs.artifact }}
          retention-days: 30

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.artifact }}
