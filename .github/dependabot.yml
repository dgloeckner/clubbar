# Dependabot version updates.
#
# Reference: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# The shape of this file is "one group per framework, majors on their own".
# Two things drive it:
#
#   * A group is a single pull request, so packages that must move together
#     belong in one group — react/react-dom with their @types, eslint with its
#     plugins and the typescript-eslint pair, vite with vitest. Bumping half a
#     toolchain is how a green PR turns red on merge.
#   * Packages that *cannot* move apart belong in one group even when they are
#     conceptually unrelated. A peer range that excludes the next major of
#     another direct dependency — @testing-library/react 14's `react: ^18.0.0`
#     against react 19 — makes a lone bump an unresolvable lockfile rather than
#     a failing test (#594). `npm run check:dependabot-groups` in /e2etests
#     fails the build when this file and the manifests disagree about that.
#   * Everything a group does not claim falls into a catch-all that takes only
#     minor and patch. A major of an unclaimed package therefore arrives as its
#     own pull request, which is what a breaking change needs: react-router
#     6 -> 7 (#578) is not something to review inside a ten-package diff.
#
# Docker images are deliberately absent. Every image the project pulls is also
# listed by hand in `scripts/mirrored-images.txt` and copied to GHCR by
# `scripts/mirror-images.sh`, and Dependabot cannot update that list — a bumped
# tag in docker-compose.yml would silently leave the mirror pointing at a tag
# that no longer exists, and the fallback is Docker Hub's rate limit. The tags
# are floating minors (`mariadb:10.11`, `webdevops/php-apache:8.3`,
# `node:22-alpine`, `httpd:2.4-alpine`) so upstream patches arrive on the next
# pull anyway. Enabling the `docker` and `docker-compose` ecosystems needs a
# check that the mirror list still covers what the compose files reference.

# A pull request from this config can also fail for a reason no change here can fix:
# a peer range only an unpublished release would satisfy (typescript 7 against
# @typescript-eslint's `>=4.8.4 <6.1.0`, #620). Those are labelled `blocked-upstream`
# and swept weekly rather than closed — see docs/agents/issue-tracker.md.

# A *security* alert has a third outcome, which is neither a version bump nor
# `blocked-upstream`: the vulnerable package is a transitive dependency its
# parent pins to an exact version, so no bump Dependabot can offer reaches it.
# `@typescript-eslint/typescript-estree@6.21.0` depends on `minimatch` at
# literally `9.0.3` — not `^9.0.3` — so the three minimatch ReDoS advisories
# stayed open through every eslint pull request, and the only bump that would
# have cleared them is the typescript-eslint 8 major sitting behind #620.
# `admin-frontend/package.json` therefore carries an `overrides` entry lifting
# that one dependency to `^9.0.9`, which is a patch release of the version the
# parent already asked for. Drop the override when typescript-eslint 8 lands.

version: 2

updates:
  # ---------------------------------------------------------------------------
  # npm — the admin SPA and the Playwright suite.
  #
  # Both directories are handled by one entry so a group that matches in both
  # produces one pull request "across 2 directories". That is the point for the
  # shared toolchain: typescript, eslint and @playwright/test are pinned in
  # each package.json separately and drifted apart before (typescript 5.2 vs
  # 5.7, eslint 8 vs 9), which is how a spec passes in one directory and fails
  # to compile in the other.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directories:
      - "/admin-frontend"
      - "/e2etests"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    groups:
      # The runtime, its types, and every direct dependency whose peer range
      # pins it to react's *current* major.
      #
      # @types/react 19 against react 18 does not type-check, so the types have
      # always been here. @testing-library/react joined them the hard way:
      # version 14 declares `"react": "^18.0.0"`, so the react 19 pull request
      # (#594) shipped a lockfile that `npm ci` refuses outright —
      #
      #     npm error ERESOLVE could not resolve
      #     npm error Found: react@19.2.8
      #     npm error Could not resolve dependency:
      #     npm error peer react@"^18.0.0" from @testing-library/react@14.3.1
      #
      # — and a pull request that cannot install is one no reviewer can rescue:
      # nothing runs, nothing is red for a reason you can read, and the only
      # fix is a second bump Dependabot was never asked to make.
      #
      # Hence the rule, which `npm run check:dependabot-groups` in /e2etests
      # enforces on every build: **if a direct dependency's peer range excludes
      # the next major of another direct dependency, the two belong in one
      # group.** They can only move together, so they must be offered together.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "@testing-library/*"
          # recharts renders with react and enumerates the majors it accepts
          # (`^16 || ^17 || ^18 || ^19`), so from react 19 on it is in exactly
          # the position testing-library was in: the next react cannot install
          # without it.
          - "recharts"

      # Kept out of the `react` group on purpose. Router majors are breaking on
      # their own schedule and get their own pull request; the two packages are
      # grouped only with each other so they never split across versions.
      react-router:
        patterns:
          - "react-router"
          - "react-router-dom"

      i18n:
        patterns:
          - "i18next"
          - "i18next-*"
          - "react-i18next"

      # Vitest's supported vite range moves with its own major, so they ship
      # together, and @vitest/coverage-v8 pins vitest to the exact patch. jsdom
      # is the environment those tests run in. @testing-library is not here: it
      # peers on react, not on vite, and that is the peer that breaks — see the
      # react group above.
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vitest"
          - "@vitest/*"
          - "jsdom"

      # Spans both directories by design — the browser build a version wants is
      # resolved from the installed @playwright/test, so a split between
      # admin-frontend and e2etests means two browser downloads and one of them
      # stale.
      playwright:
        patterns:
          - "@playwright/test"
          - "playwright"
          - "playwright-core"

      # eslint core, its plugins and the typescript-eslint packages all gate on
      # each other's majors (eslint 9 needs flat-config-aware plugins) — and
      # the typescript-eslint packages gate on the compiler as well, with a
      # bounded range rather than a caret: `typescript: ">=4.8.4 <6.1.0"`.
      #
      # That bound is why typescript is in here rather than in a group of its
      # own. The compiler group jumped 5 -> 7 (#614) while @typescript-eslint
      # still refused anything past 6.1, and the result was #594 again in
      # /e2etests: a lockfile npm ci will not install, with the companion bump
      # nowhere on the branch. One group means Dependabot either finds a
      # typescript-eslint release that takes the new compiler and offers both,
      # or offers neither — and "neither" is a Monday with no pull request,
      # not a Monday with a dead one.
      typescript-and-eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "@typescript-eslint/*"
          - "prettier"
          - "prettier-*"
          - "typescript"
          - "@types/node"

      # orval generates the API client and axios is what the generated code
      # calls, so a regeneration and its HTTP client land together.
      api-client:
        patterns:
          - "orval"
          - "axios"

      # Everything else, minor and patch only. The exclusions repeat the groups
      # above so the assignment does not depend on the order of this file.
      npm-minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "@testing-library/*"
          - "recharts"
          - "react-router"
          - "react-router-dom"
          - "i18next"
          - "i18next-*"
          - "react-i18next"
          - "vite"
          - "@vitejs/*"
          - "vitest"
          - "@vitest/*"
          - "jsdom"
          - "@playwright/test"
          - "playwright"
          - "playwright-core"
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "@typescript-eslint/*"
          - "prettier"
          - "prettier-*"
          - "typescript"
          - "@types/node"
          - "orval"
          - "axios"
        update-types:
          - "minor"
          - "patch"

  # ---------------------------------------------------------------------------
  # Composer — the Slim backend.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "composer"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    groups:
      # symfony/mailer, symfony/mime and symfony/yaml are one release train and
      # constrain each other; a lone component bump just fails to resolve.
      symfony:
        patterns:
          - "symfony/*"

      slim:
        patterns:
          - "slim/*"
          - "psr/*"
          - "nyholm/*"

      phpunit:
        patterns:
          - "phpunit/*"
          - "sebastian/*"
          - "phar-io/*"

      composer-minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "symfony/*"
          - "slim/*"
          - "psr/*"
          - "nyholm/*"
          - "phpunit/*"
          - "sebastian/*"
          - "phar-io/*"
        update-types:
          - "minor"
          - "patch"

  # ---------------------------------------------------------------------------
  # GitHub Actions — one pull request for the lot, majors included.
  #
  # Actions are pinned to full commit SHAs with the version in a trailing
  # comment (`actions/checkout@3d3c42e... # v7.0.1`). A tag is mutable: whoever
  # controls the action's repository can repoint `@v7` at any commit, which is
  # how `tj-actions/changed-files` was compromised in March 2025. A SHA cannot
  # be repointed, so every bump has to arrive as a reviewable diff — which is
  # what this entry produces. Dependabot understands the pin and rewrites both
  # the SHA and the comment, so pinning costs no maintenance.
  #
  # Majors stay in the group rather than splitting out: a pull request per
  # action adds no signal, because the workflows are their own test and a bad
  # bump is red on this pull request.
  #
  # Keep new `uses:` lines pinned the same way. Resolve a tag with
  # `git ls-remote https://github.com/<owner>/<repo> 'refs/tags/<tag>^{}'`.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  # ---------------------------------------------------------------------------
  # pub — the Flutter POS terminal.
  #
  # Added last and scheduled last, which keeps this file ordered by slot
  # (04:00 npm, 05:00 composer, 06:00 actions, 07:00 pub): four ecosystems
  # resolving at once is four concurrent runs against one repository, for no
  # gain.
  #
  # Dependabot offers **no security updates for pub** — only version updates.
  # That is an argument for enabling them, not against: `pub` has no `npm
  # audit` or `composer audit` equivalent either (#650), so a version bump is
  # the only signal this ecosystem can ever produce. Before this entry the
  # whole terminal — 31 direct and 137 total packages, the tree that compiles
  # into the binary handed to a club — sat outside the update process, and 62
  # of those packages had gone stale unnoticed (#651).
  #
  # Grouped on the same rule as the entries above: packages that must move
  # together are one pull request. For pub that is mostly generator/annotation
  # pairs, which break apart — `drift_dev` generates against `drift`'s runtime,
  # `chopper_generator` against `chopper`, `json_serializable` against
  # `json_annotation`. `build_runner` drives all of them.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "pub"
    directory: "/terminal-frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    groups:
      # drift's runtime, its generator and its SQLite bindings. `drift_dev`
      # declares a narrow range on `drift` and the generated `.g.dart` is
      # written by one against the other, so a lone bump either fails to
      # resolve or regenerates into a mismatch. `sqlite3` and `sqlparser` are
      # transitive today — drift's own dependencies — and named anyway so that
      # a direct pin, which is how #651 found the 3.2.0 -> 3.5.2 gap, lands
      # here rather than in the catch-all.
      drift:
        patterns:
          - "drift"
          - "drift_dev"
          - "sqlite3"
          - "sqlparser"

      # Code generation, annotations and the clients they generate. Every pair
      # here is a build-time package and a runtime package that have to agree
      # on the shape they write and read.
      codegen:
        patterns:
          - "build_runner"
          - "build*"
          - "source_gen"
          - "json_serializable"
          - "json_annotation"
          - "chopper"
          - "chopper_generator"
          - "swagger_dart_code_generator"

      # Published by flutter.dev and released against the SDK rather than
      # against each other — they move when FLUTTER_VERSION does (#648).
      flutter-sdk-packages:
        patterns:
          - "go_router"
          - "flutter_svg"
          - "path_provider*"
          - "flutter_lints"

      # Everything else, minor and patch only, so a major arrives as its own
      # reviewable pull request.
      pub-minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "drift"
          - "drift_dev"
          - "sqlite3"
          - "sqlparser"
          - "build_runner"
          - "build*"
          - "source_gen"
          - "json_serializable"
          - "json_annotation"
          - "chopper"
          - "chopper_generator"
          - "swagger_dart_code_generator"
          - "go_router"
          - "flutter_svg"
          - "path_provider*"
          - "flutter_lints"
        update-types:
          - "minor"
          - "patch"
