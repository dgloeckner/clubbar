      const handleSubmit = () => {
        if (!form.firstName || !form.lastName || !form.rfid) {
          alert('Bitte alle Pflichtfelder ausfüllen');

          ...form,

    // ========== OFFENE POSTEN MODAL ==========
    function PostenModal({ user, onClose, onAddCorrection, settlements = [] }) {
      const [showCorrectionForm, setShowCorrectionForm] = useState(false);
      const [correctionAmount, setCorrectionAmount] = useState('');
      const [correctionComment, setCorrectionComment] = useState('');
      const [activeTab, setActiveTab] = useState('current'); // current, history

      // Get user's settlement history
      const userSettlements = settlements
        .map(s => {
          const userEntry = s.users.find(u => u.userId === user.id);
          if (userEntry) {
            return { ...userEntry, settlementDate: s.date, settlementId: s.id };
          }
          return null;
        })
        .filter(Boolean);

      const handleAddCorrection = () => {
        const amount = parseFloat(correctionAmount.replace(',', '.'));
        if (isNaN(amount) || amount === 0) {
          alert('Bitte einen gültigen Betrag eingeben');
          return;
        }
        if (!correctionComment.trim()) {
          alert('Bitte einen Kommentar eingeben');
          return;
        }
        onAddCorrection(user.id, {
          date: new Date().toLocaleString('de-DE', { 
            day: '2-digit', month: '2-digit', year: 'numeric',
            hour: '2-digit', minute: '2-digit'
          }),
          amount: amount,
          comment: correctionComment.trim()
        });
        setCorrectionAmount('');
        setCorrectionComment('');
        setShowCorrectionForm(false);
      };

      return (
        <div style={styles.modal} onClick={onClose}>
          <div style={{...styles.modalContent, maxWidth: 800}} onClick={e => e.stopPropagation()}>

    // ========== EXPORT MODAL ==========
    function ExportModal({ users, onClose, onSettle, lastSettlement }) {
      const usersWithDeckel = users.filter(u => u.deckel > 0);
      const totalAmount = usersWithDeckel.reduce((sum, u) => sum + u.deckel, 0);

      const handleExport = () => {
        // Generate SEPA-like CSV export
        const header = 'Name;IBAN;BIC;Betrag;Verwendungszweck\n';
        const rows = usersWithDeckel.map(u => 
          `${u.lastName}, ${u.firstName};${u.iban};${u.bic};${u.deckel.toFixed(2)};FRGS Vereins-Bar Deckel`
        ).join('\n');
        
        const csv = header + rows;
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `frgs-abbuchung-${new Date().toISOString().split('T')[0]}.csv`;
        link.click();
        URL.revokeObjectURL(url);
      };

      const handleSettle = () => {
        if (confirm(`Möchtest du wirklich alle Deckel (${formatPrice(totalAmount)}) als abgerechnet markieren?\n\nDie offenen Posten werden auf 0,00 € gesetzt.`)) {
          onSettle();
        }
      };

      return (
        <div style={styles.modal} onClick={onClose}>
          <div style={{...styles.modalContent, maxWidth: 700}} onClick={e => e.stopPropagation()}>
            <div style={styles.modalHeader}>
              <div>
                <h2 style={{ fontSize: 20, fontWeight: 600, display: 'flex', alignItems: 'center', gap: 10 }}>
                  <BankIcon /> Abrechnung

                background: 'transparent', border: 'none', color: colors.textSecondary,

            <div style={styles.modalBody}>
              <div style={{

                borderRadius: 12, marginBottom: 20,
                display: 'flex', justifyContent: 'space-around', textAlign: 'center',
              }}>
                <div>
                  <div style={{ fontSize: 32, fontWeight: 700, color: colors.green }}>
                    {usersWithDeckel.length}
                  </div>
                  <div style={{ fontSize: 13, color: colors.textSecondary }}>Mitglieder</div>
                </div>
                <div style={{ width: 1, background: colors.border }} />
                <div>
                  <div style={{ fontSize: 32, fontWeight: 700, color: colors.green, fontFamily: 'monospace' }}>
                    {formatPrice(totalAmount)}

              </div>

              {usersWithDeckel.length === 0 ? (

              ) : (
                <>

    // ========== STATISTICS PAGE ==========
    function StatisticsPage({ transactions }) {
      const [selectedMonth, setSelectedMonth] = useState(() => {
        const now = new Date();
        return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
      });

      const monthNames = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 
                          'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];

      const parseDate = (dateStr) => {
        const [datePart] = dateStr.split(' ');
        const [day, month, year] = datePart.split('.');
        return new Date(year, month - 1, day);
      };

      const getMonthKey = (dateStr) => {
        const date = parseDate(dateStr);
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
      };

      const availableMonths = [...new Set(transactions.map(t => getMonthKey(t.date)))].sort().reverse();

      const monthTransactions = transactions.filter(t => 
        getMonthKey(t.date) === selectedMonth && t.type === 'consumption'
      );

      // Calculate stats
      const productStats = {};
      monthTransactions.forEach(t => {
        if (!productStats[t.item]) {
          productStats[t.item] = { qty: 0, revenue: 0 };
        }
        productStats[t.item].qty += t.qty;
        productStats[t.item].revenue += t.qty * t.price;
      });

      const topProducts = Object.entries(productStats)
        .map(([name, stats]) => ({ name, ...stats }))
        .sort((a, b) => b.revenue - a.revenue);

      const totalRevenue = topProducts.reduce((sum, p) => sum + p.revenue, 0);
      const totalItems = topProducts.reduce((sum, p) => sum + p.qty, 0);

      // Daily revenue for chart
      const dailyRevenue = {};
      monthTransactions.forEach(t => {
        const day = parseDate(t.date).getDate();
        dailyRevenue[day] = (dailyRevenue[day] || 0) + (t.qty * t.price);
      });

      const [year, month] = selectedMonth.split('-');
      const daysInMonth = new Date(year, month, 0).getDate();
      const chartData = Array.from({ length: daysInMonth }, (_, i) => ({
        day: i + 1,
        revenue: dailyRevenue[i + 1] || 0
      }));

      const maxRevenue = Math.max(...chartData.map(d => d.revenue), 1);

      const navigateMonth = (direction) => {
        const currentIndex = availableMonths.indexOf(selectedMonth);
        const newIndex = currentIndex + direction;
        if (newIndex >= 0 && newIndex < availableMonths.length) {
          setSelectedMonth(availableMonths[newIndex]);
        }
      };

      const formatMonthLabel = (monthKey) => {
        const [y, m] = monthKey.split('-');
        return `${monthNames[parseInt(m) - 1]} ${y}`;
      };

      return (
        <div>
          {/* Month Navigation */}
          <div style={{
            ...styles.card, marginBottom: 20,
            display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          }}>
            <button
              onClick={() => navigateMonth(1)}
              disabled={availableMonths.indexOf(selectedMonth) === availableMonths.length - 1}
              style={{
                ...styles.btn, ...styles.btnSecondary,
                opacity: availableMonths.indexOf(selectedMonth) === availableMonths.length - 1 ? 0.5 : 1,
              }}
            ><ChevronLeftIcon /> Vorheriger</button>
            <div style={{ textAlign: 'center' }}>
              <div style={{ fontSize: 24, fontWeight: 700 }}>{formatMonthLabel(selectedMonth)}</div>
              <div style={{ fontSize: 14, color: colors.textSecondary }}>
                {monthTransactions.length} Transaktionen
              </div>
            </div>
            <button
              onClick={() => navigateMonth(-1)}
              disabled={availableMonths.indexOf(selectedMonth) === 0}
              style={{
                ...styles.btn, ...styles.btnSecondary,
                opacity: availableMonths.indexOf(selectedMonth) === 0 ? 0.5 : 1,
              }}
            >Nächster <ChevronRightIcon /></button>
          </div>

          {/* Stats Overview */}
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 20, marginBottom: 20 }}>
            <div style={{...styles.card, marginBottom: 0, textAlign: 'center'}}>
              <div style={{ fontSize: 36, fontWeight: 700, color: colors.green, fontFamily: 'monospace' }}>
                {formatPrice(totalRevenue)}
              </div>
              <div style={{ fontSize: 14, color: colors.textSecondary }}>Gesamtumsatz</div>
            </div>
            <div style={{...styles.card, marginBottom: 0, textAlign: 'center'}}>
              <div style={{ fontSize: 36, fontWeight: 700, color: colors.blue }}>
                {totalItems}
              </div>
              <div style={{ fontSize: 14, color: colors.textSecondary }}>Verkaufte Artikel</div>
            </div>
            <div style={{...styles.card, marginBottom: 0, textAlign: 'center'}}>
              <div style={{ fontSize: 36, fontWeight: 700, color: colors.orange }}>
                {topProducts.length > 0 ? topProducts[0].name : '-'}
              </div>
              <div style={{ fontSize: 14, color: colors.textSecondary }}>Top Produkt</div>
            </div>
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 20 }}>
            {/* Revenue Chart */}
            <div style={styles.card}>
              <h3 style={{ fontSize: 16, fontWeight: 600, marginBottom: 20 }}>📈 Tagesumsatz</h3>
              <div style={{ height: 200, display: 'flex', alignItems: 'flex-end', gap: 2 }}>
                {chartData.map((d, i) => (
                  <div key={i} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
                    <div style={{
                      width: '100%',
                      height: `${(d.revenue / maxRevenue) * 160}px`,
                      background: d.revenue > 0 
                        ? `linear-gradient(180deg, ${colors.blue} 0%, ${colors.green} 100%)`
                        : 'rgba(71, 85, 105, 0.2)',
                      borderRadius: '4px 4px 0 0',
                      minHeight: 2,
                      transition: 'height 0.3s',
                    }} title={`${d.day}. - ${formatPrice(d.revenue)}`} />
                    {(d.day === 1 || d.day === 10 || d.day === 20 || d.day === daysInMonth) && (
                      <span style={{ fontSize: 10, color: colors.textMuted, marginTop: 4 }}>{d.day}</span>
                    )}
                  </div>
                ))}
              </div>
            </div>

            {/* Top Products */}
            <div style={styles.card}>
              <h3 style={{ fontSize: 16, fontWeight: 600, marginBottom: 20 }}>🏆 Top Produkte</h3>
              {topProducts.length === 0 ? (
                <div style={{ padding: 40, textAlign: 'center', color: colors.textMuted }}>
                  Keine Daten für diesen Monat
                </div>
              ) : (
                <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
                  {topProducts.slice(0, 6).map((product, i) => (
                    <div key={product.name} style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                      <span style={{
                        width: 28, height: 28, borderRadius: 14,
                        background: i === 0 ? 'linear-gradient(135deg, #fbbf24, #f59e0b)' 
                                 : i === 1 ? 'linear-gradient(135deg, #9ca3af, #6b7280)'
                                 : i === 2 ? 'linear-gradient(135deg, #d97706, #b45309)'
                                 : 'rgba(71, 85, 105, 0.3)',
                        display: 'flex', alignItems: 'center', justifyContent: 'center',
                        fontSize: 12, fontWeight: 700, color: i < 3 ? '#1f2937' : colors.textSecondary,
                      }}>{i + 1}</span>
                      <div style={{ flex: 1 }}>
                        <div style={{ fontSize: 14, fontWeight: 500 }}>{product.name}</div>
                        <div style={{ fontSize: 12, color: colors.textSecondary }}>{product.qty}× verkauft</div>
                      </div>
                      <div style={{ 
                        fontFamily: 'monospace', fontWeight: 600, color: colors.green 
                      }}>{formatPrice(product.revenue)}</div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>

          {/* Product Breakdown */}
          <div style={{...styles.card, marginTop: 20}}>
            <h3 style={{ fontSize: 16, fontWeight: 600, marginBottom: 20 }}>📊 Umsatz nach Produkt</h3>
            {topProducts.length === 0 ? (
              <div style={{ padding: 40, textAlign: 'center', color: colors.textMuted }}>
                Keine Daten für diesen Monat
              </div>
            ) : (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                {topProducts.map(product => {
                  const percentage = totalRevenue > 0 ? (product.revenue / totalRevenue) * 100 : 0;
                  return (
                    <div key={product.name}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 4 }}>
                        <span style={{ fontSize: 14 }}>{product.name}</span>
                        <span style={{ fontSize: 14, color: colors.textSecondary }}>
                          {product.qty}× · {formatPrice(product.revenue)} ({percentage.toFixed(1)}%)
                        </span>
                      </div>
                      <div style={{
                        height: 8, background: 'rgba(71, 85, 105, 0.2)', borderRadius: 4, overflow: 'hidden'
                      }}>
                        <div style={{
                          height: '100%', width: `${percentage}%`,
                          background: `linear-gradient(90deg, ${colors.blue} 0%, ${colors.green} 100%)`,
                          borderRadius: 4, transition: 'width 0.5s',
                        }} />
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      );
    }

    // ========== ADMIN DASHBOARD ==========
    function AdminDashboard({ onLogout }) {
      const [users, setUsers] = useState(MOCK_USERS);
      const [transactions, setTransactions] = useState(MOCK_TRANSACTIONS);
      const [settlements, setSettlements] = useState(MOCK_SETTLEMENTS);
      const [products, setProducts] = useState(MOCK_PRODUCTS);
      const [search, setSearch] = useState('');
      const [editUser, setEditUser] = useState(null);
      const [isNewUser, setIsNewUser] = useState(false);
      const [postenUser, setPostenUser] = useState(null);
      const [deleteUser, setDeleteUser] = useState(null);
      const [showExport, setShowExport] = useState(false);
      const [lastSettlement, setLastSettlement] = useState(INITIAL_LAST_SETTLEMENT);
      const [activePage, setActivePage] = useState('users'); // users, products, journal, settlements, stats

      const filteredUsers = users.filter(u => 
        u.firstName.toLowerCase().includes(search.toLowerCase()) ||
        u.lastName.toLowerCase().includes(search.toLowerCase()) ||
        u.rfid.toLowerCase().includes(search.toLowerCase())
      );

      const totalDeckel = users.reduce((sum, u) => sum + u.deckel, 0);

      const handleSaveUser = (userData) => {
        if (isNewUser) {
          setUsers(prev => [...prev, userData]);
        } else {
          setUsers(prev => prev.map(u => u.id === userData.id ? userData : u));
        }
        setEditUser(null);
        setIsNewUser(false);
      };

      const handleDeleteUser = () => {
        setUsers(prev => prev.filter(u => u.id !== deleteUser.id));
        setDeleteUser(null);
      };

      const handleAddCorrection = (userId, correction) => {
        setUsers(prev => prev.map(u => {
          if (u.id === userId) {
            const newDeckel = u.deckel + correction.amount;
            return {
              ...u,
              deckel: Math.max(0, newDeckel),
              korrekturen: [...u.korrekturen, correction]
            };
          }
          return u;
        }));
        // Add to transactions
        const user = users.find(u => u.id === userId);
        if (user) {
          setTransactions(prev => [{
            id: Date.now(),
            date: correction.date,
            user: `${user.firstName} ${user.lastName}`,
            rfid: user.rfid,
            item: `Korrektur: ${correction.comment}`,
            qty: 1,
            price: correction.amount,
            type: 'correction'
          }, ...prev]);
        }
        setPostenUser(prev => {
          if (prev && prev.id === userId) {
            const newDeckel = prev.deckel + correction.amount;
            return {
              ...prev,
              deckel: Math.max(0, newDeckel),
              korrekturen: [...prev.korrekturen, correction]
            };
          }
          return prev;
        });
      };

      const handleSettle = () => {
        const today = new Date().toLocaleDateString('de-DE');
        const usersWithDeckel = users.filter(u => u.deckel > 0);
        const totalAmount = usersWithDeckel.reduce((sum, u) => sum + u.deckel, 0);
        
        // Create new settlement record
        const newSettlement = {
          id: Date.now(),
          date: today,
          totalAmount: totalAmount,
          userCount: usersWithDeckel.length,
          users: usersWithDeckel.map(u => ({
            userId: u.id,
            name: `${u.firstName} ${u.lastName}`,
            rfid: u.rfid,
            iban: u.iban,
            bic: u.bic,
            amount: u.deckel,
            posten: [...u.offenePosten, ...u.korrekturen.map(k => ({
              date: k.date,
              item: `Korrektur: ${k.comment}`,
              qty: 1,
              price: k.amount
            }))]
          }))
        };
        
        setSettlements(prev => [newSettlement, ...prev]);
        setUsers(prev => prev.map(u => ({
          ...u,
          deckel: 0,
          offenePosten: [],
          korrekturen: []
        })));
        setLastSettlement(today);
        setShowExport(false);
      };

      const handleUndoSettlement = (settlement) => {
        // Restore user balances from settlement
        setUsers(prev => prev.map(u => {
          const settledUser = settlement.users.find(su => su.userId === u.id);
          if (settledUser) {
            return {
              ...u,
              deckel: u.deckel + settledUser.amount,
              offenePosten: [...u.offenePosten, ...settledUser.posten.filter(p => !p.item.startsWith('Korrektur:'))]
            };
          }
          return u;
        }));
        
        // Remove settlement from list
        setSettlements(prev => prev.filter(s => s.id !== settlement.id));
        
        // Update last settlement date to previous one
        const remainingSettlements = settlements.filter(s => s.id !== settlement.id);
        if (remainingSettlements.length > 0) {
          setLastSettlement(remainingSettlements[0].date);
        } else {
          setLastSettlement('-');
        }
      };

      // Product handlers
      const handleAddProduct = (productData) => {
        setProducts(prev => [...prev, productData]);
      };

      const handleEditProduct = (productData) => {
        setProducts(prev => prev.map(p => p.id === productData.id ? productData : p));
      };

      const handleDeleteProduct = (productId) => {
        setProducts(prev => prev.filter(p => p.id !== productId));
      };

      const navItems = [
        { key: 'users', label: 'Mitglieder', icon: <UsersIcon /> },
        { key: 'products', label: 'Produkte', icon: <PackageIcon /> },
        { key: 'journal', label: 'Buchungsjournal', icon: <BookIcon /> },
        { key: 'settlements', label: 'Abrechnungen', icon: <ReceiptIcon /> },
        { key: 'stats', label: 'Statistik', icon: <ChartIcon /> },
      ];

      return (
        <div style={styles.container}>
          {/* Header */}
          <header style={styles.header}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 32 }}>
              <div style={styles.headerTitle}>
                <span>FRGS-Bar-Admin</span>
              </div>
              {/* Navigation Tabs */}
              <nav style={{ display: 'flex', gap: 4 }}>
                {navItems.map(item => (
                  <button
                    key={item.key}
                    onClick={() => setActivePage(item.key)}
                    style={{
                      display: 'flex', alignItems: 'center', gap: 8,
                      padding: '10px 16px', borderRadius: 8, border: 'none',
                      background: activePage === item.key ? 'rgba(59, 130, 246, 0.2)' : 'transparent',
                      color: activePage === item.key ? colors.blue : colors.textSecondary,
                      fontSize: 14, fontWeight: 500, cursor: 'pointer',
                      transition: 'all 0.15s',
                    }}
                  >
                    {item.icon} {item.label}
                  </button>
                ))}
              </nav>
            </div>
            <div style={styles.headerRight}>
              <div style={styles.adminBadge}>
                <UserIcon /> Admin
              </div>
              <button onClick={onLogout} style={styles.logoutBtn}>
                <LogoutIcon /> Abmelden
              </button>
            </div>
          </header>

          <main style={styles.main}>
            {activePage === 'users' && (
              <>
                {/* Stats Cards */}
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 20, marginBottom: 24 }}>
                  <div style={{...styles.card, marginBottom: 0, display: 'flex', alignItems: 'center', gap: 16}}>
                    <div style={{
                      width: 56, height: 56, borderRadius: 14,
                      background: 'rgba(59, 130, 246, 0.15)',
                      display: 'flex', alignItems: 'center', justifyContent: 'center',
                      color: colors.blue,
                    }}><UsersIcon /></div>
                    <div>
                      <div style={{ fontSize: 28, fontWeight: 700 }}>{users.length}</div>
                      <div style={{ fontSize: 14, color: colors.textSecondary }}>Mitglieder</div>
                    </div>
                  </div>

                  <div style={{...styles.card, marginBottom: 0, display: 'flex', alignItems: 'center', gap: 16}}>
                    <div style={{
                      width: 56, height: 56, borderRadius: 14,
                      background: 'rgba(249, 115, 22, 0.15)',
                      display: 'flex', alignItems: 'center', justifyContent: 'center',
                      color: colors.orange,
                    }}><BankIcon /></div>
                    <div>
                      <div style={{ fontSize: 28, fontWeight: 700, fontFamily: 'monospace' }}>{formatPrice(totalDeckel)}</div>
                      <div style={{ fontSize: 14, color: colors.textSecondary }}>Offene Deckel gesamt</div>
                    </div>
                  </div>

                  <div style={{...styles.card, marginBottom: 0, display: 'flex', alignItems: 'center', gap: 16}}>
                    <div style={{
                      width: 56, height: 56, borderRadius: 14,
                      background: 'rgba(34, 197, 94, 0.15)',
                      display: 'flex', alignItems: 'center', justifyContent: 'center',
                      color: colors.green,
                    }}>
                      <CalendarIcon />
                    </div>
                    <div>
                      <div style={{ fontSize: 28, fontWeight: 700 }}>
                        {lastSettlement}
                      </div>
                      <div style={{ fontSize: 14, color: colors.textSecondary }}>Letzte Abrechnung</div>
                    </div>
                  </div>
                </div>

                {/* Users Table */}
                <div style={styles.card}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 20 }}>
                    <h2 style={{ fontSize: 18, fontWeight: 600 }}>Mitglieder</h2>
                    <div style={{ display: 'flex', gap: 12 }}>
                      <div style={{ position: 'relative' }}>
                        <SearchIcon style={{ position: 'absolute', left: 12, top: '50%', transform: 'translateY(-50%)', color: colors.textMuted }} />
                        <input
                          value={search}
                          onChange={(e) => setSearch(e.target.value)}
                          placeholder="Suchen..."
                          style={{...styles.input, width: 250, paddingLeft: 40}}
                        />
                      </div>
                      <button onClick={() => { setIsNewUser(true); setEditUser({}); }} style={{...styles.btn, ...styles.btnPrimary}}>
                        <PlusIcon /> Neues Mitglied
                      </button>
                    </div>
                  </div>

                  <div style={{ overflowX: 'auto' }}>
                    <table style={styles.table}>
                      <thead>
                        <tr>
                          <th style={styles.th}>Name</th>
                          <th style={styles.th}>RFID</th>
                          <th style={styles.th}>IBAN</th>
                          <th style={styles.th}>BIC</th>
                          <th style={styles.th}>Mitglied seit</th>
                          <th style={{...styles.th, textAlign: 'right'}}>Deckel</th>
                          <th style={{...styles.th, textAlign: 'right'}}>Aktionen</th>
                        </tr>
                      </thead>
                      <tbody>
                        {filteredUsers.map(user => (
                          <tr key={user.id} style={{ transition: 'background 0.15s' }}>
                            <td style={styles.td}>
                              <div style={{ fontWeight: 500 }}>{user.firstName} {user.lastName}</div>
                            </td>
                            <td style={{...styles.td, fontFamily: 'monospace', color: colors.textSecondary}}>
                              {user.rfid}
                            </td>
                            <td style={{...styles.td, fontFamily: 'monospace', fontSize: 12, color: colors.textSecondary}}>
                              {formatIban(user.iban)}
                            </td>
                            <td style={{...styles.td, fontFamily: 'monospace', fontSize: 12, color: colors.textSecondary}}>
                              {user.bic}
                            </td>
                            <td style={{...styles.td, color: colors.textSecondary, fontSize: 13}}>
                              {user.createdAt}
                            </td>
                            <td style={{...styles.td, textAlign: 'right'}}>
                              <span style={{
                                fontWeight: 600, fontFamily: 'monospace',
                                color: user.deckel > 0 ? colors.orange : colors.green,
                              }}>
                                {formatPrice(user.deckel)}
                              </span>
                            </td>
                            <td style={{...styles.td, textAlign: 'right'}}>
                              <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
                                <button
                                  onClick={() => setPostenUser(user)}
                                  title="Offene Posten"
                                  style={{
                                    width: 36, height: 36, borderRadius: 8, border: 'none',
                                    background: 'rgba(249, 115, 22, 0.1)', color: colors.orange,
                                    cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center',
                                  }}
                                ><EyeIcon /></button>
                                <button
                                  onClick={() => { setIsNewUser(false); setEditUser(user); }}
                                  title="Bearbeiten"
                                  style={{
                                    width: 36, height: 36, borderRadius: 8, border: 'none',
                                    background: 'rgba(59, 130, 246, 0.1)', color: colors.blue,
                                    cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center',
                                  }}
                                ><EditIcon /></button>
                                <button
                                  onClick={() => setDeleteUser(user)}
                                  title="Löschen"
                                  style={{
                                    width: 36, height: 36, borderRadius: 8, border: 'none',
                                    background: 'rgba(239, 68, 68, 0.1)', color: colors.red,
                                    cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center',
                                  }}
                                ><TrashIcon /></button>
                              </div>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>

                    {filteredUsers.length === 0 && (
                      <div style={{
                        padding: 40, textAlign: 'center', color: colors.textMuted,
                      }}>
                        Keine Mitglieder gefunden
                      </div>
                    )}
                  </div>
                </div>
              </>
            )}

            {activePage === 'products' && (
              <ProductsPage
                products={products}
                onAddProduct={handleAddProduct}
                onEditProduct={handleEditProduct}
                onDeleteProduct={handleDeleteProduct}
              />
            )}

            {activePage === 'journal' && (
              <JournalPage transactions={transactions} />
            )}

            {activePage === 'settlements' && (
              <SettlementsPage 
                settlements={settlements} 
                onUndo={handleUndoSettlement}
                onCreateSettlement={() => setShowExport(true)}
              />
            )}

            {activePage === 'stats' && (
              <StatisticsPage transactions={transactions} />
            )}
          </main>

          {/* Modals */}
          {editUser && (
            <UserModal
              user={isNewUser ? null : editUser}
              isNew={isNewUser}
              onSave={handleSaveUser}
              onClose={() => { setEditUser(null); setIsNewUser(false); }}
            />
          )}
          {postenUser && (
            <PostenModal 
              user={postenUser} 
              onClose={() => setPostenUser(null)}
              onAddCorrection={handleAddCorrection}
              settlements={settlements}
            />
          )}
          {deleteUser && (
            <DeleteModal
              user={deleteUser}
              onConfirm={handleDeleteUser}
              onClose={() => setDeleteUser(null)}
            />
          )}
          {showExport && (
            <ExportModal 
              users={users} 
              onClose={() => setShowExport(false)}
              onSettle={handleSettle}
              lastSettlement={lastSettlement}
            />
          )}
        </div>
      );
    }

    // ========== MAIN APP ==========
    function App() {
      const [isLoggedIn, setIsLoggedIn] = useState(false);

      return isLoggedIn ? (
        <AdminDashboard onLogout={() => setIsLoggedIn(false)} />
      ) : (
        <LoginScreen onLogin={() => setIsLoggedIn(true)} />
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
