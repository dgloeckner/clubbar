; Club Bar — per-directory PHP configuration (ADR-0031 layer L1)
;
; Advisory only: nothing in the application may depend on this file being
; read. Under CGI/FPM (IONOS, the reference target) this is the per-directory
; ini file, re-read on a TTL (user_ini.cache_ttl, 300s by default) rather than
; per request — whether a given tariff honours it at all is a property of the
; host, not of this package.
;
; It carries the PHP_INI_PERDIR directives RuntimeHardening.php cannot reach
; from code. upload_max_filesize/post_max_size are sized above the 10 MB
; mandate upload limit MandateDocumentService.php enforces in the application
; itself, so this file only widens what PHP lets through the door — it never
; is the limit. If a host ignores this file, uploads that the application
; would accept can be rejected earlier by PHP; the self-check (#247) reports
; the effective values so that gap is visible rather than silent.
;
; Do not add a bare directive PHP would refuse here (this is not .htaccess,
; so PHP_INI_SYSTEM values such as expose_php or disable_functions are simply
; ignored, not a 500 — but they still would not do anything).

upload_max_filesize = 12M
post_max_size = 14M
