name: clubbar_terminal
description: "Native Flutter POS terminal for Club Bar system."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Database & ORM (compatible versions - drift_dev requires older sqlite3)
  drift: ^2.32.0
  sqlite3_flutter_libs: ^0.6.0
  sqflite_common: ^2.5.6
  sqflite_common_ffi: ^2.4.0+2 # Compatible with drift_dev

  # Networking
  http: ^1.6.0
  chopper: ^8.5.1

  # JSON serialization
  json_annotation: ^4.11.0

  # State Management
  provider: ^6.1.5+1

  # Navigation
  go_router: ^17.1.0

  # Animations & UI
  confetti: ^0.8.0
  flutter_svg: ^2.2.4

  # Date/Time (immutable)
  intl: ^0.20.2

  # Logging
  logger: ^2.7.0

  # UUID generation
  uuid: ^4.5.3

  # Desktop window management (macOS/Linux/Windows)
  window_manager: ^0.5.1

  # Audio feedback
  audioplayers: ^6.6.0

  # Platform-specific paths (ADR-0019)
  path_provider: ^2.1.0
  path: ^1.9.1

  collection: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  fake_async: ^1.3.1

  # Code Generation
  drift_dev: ^2.32.0
  build_runner: ^2.13.1
  swagger_dart_code_generator: 4.1.1
  json_serializable: ^6.13.1
  chopper_generator: ^8.0.0

  # Testing (note: flutter_test pins test_api, use compatible test version)
  mocktail: ^1.0.4

  # Linting
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true  # Enable code generation for localizations
  assets:
    - assets/icons/products/
    - assets/icons/categories/
    - assets/icons/ui/
    - assets/sounds/

  # #298: the header clock requested this family with no font bundled, so it
  # silently fell back to the platform default. Bundled instead of dropping
  # the declaration — a monospaced clock avoids width jitter as digits tick.
  fonts:
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
