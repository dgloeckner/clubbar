targets:
  $default:
    sources:
      - lib/**
      - api/**
      - $package$
    builders:
      swagger_dart_code_generator:
        options:
          input_folder: "api/"
          output_folder: "lib/generated/"
          with_base_url: false
          classes_with_nullabe_lists:
            - ".*"
          build_only_models: false
