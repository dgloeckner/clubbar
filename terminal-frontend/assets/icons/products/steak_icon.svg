<svg viewBox="0 0 48 48">
  <!-- plate -->
  <ellipse cx="24" cy="40" rx="19" ry="6" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2"/>
  <!-- shadow under steak -->
  <ellipse cx="24" cy="38" rx="15" ry="4" fill="#E5E7EB" opacity=".7"/>
  <!-- steak body -->
  <path d="M8,30Q6,20 14,14Q20,10 28,12Q36,10 42,18Q46,26 40,34Q34,40 24,38Q12,38 8,30Z" fill="#92400E" stroke="#451A03" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- fat marbling -->
  <path d="M14,22Q18,18 22,22Q26,26 30,20" fill="none" stroke="#FDE68A" stroke-width="2" stroke-linecap="round" opacity=".6"/>
  <path d="M20,30Q24,26 28,30" fill="none" stroke="#FDE68A" stroke-width="1.5" stroke-linecap="round" opacity=".5"/>
  <!-- grill marks -->
  <line x1="16" y1="16" x2="12" y2="28" stroke="#451A03" stroke-width="3" stroke-linecap="round" opacity=".5"/>
  <line x1="24" y1="14" x2="20" y2="28" stroke="#451A03" stroke-width="3" stroke-linecap="round" opacity=".5"/>
  <line x1="32" y1="14" x2="28" y2="28" stroke="#451A03" stroke-width="3" stroke-linecap="round" opacity=".5"/>
  <!-- bone handle -->
  <rect x="36" y="32" width="10" height="5" rx="2.5" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2"/>
  <circle cx="36" cy="34.5" r="3" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2"/>
  <circle cx="46" cy="34.5" r="3" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2"/>
</svg>
