  <line x1="24" y1="27.5" x2="22" y2="34.5" stroke="#7C2D12" stroke-width="2" stroke-linecap="round" opacity=".6"/>
  <line x1="31" y1="28" x2="29" y2="35" stroke="#7C2D12" stroke-width="2" stroke-linecap="round" opacity=".6"/>
