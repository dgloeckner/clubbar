---
# Codacy Analysis CLI configuration, read by the "Codacy Security Scan" workflow
# (.github/workflows/codacy.yml).
#
# The workflow runs the CLI without a project token, so Codacy has no server-side
# configuration to fall back on: every default tool runs over every file in the
# checkout. This file is that missing configuration — it keeps the scan on
# first-party, shipped source code.
#
# The volume matters as much as the content: GitHub accepts at most 25,000
# results per SARIF run, and an unscoped analysis of this repository produced
# more than that from PHP_CodeSniffer alone.

exclude_paths:
  # Binary assets — not code, and nothing any of the tools can say about them.
  - '**.png'
  - '**.jpg'
  - '**.jpeg'
  - '**.gif'
  - '**.ico'
  - '**.icns'
  - '**.mp3'
  - '**.mp4'
  - '**.wav'
  - '**.ttf'
  - '**.otf'
  - '**.woff'
  - '**.woff2'
  - '**.pdf'
  - '**.zip'

  # Third-party and generated code — findings here are not actionable by us.
  - '**/node_modules/**'
  - '**/vendor/**'
  - '**.min.js'
  - 'admin-frontend/src/api/generated/**'
  - 'admin-frontend/dist/**'
  - '**/package-lock.json'
  - '**/composer.lock'
  - '**/pubspec.lock'

  # Flutter platform scaffolding, generated by `flutter create` and never edited
  # by hand (Swift/Objective-C/C++/CMake/Xcode project files).
  - 'terminal-frontend/android/**'
  - 'terminal-frontend/ios/**'
  - 'terminal-frontend/linux/**'
  - 'terminal-frontend/macos/**'
  - 'terminal-frontend/windows/**'
  - 'terminal-frontend/web/**'

  # Build output and stray artifacts that ended up in the repository.
  - 'terminal-frontend/build/**'
  - 'terminal-frontend/terminal-frontend/**'
  - '**.log'
  - '**.logls'
  - '**.bak'
  - 'e2etests/results/**'
  - 'e2etests/playwright-report/**'
  - 'logs/**'
  - '.idea/**'

  # Test suites. This is a security scan of what we ship; the test code is
  # reviewed on its own terms, and its volume is most of what pushed the report
  # past GitHub's per-run limit.
  - 'backend/tests/**'
  - 'e2etests/**'
  - 'terminal-frontend/test/**'
  - 'terminal-frontend/integration_test/**'

  # Documentation, specifications and design assets.
  - 'adr/**'
  - 'docs/**'
  - 'plans/**'
  - 'use-cases/**'
  - 'research/**'
  - 'artwork/**'
  - 'prototypes/**'
  - '.claude/**'

engines:
  eslint:
    # Codacy ships its own ESLint image, which resolves plugins from its own
    # node_modules: it cannot load `eslint-plugin-react-refresh` required by
    # admin-frontend/.eslintrc.cjs, and its ESLint 8 does not understand the flat
    # config used elsewhere in the repo. The tool aborts instead of reporting, so
    # exclude the sources it cannot parse — TypeScript and JavaScript there are
    # still covered by our own `npm run lint` in the build workflow.
    exclude_paths:
      - 'admin-frontend/**'
